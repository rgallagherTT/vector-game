<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KINETIC</title>
<link rel="icon" href="data:,">
<style>
:root{
  --tk:#46f0ff; --tk2:#9ffaff; --mag:#ff3cac; --heat:#ffb21f; --hot:#ff3b4f; --ok:#6dffb0;
  --ink:#e8f3ff; --dim:#8ea3b8; --faint:#4d5d70; --panel:rgba(6,9,16,.74); --line:rgba(120,220,255,.22);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04060b;color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;outline:none}
.hidden{display:none!important}
button{font:inherit;color:var(--ink);background:rgba(70,240,255,.06);border:1px solid var(--line);padding:9px 16px;border-radius:4px;cursor:pointer;letter-spacing:.06em}
button:hover{background:rgba(70,240,255,.16);border-color:var(--tk)}
button.primary{background:var(--tk);color:#021015;border-color:transparent;font-weight:700}
button.primary:hover{filter:brightness(1.12)}
button:disabled{opacity:.35;cursor:default}
.mono{font-family:var(--mono)}
/* ---------------- HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none;font-size:13px;text-shadow:0 0 6px rgba(0,0,0,.8)}
#hud.off{display:none}
#heatbox{position:absolute;left:22px;top:18px;width:300px}
#heaticons{display:flex;gap:6px}
.hicon{width:44px;height:30px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);background:rgba(255,178,31,.10);border:none;position:relative}
.hicon::after{content:"";position:absolute;inset:3px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);background:rgba(255,178,31,.06)}
.hicon.on{background:var(--heat);box-shadow:0 0 14px var(--heat)}
.hicon.on::after{background:linear-gradient(180deg,#ffe08a,#ff8a00)}
.hicon.on.l5{background:var(--hot)} .hicon.on.l5::after{background:linear-gradient(180deg,#ff9aa6,#ff1f3d)}
.hicon.flash{animation:hflash .5s infinite alternate}
@keyframes hflash{to{filter:brightness(1.8)}}
#heatmeter{height:4px;margin-top:6px;background:rgba(255,178,31,.12);position:relative;overflow:hidden}
#heatmeter i{position:absolute;left:0;top:0;bottom:0;background:var(--heat);box-shadow:0 0 8px var(--heat)}
#heatname{font-family:var(--mono);font-size:11px;letter-spacing:.22em;margin-top:6px;color:var(--heat)}
#status{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;padding:4px 10px;border:1px solid currentColor}
#status.seen{color:var(--hot);box-shadow:0 0 12px rgba(255,59,79,.5)}
#status.search{color:var(--heat)}
#status.clear{color:var(--ok)}
#district{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--dim);margin-top:8px}
#scorebox{position:absolute;right:22px;top:16px;text-align:right}
#score{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:.04em;color:#fff;text-shadow:0 0 12px rgba(70,240,255,.6)}
#mult{font-family:var(--mono);font-size:15px;color:var(--tk)}
#combo{font-family:var(--mono);font-size:13px;color:var(--mag);min-height:18px}
#minimap{margin-top:8px;width:184px;height:184px;border:1px solid var(--line);border-radius:50%;background:rgba(4,8,14,.7);box-shadow:0 0 18px rgba(70,240,255,.14) inset}
#vitals{position:absolute;left:22px;bottom:22px;width:290px}
.bar{height:7px;background:rgba(255,255,255,.07);margin:4px 0 9px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,98% 100%,0 100%)}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .08s linear}
.bar.hp i{background:linear-gradient(90deg,#ff6a7c,#ffd1d7)}
.bar.mind i{background:linear-gradient(90deg,#1ab8ff,var(--tk))}
.bar.ovl i{background:linear-gradient(90deg,#b13cff,var(--mag))}
.bar.ovl.full i{animation:hflash .4s infinite alternate}
.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
#slots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:7px}
.slot{width:58px;height:58px;border:1px solid var(--line);background:rgba(4,8,14,.66);position:relative;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%);overflow:hidden}
.slot .k{position:absolute;left:5px;top:3px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.slot .n{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9.5px;letter-spacing:.08em;color:var(--ink)}
.slot .g{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:19px;color:var(--tk)}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
.slot.active{border-color:var(--tk);box-shadow:0 0 14px rgba(70,240,255,.5) inset}
.slot.locked{opacity:.28}
.slot.locked .g{color:var(--faint)}
#reticle{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%)}
#reticle svg{width:100%;height:100%;overflow:visible}
#hint{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.14em;white-space:nowrap}
#toasts{position:absolute;right:24px;top:280px;width:320px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.toast{font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;letter-spacing:.06em;animation:tin .18s ease-out, tout .5s ease-in 1.6s forwards}
.toast b{color:var(--tk)} .toast.big{font-size:18px;color:var(--mag)} .toast.heat{color:var(--heat)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--mono);font-weight:800;font-size:44px;letter-spacing:.35em;color:#fff;text-shadow:0 0 24px var(--hot);opacity:0;transition:opacity .25s}
#banner small{display:block;font-size:14px;letter-spacing:.3em;color:var(--heat);margin-top:8px;font-weight:600}
#banner.show{opacity:1}
#ticker{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(90deg,rgba(255,59,79,.85),rgba(120,10,30,.7) 18%,rgba(4,6,12,.7) 30%);overflow:hidden;font-family:var(--mono);font-size:12px;line-height:22px;opacity:0;transition:opacity .4s}
#ticker.show{opacity:1}
#ticker .tag{position:absolute;left:0;top:0;bottom:0;padding:0 12px;background:#ff3b4f;color:#fff;font-weight:800;letter-spacing:.2em;z-index:2}
#ticker .run{position:absolute;white-space:nowrap;left:100%;color:#ffe9ec;letter-spacing:.06em}
#vitals,#slots{bottom:30px}
#bossbar{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:520px;text-align:center}
#bossbar .t{font-family:var(--mono);font-size:13px;letter-spacing:.4em;color:var(--hot);font-weight:800}
#bossbar .p{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--heat);margin-top:3px}
#bossbar .bar i{background:linear-gradient(90deg,#ff1f3d,#ff9a3d)}
#bosspips{display:flex;gap:4px;justify-content:center;margin-top:2px}
#bosspips span{width:14px;height:6px;background:var(--hot);box-shadow:0 0 6px var(--hot)}
#bosspips span.gone{background:rgba(255,255,255,.12);box-shadow:none}
#chal{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--ok);text-align:center;opacity:0;transition:opacity .3s}
#chal.show{opacity:1}
#damp{position:absolute;inset:0;box-shadow:0 0 160px 40px rgba(170,60,255,.0) inset;transition:box-shadow .3s}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,20,50,.55));opacity:0}
#gripring{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%)}
/* ---------------- screens ---------------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,rgba(4,10,20,.25),rgba(2,4,8,.82));z-index:10}
.screen .panel{background:var(--panel);border:1px solid var(--line);padding:26px 30px;min-width:420px;max-width:min(980px,94vw);max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(70,240,255,.08)}
.screen h2{margin:0 0 14px;font-family:var(--mono);letter-spacing:.3em;font-size:16px;color:var(--tk)}
#title{background:linear-gradient(90deg,rgba(2,4,8,.88),rgba(2,4,8,.25) 60%,rgba(2,4,8,0));justify-content:flex-start;padding-left:7vw}
#logo{font-family:var(--mono);font-weight:900;font-size:clamp(48px,8vw,104px);letter-spacing:.18em;color:#fff;text-shadow:0 0 18px var(--tk),0 0 60px rgba(70,240,255,.5);line-height:1}
#logo span{color:var(--tk)}
#tag{font-family:var(--mono);letter-spacing:.32em;color:var(--dim);font-size:12px;margin:12px 0 30px}
#menu{display:flex;flex-direction:column;gap:9px;width:300px}
#menu button{text-align:left;padding:12px 16px}
#kbal{font-family:var(--mono);color:var(--mag);margin-top:18px;letter-spacing:.12em;font-size:13px}
#daily-info{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{border:1px solid var(--line);padding:12px;background:rgba(70,240,255,.03);position:relative}
.card h3{margin:0 0 4px;font-size:13px;letter-spacing:.12em;font-family:var(--mono);color:#fff}
.card p{margin:0 0 8px;font-size:12px;color:var(--dim);line-height:1.4}
.card .lv{display:flex;gap:3px;margin-bottom:8px}
.card .lv span{flex:1;height:5px;background:rgba(255,255,255,.1)}
.card .lv span.on{background:var(--tk);box-shadow:0 0 6px var(--tk)}
.card.owned{border-color:var(--tk)}
.card.done{border-color:var(--ok)}
.card .cost{font-family:var(--mono);color:var(--mag);font-size:12px}
.sect{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim);margin:18px 0 8px}
table.rec{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
table.rec td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
table.rec td:last-child{text-align:right;color:var(--tk)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.new{color:var(--mag);font-weight:700;margin-left:6px}
#summary .big{font-family:var(--mono);font-size:40px;font-weight:800;color:#fff;letter-spacing:.06em}
#detainedflash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none;font-family:var(--mono);font-weight:900;font-size:clamp(40px,7vw,90px);letter-spacing:.4em;color:#fff;text-shadow:0 0 30px var(--hot);background:radial-gradient(ellipse,rgba(255,30,60,.1),rgba(0,0,0,.5))}
#help{font-size:12.5px;line-height:1.55}
#help kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:1px 5px;border-radius:3px;color:var(--tk)}
#help td{padding:2px 12px 2px 0;vertical-align:top}
#photo-ui,#replay-ui{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:8;font-family:var(--mono);font-size:12px;letter-spacing:.1em;background:var(--panel);border:1px solid var(--line);padding:8px 14px;color:var(--dim)}
#replay-ui b{color:var(--hot)}
#letterbox::before,#letterbox::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:7}
#letterbox::before{top:0} #letterbox::after{bottom:0}
#debug{position:fixed;left:8px;top:150px;z-index:20;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.72);color:#9f9;padding:8px 10px;white-space:pre;pointer-events:none;line-height:1.35}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:#04060b;font-family:var(--mono);letter-spacing:.3em;color:var(--tk)}
#loading .b{width:260px;height:2px;background:rgba(70,240,255,.15);margin-top:16px;overflow:hidden}
#loading .b i{display:block;height:100%;width:0;background:var(--tk);transition:width .2s}
#loading .e{color:var(--hot);letter-spacing:.04em;margin-top:18px;max-width:80vw;font-size:12px;white-space:pre-wrap}
select{background:#0b1220;color:var(--ink);border:1px solid var(--line);padding:6px 8px;font:inherit}
label.opt{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:8px 0;font-size:13px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;box-shadow:0 0 8px currentColor}
@media (max-width:760px){#minimap{width:120px;height:120px}#heatbox{width:220px}.hicon{width:32px;height:22px}#slots{transform:translateX(-50%) scale(.72);transform-origin:bottom center}#bossbar{width:80vw}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

</head>
<body>
<div id="view"></div>

<div id="hud" class="off">
  <div id="damp"></div>
  <div id="hurt"></div>
  <div id="heatbox">
    <div id="heaticons"><div class="hicon"></div><div class="hicon"></div><div class="hicon"></div><div class="hicon"></div><div class="hicon"></div></div>
    <div id="heatmeter"><i style="width:0"></i></div>
    <div id="heatname">CALM</div>
    <div id="status" class="clear">CLEAR</div>
    <div id="district">NEON ROW</div>
  </div>
  <div id="scorebox">
    <div id="score">0</div>
    <div id="mult">x1.0</div>
    <div id="combo"></div>
    <canvas id="minimap" width="184" height="184"></canvas>
  </div>
  <div id="bossbar" class="hidden">
    <div class="t" id="bossname">THE WARDEN</div>
    <div class="bar" style="margin:6px 0 4px"><i id="bosshp" style="width:100%"></i></div>
    <div id="bosspips"></div>
    <div class="p" id="bossphase">PHASE 1 — PULL THE ARMOUR PLATES</div>
  </div>
  <div id="chal"></div>
  <div id="reticle"><svg viewBox="-32 -32 64 64">
    <circle id="ret-ring" r="9" fill="none" stroke="#46f0ff" stroke-width="1.4" opacity=".85"/>
    <circle r="1.6" fill="#fff"/>
    <circle id="ret-charge" r="15" fill="none" stroke="#ff3cac" stroke-width="3" stroke-dasharray="0 200" transform="rotate(-90)" opacity=".95"/>
    <circle id="ret-grip" r="20" fill="none" stroke="#46f0ff" stroke-width="2.2" stroke-dasharray="0 200" transform="rotate(-90)" opacity=".7"/>
  </svg></div>
  <div id="hint"></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div id="vitals">
    <div class="lbl"><span>HEALTH</span><span id="hpv">100</span></div><div class="bar hp"><i id="hpbar" style="width:100%"></i></div>
    <div class="lbl"><span>MIND</span><span id="mindv">100</span></div><div class="bar mind"><i id="mindbar" style="width:100%"></i></div>
    <div class="lbl"><span>OVERLOAD</span><span id="ovlv">0%</span></div><div class="bar ovl" id="ovlwrap"><i id="ovlbar" style="width:0%"></i></div>
  </div>
  <div id="slots"></div>
  <div id="ticker"><div class="tag">MRA&nbsp;NEWS</div><div class="run" id="tickrun"></div></div>
</div>

<div id="title" class="screen hidden">
  <div>
    <div id="logo">KINE<span>T</span>IC</div>
    <div id="tag">ONE MIND · ONE CITY · NO LIMIT</div>
    <div id="menu">
      <button class="primary" id="b-play">PLAY</button>
      <button id="b-daily">DAILY RUN</button>
      <button id="b-tree">POWER TREE</button>
      <button id="b-chal">CHALLENGES</button>
      <button id="b-rec">RECORDS</button>
      <button id="b-cos">COSMETICS</button>
      <button id="b-set">SETTINGS</button>
      <button id="b-help">CONTROLS</button>
    </div>
    <div id="kbal"></div>
    <div id="daily-info"></div>
  </div>
</div>

<div id="sub" class="screen hidden"><div class="panel" id="subpanel"></div></div>
<div id="pause" class="screen hidden"><div class="panel">
  <h2>PAUSED</h2>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <button class="primary" id="p-resume">RESUME</button>
    <button id="p-help">CONTROLS</button>
    <button id="p-set">SETTINGS</button>
    <button id="p-photo">PHOTO MODE</button>
    <button id="p-quit">END RUN</button>
  </div>
</div></div>
<div id="summary" class="screen hidden"><div class="panel" id="sumpanel"></div></div>
<div id="detainedflash" class="hidden">DETAINED</div>
<div id="photo-ui" class="hidden">PHOTO MODE · WASD/Q/E move · mouse look · wheel focus · [ ] aperture · H hide this · P exit</div>
<div id="replay-ui" class="hidden"><b>● REPLAY</b> <span id="replay-what"></span> · SPACE skip</div>
<div id="letterbox" class="hidden"></div>
<div id="debug" class="hidden"></div>
<div id="loading"><div>KINETIC</div><div class="b"><i id="loadbar"></i></div><div id="loadmsg" style="font-size:11px;margin-top:10px;color:var(--dim);letter-spacing:.2em">LOADING</div><div class="e" id="loaderr"></div></div>

<script type="module">
/* =====================================================================================
   KINETIC — manifest
   One self-contained file. Three.js + Rapier from CDN via the import map. All art procedural.
   Search an anchor (e.g. "// §TELEKINESIS") to jump to a system.

   // §CONFIG       every tunable
   // §UTIL         rng, math, pools, storage
   // §RENDER       renderer, scene, camera, post-processing, quality
   // §TEXTURES     procedural canvas textures (facades, neon, ground, decals)
   // §REFLECT      planar reflection for the wet streets (puddle mask, ripples, blur)
   // §LIGHTS       pooled dynamic lights fed by neon, streetlights, sirens, fire
   // §PHYSICS      Rapier world, collision groups, body registry, contact events
   // §CHARACTERS   procedural skinned humanoids + pose library
   // §DISTRICTS    the four districts and their behaviours
   // §CITY         procedural city: streets, blocks, buildings, train, garage, subway
   // §PROPS        prop catalogue and spawning
   // §VEHICLES     car meshes, crumple, fire, explosions, traffic
   // §PEDS         pedestrians
   // §DESTRUCTION  glass, lampposts, hydrants, signs, decals
   // §FX           particles, shards, rain, splashes, shafts, shake
   // §PLAYER       movement, camera
   // §TELEKINESIS  aim, highlight, grab/pull, hold, throw, tether
   // §POWERS       push, slam, dodge, telekinetic jump
   // §POWERS2      debris shield, catch, levitate, heavy lift, vortex, overload
   // §PROJECTILES  bullets, stun bolts, rockets, sniper rounds, cannon shells
   // §UNITS        MRA officers, AI, vision, knockdowns (never killed)
   // §HEAT         heat points, levels 1–5, director, search and cooling
   // §HEAT4        air response   // §HELI  // §SNIPER  (drones live in §HEAT4)
   // §HEAT5        containment    // §DAMPENER
   // §WALKER       the Warden boss
   // §SCORE        score, multiplier, combos
   // §UNLOCKS      kinesis, power tree, challenges, daily run, records, cosmetics
   // §AUDIO        Web Audio SFX + heat-layered music
   // §HUD          HUD, minimap, news ticker
   // §MENUS        title, sub-screens, pause, summary
   // §PHOTO        photo mode
   // §REPLAY       end-of-run highlight replay
   // §DEBUG        ?debug=1 overlay and keys, ?bench=chaos / ?bench=warden
   // §LOOP         main loop
   ===================================================================================== */
import * as THREE from 'three';
import RAPIER from 'rapier';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const GAME_TITLE = "KINETIC";

// §CONFIG ------------------------------------------------------------------------------
const CONFIG = {
  seed: 1337,
  gravity: -17,
  physics: { maxSubsteps: 3, sleepDist: 140, contactThreshold: 4000 },
  city: {
    cols: 6, rows: 4, block: 64, street: 16, sidewalk: 4, alley: 6,
    quayZ: 344, seaDepth: -3, edgePad: 40,
  },
  player: {
    height: 1.8, radius: 0.38, walk: 5.2, run: 8.2, sprint: 12.5, accel: 42, airAccel: 14,
    jump: 8.6, tkJump: 22, tkJumpCost: 16, gravity: -24, coyote: 0.12,
    hp: 100, hpRegen: 7, regenDelay: 5, dodgeSpeed: 26, dodgeTime: 0.18, dodgeCost: 10, dodgeCd: 0.55,
  },

function setLoadVisible(on, msg) { const l = $('loading'); l.style.display = on ? 'flex' : 'none'; if (msg) $('loadmsg').textContent = msg; $('loadbar').style.width = on ? '70%' : '100%'; }
addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') Game.pause(); });
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && G.mode === 'play' && !BENCH && Input._wasLocked) Game.pause(); Input._wasLocked = !!document.pointerLockElement; });
addEventListener('keydown', e => { if (e.code === 'Enter' && !$('summary').classList.contains('hidden')) { $('summary').classList.add('hidden'); Game.start({ daily: !!(Menus._res && Menus._res.daily) }); } });

// §LOOP --------------------------------------------------------------------------------
let lastNow = performance.now(); const fogTarget = { d: 0.0095, c: new THREE.Color(FOG_COLOR) }; let perfAcc = 0, perfN = 0, perfT = 0, sleepT = 0, seaT = 0, shadowT = 0;
function stepPhysics(dt) {
  const n = clamp(Math.ceil(dt / (1 / 60) - 0.01), 1, CONFIG.physics.maxSubsteps);
  world.timestep = Math.max(1e-4, dt / n);
  for (let i = 0; i < n; i++) world.step(eventQueue);
}
function environment(rdt, t) {
  const cp = camera.position; const d = districtAt(cp.x, cp.z);
  if (cp.y < -1.5) { fogTarget.d = 0.028; fogTarget.c.setHex(0x07090c); }
  else { fogTarget.d = d.fog * (G.modifier === 'storm' ? 1.35 : 1) * (cp.z > 300 ? 1.25 : 1); fogTarget.c.setHex(d.fogColor); }
  scene.fog.density = damp(scene.fog.density, fogTarget.d, 1.2, rdt); scene.fog.color.lerp(fogTarget.c, 1 - Math.exp(-1.2 * rdt)); FOG_COLOR.copy(scene.fog.color);
  // lightning + thunder
  G.lightT -= rdt;
  if (G.lightT <= 0) { G.lightT = frnd(14, 40) * (G.modifier === 'storm' ? 0.4 : 1); const flashes = [0, 0.09, 0.22]; for (const f of flashes) setTimeout(() => { hemi.intensity = 2.8; SKY.material.uniforms.uFlash.value = 1; setTimeout(() => { hemi.intensity = 0.55; SKY.material.uniforms.uFlash.value = 0; }, 60); }, f * 1000); setTimeout(() => Audio.thunder(), frnd(700, 2600)); }
  SKY.position.copy(cp);
}
function headlights() {
  const cp = camera.position; let n = 0;
  for (const v of Vehicles.list) {
    if (!v.alive || !v.body || v.burnt || n > 18) continue; if (!(v.kinematic || (v.state === 'stopped' && v.mra))) continue;
    const t = v.body.translation(); if ((t.x - cp.x) ** 2 + (t.z - cp.z) ** 2 > 70 * 70) continue;
    const f = V3(0, 0, v.tpl.hz + 0.1).applyQuaternion(v.mesh.quaternion); const top = V3(t.x, t.y + 0.05, t.z).add(f);
    const dir = f.normalize(); dir.y -= 0.12; dir.normalize();
    Shafts.dynamic(top, dir, 16, 3.2, _c1.setRGB(0.55, 0.5, 0.38)); n++;
  }
}
function worldMaintenance(rdt) {
  sleepT -= rdt; seaT -= rdt;
  if (seaT <= 0) {
    seaT = 0.1; const qz = CONFIG.city.quayZ; const pp = Player.pos; const far2 = CONFIG.physics.sleepDist ** 2; const doSleep = sleepT <= 0; if (doSleep) sleepT = 1;
    world.forEachActiveRigidBody(b => {
      if (!b.isDynamic()) return; const t = b.translation();
      const c = b.collider(0); const o = c ? objByCollider.get(c.handle) : null; if (!o) return;
      if (t.z > qz + 0.5 && t.y < -0.9 && o.kind !== 'player') {
        if (!o.wet) { o.wet = true; FX.splash(V3(t.x, -1.1, t.z), 30, clamp(o.mass / 1500, 0.6, 2.4)); Audio.splash(V3(t.x, 0, t.z), clamp(o.mass / 2000, 0.5, 2)); b.setLinearDamping(2.5); b.setAngularDamping(2); b.setGravityScale(0.25, true); if (o.kind === 'unit') { Units.hit(o, 40, null, 'water'); } }
        if (t.y < -8) { if (o.kind === 'unit') { o.body.setTranslation({ x: t.x, y: 0.5, z: qz - 3 }, true); o.body.setLinvel({ x: 0, y: 0, z: 0 }, true); o.body.setGravityScale(1, true); o.wet = false; o.body.setLinearDamping(0.2); } else removeObj(o); }
      }
      if (doSleep && !o.heldBy && !o.inOrbit && !o.inVortex && ((t.x - pp.x) ** 2 + (t.z - pp.z) ** 2) > far2 && G.mode !== 'title') b.sleep();
    });
  }
  // the shadow-casting light follows the nearest streetlight (high quality only)
  shadowT -= rdt;
  if (Q.shadows && shadowT <= 0) { shadowT = 0.5; let best = null, bd = 900; for (const l of Lamps.list) { if (!l.lit) continue; const d = (l.head.x - Player.pos.x) ** 2 + (l.head.z - Player.pos.z) ** 2; if (d < bd) { bd = d; best = l; } } if (best) { shadowSpot.position.copy(best.head).y += 0.3; shadowSpot.target.position.copy(Player.pos); shadowSpot.intensity = 70; shadowSpot.color.setHex(0xffc890); } else shadowSpot.intensity = 0; }
  if (!Q.shadows) shadowSpot.intensity = 0;
}
function autoQuality(rdt) {

  if (perfT > 5) { const avg = perfAcc / perfN; perfAcc = 0; perfN = 0; perfT = 0; if (avg > 0.026 && settings.quality !== 'low') { settings.quality = settings.quality === 'high' ? 'medium' : 'low'; applyQuality(); Toast.show('QUALITY LOWERED TO ' + settings.quality.toUpperCase(), 'heat'); } }
}
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastNow) / 1000; lastNow = now; if (!(rdt > 0)) rdt = 1 / 60; rdt = Math.min(rdt, 0.05);
  renderer.info.reset();
  Input.pollPad();
  const M = G.mode;

    if (Input.tap('help')) { Game.pause(); Menus.open('help', 'pause'); $('pause').classList.add('hidden'); }
    Debug.keys();

  const ts = live ? TimeFX.update(rdt) : 0;

    const pdt = Catch.active ? rdt * 0.8 : dt;
    if (M === 'play' || M === 'detained') {
      Player.update(pdt, rdt);
      if (M === 'play') { TK.update(pdt, rdt); Push.update(pdt); Slam.update(pdt); Shield.update(pdt); Catch.update(pdt, rdt); Levitate.update(pdt); Vortex.update(pdt); Overload.update(dt, rdt); }
      Units.update(dt, G.time); Squads.update(dt); Heat.update(dt); Air.update(dt, G.time); Dampen.update(rdt); Walker.update(dt, G.time); Cranes.update(dt); Ship.update(dt);

  else if (M === 'photo') Photo.update(rdt);
  else if (M === 'replay') Replay.update(rdt);

  Mirror.update(camera);

  Hud.update(rdt); Audio.update(rdt); Replay.record(dt); Debug.update(rdt); autoQuality(rdt);

}

async function boot() {
