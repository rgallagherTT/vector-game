<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOUNTY RUN</title>
<style>
:root{
  --ink:#2a1a12; --paper:#efe0c0; --paper2:#e2cc9c; --rust:#d9692b; --rust2:#a8431a; --sun:#ffc35a;
  --teal:#38c7c0; --teal2:#1d8c88; --red:#e0412f; --green:#8fd16a; --hud:#fff4dc; --hudDim:rgba(255,244,220,.55);
  --shadow:0 2px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140d09;color:var(--hud);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hudRoot,#ui,#fade,#letterbox{position:fixed;inset:0;pointer-events:none}
#ui{pointer-events:none;z-index:20}
#ui .panel,#ui .menu,#ui button,#ui input,#ui textarea,#ui select,#ui .clickable{pointer-events:auto}
.mono{font-family:"Consolas","Courier New",monospace}
.slab{font-family:"Rockwell","Roboto Slab","Georgia",serif;letter-spacing:.04em}
/* ---------- HUD ---------- */
.hud{position:absolute;overflow:hidden;text-shadow:var(--shadow)}
.hud .speedo{position:absolute;right:22px;bottom:18px;text-align:right}
.hud .speedo .v{font:700 64px/1 "Consolas","Courier New",monospace;letter-spacing:-2px}
.hud .speedo .u{font-size:14px;opacity:.75;margin-left:4px}
.hud .bars{position:absolute;right:22px;bottom:92px;width:230px}
.bar{height:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,244,220,.35);margin-top:5px;position:relative;transform:skewX(-18deg)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width .08s}
.bar.boost>i{background:linear-gradient(90deg,#3a8cff,#9fe0ff)}
.bar.hp>i{background:linear-gradient(90deg,#d23a2a,#ffb347)}
.bar.fuel>i{background:linear-gradient(90deg,#c9a227,#f4e27a)}
.bar.drift>i{background:linear-gradient(90deg,#ff7b2a,#ffe25a)}
.barlbl{font-size:11px;opacity:.8;display:flex;justify-content:space-between;margin-top:6px;letter-spacing:.12em}
.hud .weap{position:absolute;left:22px;bottom:20px;font-size:14px;line-height:1.5}
.hud .weap b{font:700 26px "Consolas",monospace}
.hud .netready{display:inline-block;padding:2px 8px;border:1px solid var(--teal);color:var(--teal);margin-top:4px;letter-spacing:.15em;font-size:12px}
.hud .netready.off{border-color:#777;color:#999}
.hud .compass{position:absolute;top:10px;left:50%;width:min(520px,70%);height:30px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.45) 15%,rgba(0,0,0,.45) 85%,transparent);overflow:hidden;border-bottom:1px solid rgba(255,244,220,.25)}
.hud .compass .tick{position:absolute;top:4px;font:700 13px "Consolas",monospace;transform:translateX(-50%)}
.hud .compass .mk{position:absolute;top:0;width:0;height:0;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--rust)}
.hud .compass .mk.town{border-top-color:var(--teal)}
.hud .compass .mk.area{border-top-color:#f4d35e}
.hud .compass .mk.scan{border-top-color:#ff3df2}
.hud .compass .mk.rival{border-top-color:#9aa7ff}
.hud .compass .center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--hud);opacity:.8}
.hud .target{position:absolute;top:212px;right:18px;width:220px;background:rgba(20,12,8,.55);border-left:3px solid var(--rust);padding:8px 10px;font-size:12px;display:none}
.hud .target .nm{font:700 15px "Rockwell","Georgia",serif;letter-spacing:.05em}
.hud .target .st{opacity:.75;font-size:11px;margin-bottom:6px}
.hud .target .parts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hud .target .pt{padding:3px 5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);font-size:11px}
.hud .target .pt.sel{border-color:var(--sun)}
.hud .target .pt.broken{color:#ff6b55;text-decoration:line-through}
.hud .target .pt i{display:block;height:3px;background:var(--green);margin-top:2px}
.hud .radio{position:absolute;left:18px;top:52px;max-width:360px;display:none;background:rgba(20,12,8,.72);border:1px solid rgba(255,195,90,.5);padding:8px 10px 8px 64px;min-height:58px;font-size:14px}
.hud .radio canvas{position:absolute;left:6px;top:6px;width:50px;height:50px;border:1px solid rgba(255,255,255,.3);image-rendering:pixelated}
.hud .radio .who{font:700 12px "Rockwell","Georgia",serif;color:var(--sun);letter-spacing:.08em}
.hud .radio .txt{font-style:italic}
.hud .radio.static{animation:crackle .12s steps(2) 3}
@keyframes crackle{50%{filter:contrast(2) brightness(1.5);transform:translateX(1px)}}
.hud .prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,12,8,.7);padding:6px 14px;border:1px solid var(--sun);font-size:15px;display:none;white-space:nowrap}
.hud .prompt kbd,.kbd{display:inline-block;padding:0 6px;border:1px solid var(--hud);border-radius:3px;margin-right:6px;font:700 13px "Consolas",monospace}
.hud .notes{position:absolute;left:50%;top:64px;transform:translateX(-50%);text-align:center;width:80%}
.hud .note{font:700 20px "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);animation:notein 3.2s forwards}
.hud .note.big{font-size:38px;color:#fff}
.hud .note.bad{color:#ff7a5c}
.hud .note.good{color:var(--green)}
@keyframes notein{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.hud .crosshair{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,244,220,.8);border-radius:50%;pointer-events:none}
.hud .crosshair::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:var(--hud);border-radius:50%}
.hud .crosshair.lock{border-color:var(--rust);box-shadow:0 0 10px var(--rust)}
.hud .lockbox{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--sun);display:none;transform:rotate(45deg)}
.hud .minimap{position:absolute;right:18px;top:52px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,244,220,.5);overflow:hidden;background:#000}
.hud .minimap canvas{width:100%;height:100%}
.hud .scanring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:3px solid #ff3df2;border-radius:50%;opacity:0;pointer-events:none}
.hud .scanring.go{animation:scan 1.1s ease-out}
@keyframes scan{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(60)}}
.hud .emp{position:absolute;inset:0;background:radial-gradient(transparent 50%,rgba(80,160,255,.35));display:none}
.hud .dmg{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(220,40,20,.5));opacity:0;transition:opacity .3s}
.hud .speedlines{position:absolute;inset:0;opacity:0}
.hud .pip{position:absolute;left:18px;bottom:110px;max-width:300px;font-size:13px;color:#bff7f2;display:none;background:rgba(10,30,30,.6);border:1px solid var(--teal2);padding:5px 9px;border-radius:10px 10px 10px 0}
.hud .tow{position:absolute;left:22px;bottom:150px;font-size:13px;color:var(--sun);display:none}
.hud .stateTag{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;opacity:.8}
.hud .scoreline{position:absolute;left:50%;top:40px;transform:translateX(-50%);font:700 14px "Consolas",monospace;color:var(--sun)}
.hud .foot{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:14px;display:none;background:rgba(0,0,0,.5);padding:4px 10px}
#letterbox::before,#letterbox::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#letterbox::before{top:0}#letterbox::after{bottom:0}
#letterbox.on::before,#letterbox.on::after{height:11vh}
#cine{position:fixed;left:0;right:0;bottom:13vh;text-align:center;pointer-events:none;z-index:15;display:none}
#cine .t{font:700 54px "Rockwell","Georgia",serif;color:#fff;letter-spacing:.08em;text-shadow:0 3px 0 #000,0 0 30px rgba(217,105,43,.8)}
#cine .s{font:italic 20px Georgia,serif;color:var(--sun);text-shadow:0 2px 0 #000}
#fade{background:#000;opacity:0;transition:opacity .45s;z-index:30}
#fade.on{opacity:1}
#split{position:fixed;background:#000;z-index:5;display:none}
/* ---------- MENUS ---------- */
.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,20,10,.55),rgba(10,5,3,.92))}
.title{font:900 min(13vw,120px)/0.9 "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);text-shadow:0 6px 0 var(--rust2),0 12px 30px rgba(0,0,0,.8);text-align:center}
.subtitle{font:italic 20px Georgia,serif;color:var(--paper);text-align:center;margin:10px 0 28px;opacity:.85}
.btncol{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(340px,86vw);margin:0 auto}
button.b{font:700 17px "Rockwell","Georgia",serif;letter-spacing:.1em;padding:11px 18px;background:linear-gradient(#e6782f,#b14a1b);color:#fff6e4;border:2px solid #3a1d0e;box-shadow:0 4px 0 #3a1d0e;cursor:pointer;text-transform:uppercase}
button.b:hover,button.b.focus{filter:brightness(1.15);transform:translateY(-1px)}
button.b.alt{background:linear-gradient(#3a9d98,#1d6663)}
button.b.dim{background:linear-gradient(#6b5a4a,#463a2f)}
button.b:disabled{opacity:.45;cursor:default}
.paperpanel{background:var(--paper);color:var(--ink);border:3px solid #5b3a20;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:18px 22px;max-width:min(1100px,94vw);max-height:90vh;overflow:auto;position:relative}
.paperpanel h2{font:900 30px "Rockwell","Georgia",serif;letter-spacing:.06em;margin:0 0 6px;color:#5b2a12}
.paperpanel h3{font:700 18px "Rockwell","Georgia",serif;margin:14px 0 6px;color:#5b2a12}
.paperpanel .close{position:absolute;right:10px;top:8px}
.paperpanel p{margin:6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{font:700 13px "Rockwell",Georgia,serif;padding:6px 12px;background:#d8bf8c;border:2px solid #5b3a20;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#5b3a20;color:var(--paper)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.poster{cursor:pointer;transition:transform .15s;position:relative}
.poster:hover{transform:rotate(-1.2deg) scale(1.03)}
.poster canvas{width:100%;display:block;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.poster .tag{position:absolute;right:6px;top:6px;background:#2a5;color:#fff;font:700 11px Verdana;padding:2px 6px;transform:rotate(6deg)}
.poster .tag.locked{background:#333}
.poster .tag.done{background:#777}
.dossier{display:grid;grid-template-columns:260px 1fr;gap:18px}
.dossier canvas{width:100%}
.upg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.upg .card{background:#f6ead0;border:2px solid #8a6a44;padding:8px 10px}
.upg .card b{font:700 15px "Rockwell",Georgia,serif}
.pips{display:flex;gap:3px;margin:5px 0}
.pips i{width:20px;height:8px;background:#c9b48a;border:1px solid #7a5a34}
.pips i.on{background:#d9692b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches div{width:32px;height:32px;border:3px solid #5b3a20;cursor:pointer}
.swatches div.on{outline:3px solid #000}
table.lb{border-collapse:collapse;width:100%;font-size:14px}
table.lb td,table.lb th{border-bottom:1px solid #b89a6a;padding:4px 6px;text-align:left}
table.lb tr.me{background:#f6d38f}
.news li{margin:5px 0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;font-size:13px}
.ach div{padding:5px 7px;border:1px solid #a88a5a;background:#eadbb8;opacity:.55}
.ach div.on{opacity:1;background:#f8e3a8;border-color:#5b3a20}
.trophies{display:flex;flex-wrap:wrap;gap:10px}
.trophies canvas{width:110px;height:110px;background:#3a2414;border:3px solid #5b3a20}
.help{font-size:14px;columns:2;column-gap:28px}
.help div{break-inside:avoid;margin-bottom:4px}
.money{font:700 20px "Consolas",monospace;color:#2d6a1f}
#mapPanel canvas{width:min(80vh,86vw);height:min(80vh,86vw);display:block;margin:0 auto;background:#000;cursor:crosshair}
/* ---------- DEBUG ---------- */
#debug{position:fixed;left:8px;top:8px;z-index:40;font:12px/1.35 "Consolas",monospace;background:rgba(0,0,0,.72);color:#9f9;padding:8px 10px;display:none;max-width:420px;pointer-events:auto;white-space:pre}
#debug select,#debug button,#debug input{font:11px monospace;margin:2px 2px 0 0}
#bench{position:fixed;right:8px;top:8px;z-index:41;font:13px "Consolas",monospace;background:rgba(0,0,0,.8);color:#ff9;padding:8px 12px;display:none;white-space:pre}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#140d09;z-index:50;font:700 22px "Rockwell",Georgia,serif;color:var(--sun);letter-spacing:.1em}
#loading .bar{width:300px;transform:none}
#err{position:fixed;left:0;right:0;bottom:0;background:#600;color:#fff;font:12px monospace;padding:6px;z-index:60;display:none;white-space:pre-wrap}
@media (max-width:700px){.hud .minimap{width:96px;height:96px}.hud .speedo .v{font-size:44px}.hud .bars{width:150px}.dossier{grid-template-columns:1fr}.help{columns:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudRoot"></div>
<div id="split"></div>
<div id="letterbox"></div>
<div id="cine"><div class="t"></div><div class="s"></div></div>
<div id="ui"></div>
<div id="fade"></div>
<div id="debug"></div>
<div id="bench"></div>
<div id="loading"><div>BOUNTY RUN</div><div class="bar" style="margin-top:14px"><i id="loadbar" style="width:5%;background:var(--rust)"></i></div><div id="loadmsg" style="font:13px Verdana;margin-top:10px;opacity:.7">warming up the thrusters…</div></div>
<div id="err"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
  }
}
</script>
<script type="module">
/* =====================================================================================
   BOUNTY RUN — single-file hoverbike bounty-hunting game
   -------------------------------------------------------------------------------------
   MANIFEST (search for the anchor to jump to a system)
   §CONFIG      every tunable in one object
   §UTIL        math helpers, seeded RNG, simplex noise, canvas helpers
   §ASSETS      optional Claude Design assets from design/ (manifest.json) + procedural fallback
   §MODELS      optional GLB bikes / crawler / Pip from design/ (damage-state variants swapped on hits)
   §AUDIO       Web Audio: engines, sfx synth, radio crackle, adaptive frontier score
   §INPUT       keyboard / mouse / gamepad, per-player action maps (P1, P2)
   §PHYS        Rapier wrapper (+ pure-JS fallback integrator if Rapier fails to load)
   §TERRAIN     heightfield sampling, surfaces, slot canyons, flatten zones
   §REGIONS     the five regions (Ashfall Basin, Glass Flats, Redrock Maze, Scrapsea, Storm Belt)
   §LANDMARKS   arches, highway, starship, wind farm, oasis, hideouts, fuel stops
   §RENDER      renderer, sky, lights, post (heat haze / mirage), chunk streaming + LOD, props
   §TOWN        town builders: Dustwater, Prism, Hangman's Gap, Rustharbor, Last Light; NPC crowds
   §MONORAIL    the monorail loop, train cars as moving platforms
   §FX          particles (dust, spray, smoke, sparks, flame), tracers, decals, rings, lightning
   §HOVER       hoverbike physics: four spring hover points, drive, drift, boost, jumps, wipeouts
   §BIKE        bike meshes, frames, parts (thrusters/stabilisers/fuel/engine), damage
   §RIDER       low-poly rider + poses (ride, hands up, dazed, run, netted, sulk)
   §CAMERA      chase camera (speed FOV, drift swing, shake)
   §WEAPONS     sidearm / twin-barrel / marksman / net cannon, auto-aim, hitscan, gadgets
   §NET         verlet cloth net: launch, spread, wrap, tighten
   §TRICKS      escape-trick registry (10 Stage-1 tricks)
   §TRICKS2     ten more escape tricks (monorail hop … town run)
   §AI          outlaw chase AI (route choice from terrain), backup riders, holograms
   §BOUNTY      hand-designed bounties, wanted posters, portraits
   §BOUNTYGEN   generated bounties with 1–3 trick combos, rank-scaled danger, daily bounty
   §LEGENDS     ten legends + The Most Wanted, multi-phase chases, trophies
   §HUNT        tracking clues, scanner, chase lifecycle, capture, tow, drone, turn-in
   §RIVALS      five rival hunters, race-to-bounty, team-ups, leaderboard, rival turns outlaw
   §GANGS       Rattlers / Chrome Saints / Dust Kings: heat, ambushes, hideout raids, territory
   §COMPANION   Pip the drone: scan, mark, mines, dart, jammer, tow cable
   §FRONTIER    weather, events (caravans, festival race, meteor shower), town reactions, news
   §ONFOOT      on-foot town search (town-run trick)
   §COOP        split-screen co-op + versus
   §HUD         per-player HUD
   §UI          menus, bounty board, garage, saloon, store, map, fast travel
   §SAVE        localStorage (try/catch) + export/import
   §ACHIEVE     40 achievements
   §DEBUG       ?debug=1 overlay (spawn bounty, trigger trick, time of day)
   §BENCH       ?bench=chase | coop | raid | storm
   §MAIN        boot + game loop
   ===================================================================================== */
import * as THREE from 'three';

const GAME_TITLE = "BOUNTY RUN";  // placeholder

// §CONFIG ------------------------------------------------------------------------------
const CONFIG = {
  seed: 1873,
  world: {
    half: 9000, chunk: 128,
    lod: [ { ring: 2, res: 32 }, { ring: 5, res: 16 }, { ring: 10, res: 8 } ],
    streamPerFrame: 4, streamBudgetMs: 2.5, propRing: 3, physRing: 1, skirt: 14, viewFar: 2300,
  },
  regions: {
    blend: 380,
    list: [
      { id: 'ashfall',  name: 'Ashfall Basin',  cx: 0,     cz: 0,     sky: 0xa9d0ec, fog: 0xe8c9a0, haze: 0.9 },
      { id: 'glass',    name: 'The Glass Flats', cx: 6400,  cz: 0,     sky: 0xb8e2f6, fog: 0xf2efe6, haze: 1.6 },
      { id: 'redrock',  name: 'Redrock Maze',    cx: 0,     cz: -6400, sky: 0x9ec4e4, fog: 0xd9a27c, haze: 0.8 },
      { id: 'scrapsea', name: 'The Scrapsea',    cx: -6400, cz: 0,     sky: 0xa6bccb, fog: 0xc9b8a0, haze: 0.7 },
      { id: 'storm',    name: 'The Storm Belt',  cx: 0,     cz: 6400,  sky: 0x5e5a63, fog: 0x6b5a4c, haze: 0.3 },
    ],
  },
  physics: { hz: 60, gravity: 15.5, maxSubsteps: 4, bikeDensity: 210, wallBounce: 0.25 },
  hover: {
    points: [[-0.55, -0.32, 1.05], [0.55, -0.32, 1.05], [-0.55, -0.32, -1.0], [0.55, -0.32, -1.0]],
    rideHeight: 1.0, range: 2.3, stiffness: 1.0, damping: 0.42, maxTilt: 0.45,
    uprightGround: 9.0, airLeanFwd: 0.25, airLeanBack: 0.55, airPitchRate: 4.0, airResponse: 5.0, airYawRate: 1.3,
    wipeoutDot: 0.55, wipeoutTime: 2.4, hopImpulse: 7.5, hopCooldown: 1.1, contactHard: 0.25,
  },
  bike: {
    maxSpeed: 66.7,          // m/s = 240 km/h base top speed
    reverseSpeed: 14, accel: 19, brake: 34, coastDrag: 0.10, airDrag: 0.00045,
    steerRate: 2.15, steerHighSpeedLoss: 0.42, gripRate: 7.5, driftGripMul: 0.28, driftSteerMul: 1.55,
    boostAccel: 26, boostSpeed: 16, boostCapacity: 100, boostDrain: 34, boostRegen: 9, boostMinStart: 12,
    driftChargeRate: 0.55, driftMinAngle: 0.22, driftBoostTime: 1.25, driftBoostAccel: 20,
    health: 100, fuel: 100, fuelUse: 0.22, fuelUseBoost: 0.9, lowFuelSpeedMul: 0.3,
    crashDamage: 1.1, crashThreshold: 13, wreckThreshold: 33,
  },
  surfaces: {
    sand:     { grip: 0.62, drag: 0.016, speedMul: 0.94, rough: 0.35, spray: [0.86, 0.68, 0.45], loud: 0.4, hiss: 1.0 },
    rock:     { grip: 1.15, drag: 0.006, speedMul: 1.00, rough: 0.75, spray: [0.55, 0.36, 0.26], loud: 1.0, hiss: 0.15 },
    salt:     { grip: 0.78, drag: 0.001, speedMul: 1.10, rough: 0.05, spray: [0.95, 0.94, 0.90], loud: 0.25, hiss: 0.3 },
    water:    { grip: 0.30, drag: 0.09,  speedMul: 0.70, rough: 0.2,  spray: [0.75, 0.88, 0.95], loud: 0.2, hiss: 0.6 },
    road:     { grip: 1.10, drag: 0.004, speedMul: 1.06, rough: 0.15, spray: [0.45, 0.44, 0.42], loud: 0.6, hiss: 0.1 },
    riverbed: { grip: 0.92, drag: 0.008, speedMul: 1.00, rough: 0.4,  spray: [0.72, 0.58, 0.44], loud: 0.7, hiss: 0.4 },

const Assets = {
  manifest: null, images: {},
  async load() {
    try {
      const r = await fetch('design/manifest.json', { cache: 'no-cache' });
      if (!r.ok) return;
      this.manifest = await r.json();
      const jobs = [];
      const add = (key, file) => jobs.push(new Promise((res) => { const im = new Image(); im.onload = () => { this.images[key] = im; res(); }; im.onerror = () => res(); im.src = 'design/' + file; }));

      if (this.manifest.models) jobs.push(Models.load(this.manifest.models));
      await Promise.all(jobs);
    } catch (e) { /* no design folder — procedural art only */ }
  },
  img(key) { return this.images[key] || null; },
};

const Board = {

  },

};

  updateCompass() {
    const P = this.p; const yaw = P.cam.yaw; const w = this.el.compass.clientWidth || 400; const span = Math.PI * 0.9; const pp = P.onFoot ? OnFoot.pos : P.bike.pos;
    for (let i = 0; i < this.ticks.length; i++) { const a = i / 16 * TAU; const rel = wrapAngle(a - (-yaw + Math.PI)); const d = wrapAngle(Math.PI - a - yaw); const x = w / 2 + (-d) / span * w; this.ticks[i].style.left = x + 'px'; this.ticks[i].style.display = Math.abs(d) < span / 2 && i < 16 ? 'block' : 'none'; }
    const ms = this.compassMarkers(); while (this.markers.length < ms.length) { const m = el('div', { class: 'mk' }); this.el.compass.appendChild(m); this.markers.push(m); }
    for (let i = 0; i < this.markers.length; i++) { const m = this.markers[i]; const mk = ms[i]; if (!mk) { m.style.display = 'none'; continue; } const bearing = Math.atan2(mk.x - pp.x, mk.z - pp.z); const d = wrapAngle(bearing - yaw); const x = w / 2 - d / span * w; m.className = 'mk ' + mk.cls; m.style.left = clamp(x, 4, w - 4) + 'px'; m.style.display = 'block'; m.style.opacity = Math.abs(d) < span / 2 ? 1 : 0.35; }
  }
  updateTarget() {
    const P = this.p; let t = P.aim.target && (P.aim.target.isOutlaw || P.aim.target.bike) ? P.aim.target : null; if (!t) t = G.outlaws.find((o) => o.ai === 'flee' && !o.captured && !o.hidden);
    if (!t || !t.bike) { this.el.target.style.display = 'none'; return; } this.el.target.style.display = 'block';
    const d = Math.round(distXZ(t.pos, P.bike.pos)); const name = t.bounty ? (t.bounty.alias || t.bounty.name) : t.name;
    this.el.tnm.textContent = name + (t.fake ? ' (?)' : ''); const st = t.bike.dead ? 'ENGINE OUT' : t.trick ? TRICK_DEFS[t.trick.id].name.toUpperCase() : (t.ai || t.role || '').toUpperCase();
    this.el.tst.textContent = `${d} m · ${st}${t.darted ? ' · DART' : ''}${t.canNet && t.canNet() && t.capturable && t.capturable() ? ' · NET NOW!' : ''}`;
    let html = ''; for (const id of PART_IDS) { const p = t.bike.parts[id]; const sel = (P.aim.part === id || P.lockPart === id) ? ' sel' : ''; html += `<div class="pt${p.broken ? ' broken' : ''}${sel}">${CONFIG.parts[id].label}<i style="width:${(p.hp / p.max * 100).toFixed(0)}%;background:${p.hp / p.max > 0.6 ? '#8fd16a' : p.hp / p.max > 0.3 ? '#ffb347' : '#e0412f'}"></i></div>`; }
    this.el.tparts.innerHTML = html;
  }
  updateMini() {
    const P = this.p; const pp = P.onFoot ? OnFoot.pos : P.bike.pos; const c = this.el.mini, g = c.getContext('2d'); const scale = 1400 / 150; const yaw = P.cam.yaw;
    this.baseT = (this.baseT || 0) - 0.1; if (this.baseT <= 0 || !this.basePos || distXZ(this.basePos, pp) > 120) { this.baseT = 0.6; this.basePos = pp.clone(); const N = 40, bg = this.miniBase.g, img = bg.createImageData(N, N); const cc = [0, 0, 0]; const T = {};
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const x = pp.x + (i - N / 2) * 1500 / N, z = pp.z + (j - N / 2) * 1500 / N; terrainSample(x, z, T); terrainColor(x, z, T.h, T.s, T.region, 1, cc); const sh = clamp(0.75 + (T.h - pp.y) * 0.006, 0.4, 1.3); const k = (j * N + i) * 4; if (T.wet > T.h) { img.data[k] = 50; img.data[k + 1] = 120; img.data[k + 2] = 160; } else { img.data[k] = cc[0] * 255 * sh; img.data[k + 1] = cc[1] * 255 * sh; img.data[k + 2] = cc[2] * 255 * sh; } img.data[k + 3] = 255; }
      bg.putImageData(img, 0, 0); }
    g.save(); g.fillStyle = '#000'; g.fillRect(0, 0, 150, 150); g.translate(75, 75); g.rotate(yaw + Math.PI); g.imageSmoothingEnabled = true;
    const off = { x: (pp.x - this.basePos.x) / scale, z: (pp.z - this.basePos.z) / scale }; g.drawImage(this.miniBase.c, -75 * 1500 / 1400 - off.x, -75 * 1500 / 1400 - off.z, 150 * 1500 / 1400, 150 * 1500 / 1400);
    // monorail line
    g.strokeStyle = 'rgba(60,40,30,.7)'; g.lineWidth = 2; g.beginPath(); let started = false; for (let i = 0; i < MONO.pts.length; i += 3) { const x = (MONO.pts[i][0] - pp.x) / scale, z = (MONO.pts[i][1] - pp.z) / scale; if (Math.abs(x) > 120 || Math.abs(z) > 120) { started = false; continue; } if (!started) { g.moveTo(x, z); started = true; } else g.lineTo(x, z); } g.stroke();
    const dot = (x, z, col, r = 3.5) => { const dx = (x - pp.x) / scale, dz = (z - pp.z) / scale; const L = Math.hypot(dx, dz); const k = L > 70 ? 70 / L : 1; g.fillStyle = col; g.beginPath(); g.arc(dx * k, dz * k, r, 0, TAU); g.fill(); };
    for (const ms of this.compassMarkers()) dot(ms.x, ms.z, ms.cls === 'town' ? '#38c7c0' : ms.cls === 'area' ? '#f4d35e' : ms.cls === 'scan' ? '#ff3df2' : ms.cls === 'rival' ? '#9aa7ff' : '#e0412f', ms.cls === 'area' ? 5 : 3.5);
    for (const m of Hazards.mines) if (m.spotted) dot(m.p.x, m.p.z, '#ff2020', 1.5);
    for (const n of G.npcs) if ((n.role === 'gang' || n.role === 'backup') && !n.removed) dot(n.bike.pos.x, n.bike.pos.z, '#ff8a2a', 2.5);
    for (const s of Weather.storms) { const dx = (s.x - pp.x) / scale, dz = (s.z - pp.z) / scale; g.strokeStyle = 'rgba(200,150,90,.6)'; g.lineWidth = 3; g.beginPath(); g.arc(dx, dz, s.r / scale, 0, TAU); g.stroke(); }
    g.restore(); g.fillStyle = '#fff4dc'; g.beginPath(); g.moveTo(75, 66); g.lineTo(70, 80); g.lineTo(80, 80); g.fill();
    if (G.players[1] && G.players[1] !== P) { const o = G.players[1 - P.idx].bike.pos; }
  }
  destroy() { this.root.remove(); }
}

  return { v: 2, credits: CONFIG.economy.startCredits, xp: 0, upgrades: { engine: 0, thrusters: 0, boost: 0, stabilisers: 0, armour: 0, sidearm: 0, net: 0 }, frame: 'drifter', frames: ['drifter'], weapon: 'sidearm', weapons: ['sidearm'],
    gadgetOwned: {}, gadgets: {}, pip: { owned: true, dart: false, jammer: false, cable: false }, paint: 'rust', decal: 'none', ammo: CONFIG.weapons.ammoReserve, bstate: {}, active: [], board: [], lastSeen: {}, legends: {},
    mostWantedRevealed: false, mostWantedCaught: false, endlessLevel: 0, gangs, rivals, visited: { dustwater: true }, ach: {}, stats: {}, news: ['Welcome to Dustwater, hunter. The board\'s full and the dunes are restless.'], daily: {}, time: CONFIG.day.start, pos: null, health: null, fuel: null };

const Save = {
  exists() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } },

  migrate(s) { const d = defaultSave(); for (const k in d) if (s[k] === undefined) s[k] = d[k]; for (const k in d.gangs) if (!s.gangs[k]) s.gangs[k] = d.gangs[k]; for (const k in d.rivals) if (!s.rivals[k]) s.rivals[k] = d.rivals[k]; for (const k in d.upgrades) if (s.upgrades[k] === undefined) s.upgrades[k] = 0; for (const k in d.pip) if (s.pip[k] === undefined) s.pip[k] = d.pip[k]; return s; },

  frame(dt) {
    if (!this.mode || G.mode !== 'play' || this.done) return; this.t += dt;
    G.players.forEach((P, i) => { const b = P.bike; const cy = this.autopilotYaw[i] + Math.sin(this.t * 0.25 + i) * 0.4; const y = AIDrive.avoid(b, cy); const diff = wrapAngle(y - b.yaw()); P.input.throttle = 1; P.input.steer = clamp(-diff * 2, -1, 1); P.input.boost = b.boost > 30; P.input.drift = Math.abs(diff) > 0.9; P.input.fire = this.t % 3 < 1; b.ctrl.throttle = 1; });
    if (this.t > this.warm) { this.times.push(dt * 1000); this.logic.push(G.perf.logic); this.rend.push(G.perf.render); this.calls = Math.max(this.calls, G.perf.calls); this.tris = Math.max(this.tris, G.perf.tris); }
    const avg = this.times.length ? this.times.reduce((a, b) => a + b, 0) / this.times.length : 0; const worst = this.times.length ? Math.max(...this.times) : 0; const p95 = this.times.length ? [...this.times].sort((a, b) => a - b)[Math.floor(this.times.length * 0.95)] : 0;
    this.el.textContent = `BENCH ${this.mode}  t=${this.t.toFixed(1)}s\nlogic ${G.perf.logic.toFixed(2)} ms  render ${G.perf.render.toFixed(2)} ms  calls ${G.perf.calls}\navg ${avg.toFixed(2)} ms (${(1000 / (avg || 1)).toFixed(0)} fps)\np95 ${p95?.toFixed(2)} ms  worst ${worst.toFixed(2)} ms\nspeed ${(G.players[0].bike.speed * KMH).toFixed(0)} km/h  particles ${FX.dust.alive + FX.glow.alive}`;
    if (this.t > this.warm + this.dur) { this.done = true; const mean = (a) => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length); const res = { mode: this.mode, frames: this.times.length, avgMs: +avg.toFixed(2), p95Ms: +(p95 || 0).toFixed(2), worstMs: +worst.toFixed(2), avgFps: +(1000 / avg).toFixed(1), logicMs: +mean(this.logic).toFixed(2), logicWorstMs: +Math.max(...this.logic).toFixed(2), renderSubmitMs: +mean(this.rend).toFixed(2), maxDrawCalls: this.calls, maxTriangles: this.tris, physics: Phys.ok ? 'rapier' : 'fallback' }; console.log('BENCH', JSON.stringify(res)); window.__benchResult = res; this.el.textContent += '\nDONE — results logged to console'; }
  },
};

function reportError(e) { console.error(e); const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + (e && e.message) + '\n' + ((e && e.stack) || '').split('\n').slice(0, 3).join('\n'); clearTimeout(reportError.t); reportError.t = setTimeout(() => (d.style.display = 'none'), 6000); }
// ---- boot
window.addEventListener('error', (e) => { const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno; });
addEventListener('beforeunload', () => { if (G.mode === 'play') Save.save(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); Post.resize(); titleCam.aspect = innerWidth / innerHeight; titleCam.updateProjectionMatrix(); if (G.mode === 'play') Game.layout(); });
Input.onKey((code) => { if (G.mode !== 'play') return; if (code === 'Escape') { if (UI.isOpen) UI.close(); else UI.pause(); } if (code === 'KeyM' && !UI.isOpen) UI.map(); if (code === 'F1') UI.help(); });
async function boot() {
  const lb = document.getElementById('loadbar'), lm = document.getElementById('loadmsg'); const step = async (pct, msg) => { lb.style.width = pct + '%'; lm.textContent = msg; await new Promise((r) => setTimeout(r, 0)); };
  Input.init(); Save.loadSettings();
  await step(10, 'loading physics…'); await Phys.init();
  await step(20, 'checking for design assets…'); await Assets.load();
  await step(30, 'painting the desert…'); buildTextures(); buildMaterials(); Post.init(); Sky.init(); Terrain.init(); FX.init(); Props.init();
  await step(45, 'raising landmarks…'); Landmarks.build();
  await step(60, 'building towns…'); Towns.build(); Gangs.build();
  await step(70, 'laying monorail track…'); Monorail.build(); Pip.build(); Crowd.build();
  await step(80, 'drawing the map…'); MapView.build();
  await step(90, 'streaming terrain…'); Terrain.update([V3(TOWNS[0].x, 0, TOWNS[0].z)]); G.loading = false;
  await step(100, 'ready'); document.getElementById('loading').style.display = 'none';
  if (QS.get('debug') === '1') setTimeout(() => DebugUI.init(), 50);
  const bench = QS.get('bench');
  if (bench) Bench.setup(bench);
  else { if (Save.exists()) Save.load(); else Save.reset(); UI.title(); }
  window.BR = { setTime: (h) => { Sky.dayT = h; }, Legends, AIDrive, G, Game, Hunt, Board, Phys, UI, Bench, DebugUI, TRICK_DEFS, HAND_BOUNTIES, LEGENDS, Weather, Monorail, Rivals, Gangs, OnFoot, NetShots, Save, Pip, V3, genBounty, Targets, FX, Terrain, renderer };
  frame();
}
boot().catch((e) => { console.error('BOOT FAIL', e); const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Boot failed: ' + (e && e.stack || e); });
</script>
