<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Everbrick</title>
<style>
  :root{--ink:#1b2a34;--paper:#fff8e8;--accent:#fe8a18;--good:#237841;--bad:#c91a09;--panel:rgba(255,248,232,.94)}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fc3e9;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;user-select:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
  #hudTop{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px}
  #hearts{display:flex;gap:3px}
  .heart{width:18px;height:16px;background:#c91a09;border:2px solid var(--ink);border-radius:4px 4px 8px 8px}
  .heart.off{background:#a0a5a9}
  #stam{width:150px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
  #stam>i{display:block;height:100%;background:#bbe90b}
  #slots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .slot{width:58px;height:58px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center;box-shadow:0 4px 0 var(--ink)}
  .slot b{font-size:15px}.slot .cd{position:absolute;inset:0;background:rgba(27,42,52,.45);border-radius:9px;transform-origin:bottom}
  #compass{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:300px;height:26px;overflow:hidden}
  #compassInner{white-space:nowrap;font-weight:800;letter-spacing:2px}
  #hudRight{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:340px}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:700;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #prompt{position:absolute;left:50%;bottom:90px;transform:translateX(-50%)}
  #debug{position:fixed;left:8px;bottom:8px;font:11px/1.35 monospace;background:rgba(0,0,0,.65);color:#bbe90b;padding:6px 8px;border-radius:6px;white-space:pre;display:none;pointer-events:none}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(27,42,52,.35);pointer-events:auto}
  #menuBox{background:var(--paper);border:4px solid var(--ink);border-radius:18px;min-width:min(720px,92vw);max-width:94vw;max-height:86vh;overflow:auto;padding:16px 20px;box-shadow:0 8px 0 var(--ink)}
  #menuBox h2{margin:0 0 8px}#menuBox h3{margin:12px 0 4px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  button{font:inherit;font-weight:700;background:#f2cd37;border:3px solid var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
  button.on{background:#fe8a18}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  table{border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #d6c9a8;padding:3px 6px;text-align:left}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .sw{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;cursor:pointer;display:inline-block}
  .sw.on{outline:3px solid #fe8a18}
  #buildbar{position:absolute;left:12px;bottom:12px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:8px;display:none;max-width:46vw;pointer-events:auto;font-size:12px}
  #buildbar .pal{display:flex;flex-wrap:wrap;gap:3px;max-height:96px;overflow:auto}
  #buildbar .pc{padding:2px 5px;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer}
  #buildbar .pc.on{background:#fe8a18}
  #news{font-size:12px;max-width:340px}
  #splitLine{position:absolute;inset:0;pointer-events:none}
  #photoUI{position:fixed;right:12px;bottom:12px;display:none;pointer-events:auto}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9fc3e9;font-size:28px;font-weight:900;z-index:9}
</style>

<script type="module">
/* ============================================================================

import * as THREE from 'three';

/* §SIMCORE:BEGIN */

// §RNG ------------------------------------------------------------------------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function hashN(...a){ let h=0x9e3779b9|0; for(const v of a){ const k = typeof v==='number' ? (Math.floor(v)|0) : hashStr(String(v)); h^=k; h=Math.imul(h^(h>>>16),0x85ebca6b); h=Math.imul(h^(h>>>13),0xc2b2ae35); h^=h>>>16; } return h>>>0; }
const rngFor=(...a)=>mulberry32(hashN(...a));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)%arr.length];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function noise2(seed,x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const h=(i,j)=>(hashN(seed,i,j)&0xffff)/65535; const u=smooth(xf), v=smooth(zf);
  return lerp(lerp(h(xi,zi),h(xi+1,zi),u), lerp(h(xi,zi+1),h(xi+1,zi+1),u), v); }
function fbm(seed,x,z,oct=4){ let a=0,amp=.5,f=1,n=0; for(let i=0;i<oct;i++){ a+=amp*noise2(seed+i*101,x*f,z*f); n+=amp; amp*=.5; f*=2; } return a/n; }
function weighted(r, items, wf){ let tot=0; for(const it of items) tot+=Math.max(0,wf(it)); if(tot<=0) return null; let x=r()*tot; for(const it of items){ x-=Math.max(0,wf(it)); if(x<=0) return it; } return items[items.length-1]; }

// §BUS ------------------------------------------------------------------------
function makeBus(){ const h={}; return {
  on(e,f){ (h[e]||(h[e]=[])).push(f); return ()=>{ h[e]=h[e].filter(x=>x!==f); }; },
  emit(e,d){ const l=h[e]; if(l) for(const f of l.slice()) f(d); const w=h['*']; if(w) for(const f of w.slice()) f(e,d); },
  clear(){ for(const k in h) delete h[k]; }
}; }
const Bus = makeBus();

// §PALETTE --------------------------------------------------------------------

const PIECES = {};

  for(const [a,b] of sizes){

  defPiece('wheel_2x2',2,2,4,'wheel',{cat:'vehicle'}); defPiece('tyre_2x2',2,2,4,'tyre',{cat:'vehicle'});
  defPiece('panel_1x4',1,4,9,'panel',{cat:'window'}); defPiece('panel_1x2',1,2,6,'panel',{cat:'window'});
  defPiece('hinge_1x2',1,2,1,'hinge',{cat:'technic'}); defPiece('turntable_2x2',2,2,1,'turntable',{cat:'technic'});
  defPiece('dish_4x4',4,4,1,'dish',{cat:'round'}); defPiece('rotor_6x6',6,6,1,'rotor',{cat:'vehicle'});

})();
const pieceDims = (p, r) => (r&1) ? [p.d, p.w] : [p.w, p.d];

// §FUNCTIONAL -----------------------------------------------------------------
// Functional pieces: each has a footprint, a group, a cost in pips, and a function key the runtime binds.
const FUNCTIONAL = {};
(function(){
  const D = (id, group, w, d, h, color, cost, fn, extra={}) => {

  // Work

  D('fn_beehive','farm',2,2,4,'yellow',35,'beehive'); D('fn_barndoor','farm',1,4,12,'red',40,'barndoor');

  D('fn_keel','ship',4,12,3,'reddish_brown',80,'keel',{mass:6}); D('fn_mast','ship',1,1,36,'brown',50,'mast',{mass:1,sail:12});

  D('fn_gear','starship',2,2,3,'light_grey',20,'landinggear'); D('fn_airlock','starship',1,4,12,'white',40,'airlock');
  // Mount gear
  D('fn_saddle','mount',2,2,1,'brown',30,'saddle'); D('fn_saddlebags','mount',2,1,2,'reddish_brown',25,'saddlebags');
  D('fn_mountarmor','mount',4,2,2,'silver',60,'mountarmor'); D('fn_lancerest','mount',1,1,2,'silver',15,'lancerest'); D('fn_bannerpole','mount',1,1,12,'red',15,'banner');
  // Defence
  D('fn_gate','defence',1,6,12,'reddish_brown',60,'gate'); D('fn_turret','defence',2,2,6,'dark_grey',90,'turret');
  D('fn_catapult','defence',4,4,6,'brown',110,'catapult'); D('fn_cannontower','defence',4,4,12,'dark_grey',160,'cannontower');

const PRINTS = new Set(['face_smile','face_grin','face_angry','face_sad','face_surprise','face_sleep','fur_stripes','fur_spots','fur_patch',
  'outfit_vest','outfit_armor','outfit_suit','outfit_robe','outfit_apron','sign_fish_01','sign_bread','sign_inn','sign_shop','sign_jobs',

  if(typeof m.version!=='number') errs.push(`${id}: missing numeric version`);
  const occ=new Map();
  m.bricks.forEach((b,i)=>{

    const [pid,x,y,z,r,col,pr]=b;

    if(!(col in PALETTE)) errs.push(`${id}#${i}: unknown colour ${col}`);
    if(pr && !PRINTS.has(pr) && !(extraPrints&&extraPrints.has(pr))) errs.push(`${id}#${i}: unknown print ${pr}`);
    if(![x,y,z].every(Number.isInteger)) errs.push(`${id}#${i}: non-integer position`);
    if(![0,1,2,3].includes(r)) errs.push(`${id}#${i}: bad rotation ${r}`);

}

// LZW over UTF-8 bytes, codes packed as varints, then base64url. Synchronous, used by saves and share codes.
function lzwCompress(str){
  const bytes = new TextEncoder().encode(str); const dict=new Map(); for(let i=0;i<256;i++) dict.set(String.fromCharCode(i),i);
  let next=256, w='', out=[];
  for(const b of bytes){ const c=String.fromCharCode(b); const wc=w+c; if(dict.has(wc)) w=wc; else { out.push(dict.get(w)); if(next<1<<20) dict.set(wc,next++); w=c; } }
  if(w) out.push(dict.get(w));
  const buf=[]; for(let v of out){ while(v>=128){ buf.push((v&127)|128); v>>>=7; } buf.push(v); }
  let bin=''; for(let i=0;i<buf.length;i++) bin+=String.fromCharCode(buf[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function lzwDecompress(b64){
  const s=b64.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(s+'==='.slice((s.length+3)%4));
  const codes=[]; let v=0, sh=0; for(let i=0;i<bin.length;i++){ const c=bin.charCodeAt(i); v|=(c&127)<<sh; if(c&128) sh+=7; else { codes.push(v>>>0); v=0; sh=0; } }
  const dict=[]; for(let i=0;i<256;i++) dict.push([i]);
  if(!codes.length) return '';
  let w=dict[codes[0]]; if(!w) throw new Error('bad code'); const out=[...w];
  for(let i=1;i<codes.length;i++){ const k=codes[i]; let entry;
    if(k<dict.length) entry=dict[k]; else if(k===dict.length) entry=[...w,w[0]]; else throw new Error('bad code');
    for(const x of entry) out.push(x); if(dict.length<1<<20) dict.push([...w,entry[0]]); w=entry; }
  return new TextDecoder().decode(new Uint8Array(out));
}

// Procedural brick models. Every model the game needs has a generator here, so empty models/ still plays.
function fillRun(out, axis, x0, y, z0, len, color, rng, mask, printEvery){
  // greedy 4/2/1 bricks along an axis ('x' or 'z'), skipping masked cells
  let i=0;
  while(i<len){
    if(mask && mask(i)){ i++; continue; }
    let n=1; for(const s of [4,3,2]){ let ok=i+s<=len; for(let k=0;ok&&k<s;k++) if(mask&&mask(i+k)) ok=false; if(ok){ n=s; break; } }
    const pid = `brick_1x${n}`;
    if(axis==='x') out.push([pid, x0+i, y, z0, n>1?1:0, color]); else out.push([pid, x0, y, z0+i, 0, color]);
    i+=n;
  }
}

const REALM_IDS = ['brightharbour','apex','kingsreach','isles','wildwood','mistpeak','ember'];

// §WORLDMAP -------------------------------------------------------------------
// Deterministic continent: seven wedges around a central sea, joined by a ring road; Frontier zones off-map.
function realmAt(x,z){
  if(x > SPACE_ORIGIN.x - 3000) return 'frontier';
  const a = Math.atan2(z,x); const wedge = 2*Math.PI/7;
  let rel = a - REALMS.brightharbour.angle; rel = ((rel % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const idx = Math.floor((rel + wedge/2) / wedge) % 7;
  return REALM_IDS[idx];
}
function realmBlend(x,z){ // 0 at a border, 1 deep in a realm
  const a=Math.atan2(z,x), wedge=2*Math.PI/7; let rel=a-REALMS.brightharbour.angle; rel=((rel%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const f=((rel+wedge/2)/wedge)%1; const dEdge=Math.min(f,1-f)*wedge*Math.hypot(x,z); return clamp(dEdge/60,0,1);
}
function buildWorldMap(seed){
  const map = { seed, towns:[], sites:[], roads:[], rivers:[], waystones:[], plots:[], temples:[], landmarks:[], spaceZones:[] };
  const R = rngFor(seed,'map');
  for(const id of REALM_IDS){
    const realm=REALMS[id]; const wedge=2*Math.PI/7;
    const n = realm.towns.length;
    realm.towns.forEach((name,i)=>{
      const t = n===1?0:(i/(n-1)-.5); const a = realm.angle + t*wedge*0.62 + (R()-.5)*0.05;
      let rad = id==='apex' ? 1900+i*420 : (1650 + ((i*977+id.length*131)%5)*430);
      if(id==='brightharbour' && i===0) rad = 1500;
      if(id==='isles') rad = 1550 + i*520;
      const x=Math.round(Math.cos(a)*rad), z=Math.round(Math.sin(a)*rad);
      const town = { id:`${id}_t${i}`, name, realm:id, x, z, radius: id==='apex'?150: i===0?110:80, capital:i===0, h:0 };
      map.towns.push(town);
      map.sites.push({ id:town.id, name, realm:id, kind: id==='isles'?'island':'town', x, z, owner:null, defense:20+(i===0?20:0), pop:100 });
      map.waystones.push({ id:`ws_${town.id}`, town:town.id, x:x+12, z:z+12 });
      map.plots.push({ id:`plot_${town.id}`, town:town.id, realm:id, x:x-40, z:z+30, w:24, d:24, price: 400 + i*100 + (id==='apex'?600:0), kind: ['cottage lot','hillside','island','treehouse branch','mountain ledge','moon crater'][({brightharbour:0,apex:0,kingsreach:1,isles:2,wildwood:3,mistpeak:4,ember:1})[id]] });
    });
    // extra sites: forts, passes, mines, outposts
    const extras = { brightharbour:['Harbour Fort','Smugglers Cove'], apex:['Novagen Campus','Docklands','Power Station'], kingsreach:['Black Tower','Greenhood Camp','Border Fort'],
      isles:['Skull Shoal','Navy Bastion','Reef Spire'], wildwood:['Pack Den','Thornwall','Old Ruins'], mistpeak:['High Pass','Bandit Ridge','Jade Dojo'],
      ember:['Cinderdrill Mine','Raider Camp','Glass Ruins'] }[id];
    extras.forEach((name,i)=>{ const a = realm.angle + ((i+.5)/extras.length-.5)*wedge*0.7; const rad = 2700 + (i%2)*500 + R()*200;
      map.sites.push({ id:`${id}_x${i}`, name, realm:id, kind: name.match(/Tower|Fort|Bastion/)?'fort': name.match(/Mine|Station|Campus/)?'industry':'camp', x:Math.round(Math.cos(a)*rad), z:Math.round(Math.sin(a)*rad), owner:null, defense:30, pop:30 }); });
    // landmark + temple
    const la = realm.angle + 0.08, lr = id==='apex'?2100: id==='isles'? 1350 : 2300;
    map.landmarks.push({ realm:id, name:realm.landmark, x:Math.round(Math.cos(la)*lr), z:Math.round(Math.sin(la)*lr) });
    const ta = realm.angle - 0.12, tr = 2500;
    map.temples.push({ realm:id, x:Math.round(Math.cos(ta)*tr), z:Math.round(Math.sin(ta)*tr) });
    // river from the mountains to the sea
    const ra = realm.angle + wedge*0.28; const pts=[]; for(let k=0;k<=12;k++){ const rr = 3900 - k*(3900-CONFIG.seaRadius+80)/12; const aa = ra + Math.sin(k*0.9 + id.length)*0.05; pts.push([Math.cos(aa)*rr, Math.sin(aa)*rr]); }
    if(id!=='apex') map.rivers.push({ realm:id, pts });
  }
  // roads: within realm chain towns; ring road joins every capital
  const caps = REALM_IDS.map(id=>map.towns.find(t=>t.realm===id && t.capital));
  for(let i=0;i<caps.length;i++){ const a=caps[i], b=caps[(i+1)%caps.length]; if(a.realm==='isles'||b.realm==='isles') continue; map.roads.push([a.x,a.z,b.x,b.z]); }
  for(const id of REALM_IDS){ if(id==='isles') continue; const ts=map.towns.filter(t=>t.realm===id); for(let i=1;i<ts.length;i++) map.roads.push([ts[i-1].x,ts[i-1].z,ts[i].x,ts[i].z]); }
  // frontier zones
  SPACE_ZONES.forEach((z,i)=>{ const zone={ id:z, name:REALMS.frontier.towns[i], x:SPACE_ORIGIN.x + i*1200, z:0, radius: z==='station'?160:z==='belt'?260:300, gravity: z==='moon'?1/3: z==='station'?0.5: z==='belt'?0.4: 0.8, alien: i>=3 };
    map.spaceZones.push(zone); map.sites.push({ id:`frontier_${z}`, name:zone.name, realm:'frontier', kind: i<3?'colony':'world', x:zone.x, z:zone.z, owner:null, defense:25, pop:40 }); });
  map.waystones.push({ id:'ws_station', town:'frontier_station', x:SPACE_ORIGIN.x+30, z:30 });
  map.launchPad = { x: Math.round(Math.cos(REALMS.brightharbour.angle+0.18)*1700), z: Math.round(Math.sin(REALMS.brightharbour.angle+0.18)*1700) };
  map.ferries = [ ['brightharbour_t0','isles_t0'], ['isles_t1','kingsreach_t0'], ['ember_t0','brightharbour_t1'] ];
  map.train = ['brightharbour_t0','apex_t0','kingsreach_t0'];
  map.airships = ['brightharbour_t0','mistpeak_t0','wildwood_t0','ember_t0'];
  return map;
}

// §REALMGEN -------------------------------------------------------------------
// Terrain height (in plates) and surface colour per 2x2-stud column, deterministic from seed.
function distToSeg(px,pz,ax,az,bx,bz){ const dx=bx-ax, dz=bz-az; const l2=dx*dx+dz*dz||1; let t=((px-ax)*dx+(pz-az)*dz)/l2; t=clamp(t,0,1); return Math.hypot(px-(ax+t*dx), pz-(az+t*dz)); }
function makeTerrain(map){
  const seed=map.seed; const cache=new Map();
  const townGrid = map.towns; const roads=map.roads; const rivers=map.rivers;
  function raw(x,z){
    const realm = realmAt(x,z);
    if(realm==='frontier'){
      const zone = map.spaceZones.find(s=>Math.abs(s.x-x)<s.radius+40 && Math.abs(z)<s.radius+40);
      if(!zone) return { h:-999, realm, col:'black', water:false };
      const d=Math.hypot(x-zone.x,z-zone.z); if(d>zone.radius) return { h:-999, realm, col:'black', water:false, zone:zone.id };
      if(zone.id==='station') return { h:8, realm, col: ((Math.floor(x/4)+Math.floor(z/4))&1)?'light_grey':'white', zone:zone.id };
      const n=fbm(seed+77+zone.x,x/90,z/90); let h=6+Math.floor(n*(zone.id==='belt'?30:16));
      if(zone.id==='belt' && fbm(seed+5,x/40,z/40)<.45) return { h:-999, realm, col:'black', zone:zone.id };
      const col = zone.id==='moon'?(n>.55?'light_grey':'white'): zone.id==='verdant'?(n>.6?'trans_green':'lime'): zone.id==='crystal'?(n>.62?'trans_blue':'lavender'): zone.id==='ironwind'?(n>.5?'dark_red':'reddish_brown'):'dark_grey';
      return { h, realm, col, zone:zone.id };
    }
    const R=REALMS[realm]; const rad=Math.hypot(x,z);
    let h; let col=R.ground;
    const hp=R.height; const n=fbm(seed+hashStr(realm)%1000, x*hp.freq, z*hp.freq);
    h = hp.base + n*hp.amp;
    if(realm==='mistpeak'){ const ridge = 1-Math.abs(noise2(seed+9,x/300,z/300)*2-1); h = hp.base + Math.pow(ridge,2)*hp.amp + n*12; }
    if(realm==='ember'){ const v=map.landmarks.find(l=>l.realm==='ember'); const dv=Math.hypot(x-v.x,z-v.z); if(dv<220) h+= (220-dv)*0.35; }
    if(realm==='isles'){ const isl=fbm(seed+33,x/140,z/140); h = isl>.52 ? 7+ (isl-.52)*90 : 2+isl*3; }
    // blend heights across realm borders so terrain never cliffs at a border
    const b = realmBlend(x,z); if(b<1) h = lerp(12, h, b);
    // coast: sea in the middle and beyond the rim
    const coast = rad < CONFIG.seaRadius ? (CONFIG.seaRadius-rad) : rad > CONFIG.worldRadius ? (rad-CONFIG.worldRadius) : 0;
    if(coast>0){ h = h - coast*0.12; }
    // rivers
    for(const rv of rivers){ if(rv.realm!==realm) continue; for(let i=1;i<rv.pts.length;i++){ const d=distToSeg(x,z,rv.pts[i-1][0],rv.pts[i-1][1],rv.pts[i][0],rv.pts[i][1]); if(d<14){ h=Math.min(h, CONFIG.seaLevel-2 + d*0.15); } } }
    // towns flatten
    for(const t of townGrid){ const d=Math.hypot(x-t.x,z-t.z); if(d<t.radius+60){ const th = realm==='isles'?9:Math.max(9, Math.round(hp.base+fbm(seed+hashStr(realm)%1000,t.x*hp.freq,t.z*hp.freq)*hp.amp*0.5)); const k=clamp((d-t.radius)/60,0,1); h = lerp(th, h, smooth(k)); if(d<t.radius) col = realm==='apex'?(((Math.floor(x/8)+Math.floor(z/8))&1)?'dark_grey':'light_grey'): realm==='kingsreach'?'green': R.ground; } }
    // roads
    let onRoad=false; for(const r of roads){ const d=distToSeg(x,z,r[0],r[1],r[2],r[3]); if(d<5){ onRoad=true; break; } }
    h = Math.round(h);
    if(onRoad && h>CONFIG.seaLevel){ col = realm==='apex'?'black':'dark_tan'; }
    else if(h<=CONFIG.seaLevel+1) col = R.sand;
    if(realm==='mistpeak' && h>60) col='white';
    if(realm==='kingsreach' && h>34) col='light_grey';
    if(realm==='ember' && h>34) col='dark_grey';
    if(realm==='ember' && !onRoad && fbm(seed+81,x/50,z/50)>.74 && h>CONFIG.seaLevel+2) { col='trans_orange'; }
    return { h, realm, col, water: h<CONFIG.seaLevel, road:onRoad };
  }
  return {
    // column API (2x2 studs): returns cached record
    col(cx,cz){ const k=cx*100003+cz; let v=cache.get(k); if(!v){ v=raw(cx*2+1,cz*2+1); if(cache.size>400000) cache.clear(); cache.set(k,v); } return v; },
    height(x,z){ return this.col(Math.floor(x/2),Math.floor(z/2)).h; },
    realm: realmAt,
    raw,
  };
}

function initFactions(world){
  const F={};
  for(const [id,name,realm,kind,lawful,enemies,color] of FACTION_DEFS){
    F[id] = { id, name, realm, kind, lawful, color, strength: 50 + (kind==='military'?30:0) + (kind==='trade'?-10:0), wealth: 60 + (kind==='trade'?60:0),
      sites:[], rel:{}, enemies:[...enemies], alive:true, standing:0, weariness:0, player:false };
  }
  for(const a in F) for(const b in F){ if(a===b) continue; F[a].rel[b] = F[a].enemies.includes(b)||F[b].enemies.includes(a) ? -60 : (F[a].realm===F[b].realm ? 10 : 0); }
  // assign site ownership
  const own = (siteId, fid) => { const s=world.map.sites.find(x=>x.id===siteId); if(s){ s.owner=fid; } };
  for(const s of world.map.sites){
    const realmF = Object.values(F).filter(f=>f.realm===s.realm);
    let owner;
    if(s.kind==='town'||s.kind==='island'||s.kind==='colony') owner = realmF.find(f=>f.kind==='military') || realmF.find(f=>f.lawful) || realmF[0];
    else if(s.name.match(/Black Tower/)) owner=F.blacktower; else if(s.name.match(/Greenhood/)) owner=F.greenhood; else if(s.name.match(/Skull/)) owner=F.freecaptains;
    else if(s.name.match(/Navy/)) owner=F.navy; else if(s.name.match(/Reef/)) owner=F.reefwardens; else if(s.name.match(/Pack/)) owner=F.pack; else if(s.name.match(/Thorn/)) owner=F.hollowroot;
    else if(s.name.match(/Bandit/)) owner=F.bandits; else if(s.name.match(/Dojo/)) owner=F.jadeblades; else if(s.name.match(/Cinderdrill/)) owner=F.cinderdrill; else if(s.name.match(/Raider/)) owner=F.ashraiders;
    else if(s.name.match(/Novagen/)) owner=F.novagen; else if(s.name.match(/Smugglers/)) owner=F.raccoons; else if(s.name.match(/Docklands/)) owner=F.syndicate;
    else owner = realmF.find(f=>!f.lawful) || realmF[0];
    if(s.realm==='isles' && s.id==='isles_t2') owner=F.freecaptains;
    if(s.realm==='frontier' && s.kind==='world') owner = s.id.endsWith('ironwind') ? F.marauders : F.prospectors;
    s.owner = owner ? owner.id : null;
  }
  for(const s of world.map.sites) if(s.owner) F[s.owner].sites.push(s.id);
  return F;
}
function siteById(world,id){ return world.map.sites.find(s=>s.id===id); }
function transferSite(world, site, to, why){
  const from = site.owner; if(from===to) return;
  if(from && world.factions[from]) world.factions[from].sites = world.factions[from].sites.filter(x=>x!==site.id);
  site.owner = to; if(to && world.factions[to]) world.factions[to].sites.push(site.id);
  site.damage = Math.min(1,(site.damage||0)+0.3);
  news(world, `${site.name} falls to ${world.factions[to]?.name||'nobody'}${why?` (${why})`:''}.`, site.realm, 'territory');
  Bus.emit('territory', { site:site.id, from, to });
}
function news(world, text, realm='*', kind='news'){
  const item = { day: Math.floor(world.day*100)/100, text, realm, kind }; world.news.push(item); if(world.news.length>80) world.news.shift();
  if(kind!=='news' || world.timelineAll) world.timeline.push(item); if(world.timeline.length>400) world.timeline.splice(0, world.timeline.length-400);
  Bus.emit('news', item);
}
function resolveBattle(world, attId, defId, site, opts={}){
  const A=world.factions[attId], D=world.factions[defId]; const r=rngFor(world.seed,'battle',world.tick,attId,site.id);
  const playerBonus = opts.playerSide===attId ? opts.playerPower||0 : opts.playerSide===defId ? -(opts.playerPower||0) : 0;
  const atk = A.strength*(0.7+r()*0.6) + playerBonus; const def = (D?D.strength:10)*(0.6+r()*0.5) + site.defense*0.8;
  const win = atk > def;
  A.strength = Math.max(5, A.strength - (win?6:12) - r()*4); if(D) D.strength = Math.max(5, D.strength - (win?12:5) - r()*4);
  world.stats.battles++;
  return { win, atk, def };
}
function factionTick(world){
  const F=world.factions; const ids=Object.keys(F).sort();
  for(const id of ids){ const f=F[id]; if(!f.alive || f.player) continue;
    const r=rngFor(world.seed,'ftick',world.tick,id);
    const warMul = (world.wars||[]).some(w=>!w.ended && (w.a===id||w.b===id)) ? 0.5 : 1;
    const routes = world.tradeClosed?.[f.realm] ? 0.4 : 1;
    f.wealth += (f.kind==='trade'?3:1.2) * routes + f.sites.length*0.35;
    // utilities
    const opts=[];
    if(f.wealth>15) opts.push(['recruit', (100-f.strength)/40 + r()*.5]);
    opts.push(['trade', (f.kind==='trade'?1.2:0.4) + r()*.4]);
    const enemies = f.enemies.filter(e=>F[e]&&F[e].alive);
    if(enemies.length && f.kind!=='trade' && f.kind!=='order'){
      opts.push(['raid', (f.lawful?0.3:0.9)*warMul + r()*.5]);
    }
    const weakSite = f.sites.map(s=>siteById(world,s)).filter(Boolean).sort((a,b)=>a.defense-b.defense)[0];
    if(weakSite) opts.push(['defend', (40-weakSite.defense)/40 + r()*.3]);
    opts.sort((a,b)=>b[1]-a[1]);
    const act = opts[0][0];
    if(act==='recruit'){ const spend=Math.min(f.wealth*0.4, 30); f.wealth-=spend; f.strength=Math.min(160, f.strength+spend*0.35); }
    else if(act==='trade'){ f.wealth += 4*routes; }
    else if(act==='defend' && weakSite){ weakSite.defense=Math.min(80, weakSite.defense+3); f.wealth-=2; weakSite.damage=Math.max(0,(weakSite.damage||0)-0.1); }
    else if(act==='raid'){ const e=F[pick(r,enemies)]; const loot=Math.min(e.wealth*0.15, 12); e.wealth-=loot; f.wealth+=loot; f.rel[e.id]=Math.max(-100,(f.rel[e.id]||0)-3); e.rel[id]=Math.max(-100,(e.rel[id]||0)-4);
      world.metrics.raids++; if(r()<0.08) news(world, `${f.name} raided ${e.name}.`, f.realm, 'raid');
      // outlaws can snatch a lightly held site outright
      const tgt = e.sites.map(s=>siteById(world,s)).filter(s=>s && s.kind!=='town' && s.realm===f.realm)[0];
      if(tgt && !f.lawful && r()<0.05){ const res=resolveBattle(world,id,e.id,tgt); if(res.win) transferSite(world,tgt,id,'a raid'); }
    }
    f.weariness = Math.max(0, f.weariness - 0.02);
    // relations drift back toward baseline slowly
    for(const o in f.rel){ const base = f.enemies.includes(o)?-60:0; f.rel[o] += (base - f.rel[o])*0.004; }
  }
}

function careerRankFromXp(c, xp){ let r=0; for(let i=0;i<CAREERS[c].ranks.length;i++) if(xp>=RANK_XP[i]) r=i; return r; }
function addCareerXp(world, cid, xp){
  const p=world.player; const cs=p.careers[cid]; if(!cs || !cs.active) return;
  cs.xp += xp; const nr=careerRankFromXp(cid, cs.xp);
  if(nr>cs.rank){ cs.rank=nr; const c=CAREERS[cid];
    news(world, `${p.name} is now ${c.ranks[nr]} of ${c.name}.`, c.realm||'*', 'career');
    if(nr===c.ranks.length-1){ grantTitle(world, c.top); }
    for(const a of (c.abilities[nr]||[])) if(!p.abilities.includes(a)) p.abilities.push(a);
    for(const g of (c.gear[nr]||[])) if(!p.gearUnlocks.includes(g)) p.gearUnlocks.push(g);
    Bus.emit('rankup',{career:cid, rank:nr}); }
}
function joinCareer(world, cid, opts={}){
  const p=world.player; const c=CAREERS[cid];
  if(p.careers[cid]?.active) return { ok:false, why:'Already a member.' };
  if(p.careers[cid]?.hostile) return { ok:false, why:`${c.name} won't have you back.` };
  if(c.join.req?.standing) for(const [f,v] of Object.entries(c.join.req.standing)) if((world.factions[f]?.standing||0)<v && !opts.force) return { ok:false, why:`Needs standing ${v} with ${world.factions[f].name}.` };
  if(c.join.how==='prove' && (p.stats.crimesStopped||0) < c.join.crimes && !opts.force) return { ok:false, why:`Stop ${c.join.crimes} street crimes in Apex City first.` };
  p.careers[cid] = { active:true, rank:0, xp:0, joined:world.day, secret: !!c.hidden || !!opts.secret, suspicion:0 };
  for(const a of (c.abilities[0]||[])) if(!p.abilities.includes(a)) p.abilities.push(a);
  for(const g of (c.gear[0]||[])) if(!p.gearUnlocks.includes(g)) p.gearUnlocks.push(g);
  if(c.faction && world.factions[c.faction]) world.factions[c.faction].standing += 10;
  news(world, `${p.name} joined ${c.name}.`, c.realm||'*', 'career'); Bus.emit('career.join',{career:cid});
  return { ok:true };
}
function leaveCareer(world, cid, how='resign'){
  const p=world.player; const cs=p.careers[cid]; if(!cs||!cs.active) return;
  cs.active=false; const c=CAREERS[cid];
  if(how==='desert'||how==='betray'||how==='expelled'){ cs.hostile=true; if(c.faction&&world.factions[c.faction]) world.factions[c.faction].standing-=50; p.wanted[c.faction]=(p.wanted[c.faction]||0)+3; }
  news(world, `${p.name} ${how==='resign'?'left':how==='expelled'?'was thrown out of':'deserted'} ${c.name}.`, c.realm||'*', 'career');
}
function conflictTick(world){ // holding conflicting careers builds suspicion; discovery has consequences

      if(world.wars.some(w=>!w.ended && (w.a===owner.id||w.b===owner.id))){ const w=world.wars.find(w=>!w.ended && (w.a===owner.id||w.b===owner.id));
        const front=siteById(world,w.fronts[0]); if(front) list.push(makeJob(world,'enlist',front,owner.id,{war:w.id, target: w.a===owner.id?w.b:w.a, effect:{warScore:w.id, side:owner.id}})); }

    }

    list.push(makeJob(world, pick(r,['deliver','gather','cook','trade','map']), site, 'townsfolk'));
    if(site.realm==='apex'){ const v=world.villains.find(v=>v.active); list.push(makeJob(world, v?'scheme':'heist', site, 'paragon', {target:v?.id||'syndicate', effect: v?{villain:v.id}:{crime:1}})); }
    if(site.realm==='brightharbour') list.push(makeJob(world,'commission',site,'traders',{effect:{commission:true}}));
    // threats post jobs where they press
    for(const t of world.threats.filter(t=>!t.resolved)){ if(t.realm===site.realm || t.realm==='*'){ list.push(makeJob(world, t.stage<=1?'pressure':'threat', site, owner?.id||'townsfolk', {threat:t.id, effect:{threat:t.id}})); } }

    for(const cid of CAREER_IDS){ const cs=p.careers[cid]; if(!cs?.active) continue; const c=CAREERS[cid]; if(c.realm && c.realm!==site.realm && r()<0.6) continue;
      const jt=pick(r,CAREER_JOBS[cid]||['patrol']); list.push(makeJob(world,jt,site,c.faction||'townsfolk',{career:cid}));
      if(cs.rank>=c.ranks.length-1 && r()<0.5) list.push(makeJob(world,'legendary',site,c.faction||'townsfolk',{career:cid, legendary:true, pay:500})); }

    for(const w of world.wars.filter(w=>!w.ended && w.weary)) if(siteById(world,w.fronts[0])?.realm===site.realm) list.push(makeJob(world,'broker',site,'lumen',{war:w.id, effect:{peace:w.id}}));

function completeJob(world, job, opts={}){
  const p=world.player; const F=world.factions; const ok = opts.success!==false;
  if(!ok){ if(F[job.client]) F[job.client].standing-=2; return false; }
  p.pips += job.pay; p.stats.jobs++; world.stats.jobsDone++;
  if(F[job.client]){ F[job.client].standing+=4; if(job.target && F[job.target]) F[job.target].standing-=3; }
  p.fame[job.realm]=(p.fame[job.realm]||0)+1;
  if(job.career) addCareerXp(world, job.career, job.xp); else for(const cid of CAREER_IDS){ const cs=p.careers[cid]; if(cs?.active && CAREERS[cid].faction===job.client) addCareerXp(world,cid,Math.round(job.xp*0.6)); }
  const e=job.effect||{};
  if(e.flip){ const s=siteById(world,e.flip); if(s && s.owner!==e.to){ transferSite(world,s,e.to,`with help from ${p.name}`); } }
  if(e.weaken && F[e.weaken]) F[e.weaken].strength=Math.max(5,F[e.weaken].strength-e.amount);
  if(e.repair){ const s=siteById(world,e.repair); if(s) s.damage=0; }
  if(e.villain) defeatVillain(world, e.villain);
  if(e.crime){ p.stats.crimesStopped=(p.stats.crimesStopped||0)+1; p.heroRep+=1; }
  if(e.warScore){ const w=world.wars.find(x=>x.id===e.warScore); if(w){ w.score += (w.a===e.side?1:-1)*0.12; w.playerFought=true; } }
  if(e.peace){ const w=world.wars.find(x=>x.id===e.peace); if(w && !w.ended) endWar(world,w,'treaty', p.name); }
  if(e.threat){ const t=world.threats.find(x=>x.id===e.threat); if(t && !t.resolved) threatHit(world,t, job.type==='pressure'?0.07:0.05, true); }
  if(job.legendary) grantTitle(world, `Legend of ${CAREERS[job.career]?.name||'the Realms'}`);
  Bus.emit('job.done',{job}); world.jobLog.push({day:Math.floor(world.day), title:job.title}); if(world.jobLog.length>50) world.jobLog.shift();
  for(const b of Object.values(world.boards||{})){ const i=b.indexOf(job); if(i>=0) b.splice(i,1); }
  return true;
}

  boxes.forEach((b,i)=>{ for(let x=b.x0;x<b.x1;x++) for(let z=b.z0;z<b.z1;z++){ const below=top.get(key(x,b.y0,z)); if(below!==undefined){ adj[i].add(below); adj[below].add(i); } const above=bot.get(key(x,b.y1,z)); if(above!==undefined){ adj[i].add(above); adj[above].add(i); }

  const seen=new Array(n).fill(false); const q=[]; for(let i=0;i<n;i++) if(grounded[i]){ seen[i]=true; q.push(i); }

}
function blueprintStats(bricks){

function judgeCommission(brief, bricks){
  const st = blueprintStats(bricks)||{length:0,height:0,bricks:0,width:0}; const ids=new Set(bricks.map(b=>b[0])); const cols=new Set(bricks.map(b=>b[5]));
  const req=brief.req; let met=0, total=0; const notes=[];
  if(req.minLength){ total++; const L=Math.max(st.length,st.width); if(L>=req.minLength) met++; else notes.push(`too short (${L}/${req.minLength})`); }
  if(req.minHeight){ total++; if(st.height>=req.minHeight) met++; else notes.push(`too low (${st.height}/${req.minHeight} plates)`); }
  if(req.minPieces){ total++; if(st.bricks>=req.minPieces) met++; else notes.push(`needs ${req.minPieces} pieces`); }
  for(const n of req.needs||[]){ total++; if(ids.has(n)) met++; else notes.push(`missing ${n}`); }

}

let WAR_SEQ=1;
function warCheck(world){
  const F=world.factions; const active=world.wars.filter(w=>!w.ended); const freq=world.settings.warFreq;
  if(active.length >= 2 + (freq>1?1:0)) return;
  const r=rngFor(world.seed,'warcheck',Math.floor(world.day));
  const pairs=[]; const ids=Object.keys(F).sort();
  for(const a of ids) for(const b of ids){ if(a>=b) continue; const A=F[a],B=F[b]; if(!A.alive||!B.alive||A.kind==='order'||B.kind==='order'||A.kind==='hidden'||B.kind==='hidden') continue;
    if(active.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))) continue;
    const tension = -(A.rel[b]+B.rel[a])/2; if(tension<55) continue;
    const ratio = Math.min(A.strength,B.strength)/Math.max(A.strength,B.strength); pairs.push([a,b,tension*(0.5+ratio)]); }

function declareWar(world, a, b, why){

function warTick(world){

    w.fronts = w.fronts.filter(id=>{ const s=siteById(world,id); return s && (s.owner===w.a||s.owner===w.b); });
    if(!w.fronts.length){ const more=[...A.sites,...B.sites].slice(0,2); w.fronts.push(...more); if(!w.fronts.length){ endWar(world,w,'exhaustion'); continue; } }

  const open = world.threats.filter(t=>!t.resolved); if(open.length >= Math.min(CONFIG.maxThreats, world.settings.maxThreats||2)) return;
  if(world.day < world.quietUntil) return;
  if(open.length===1 && rngFor(world.seed,'t2',Math.floor(world.day))() > 0.04*world.settings.threatFreq) return;
  const last = world.lastArch; const allowed = ARCH_IDS.filter(a=>world.settings.archetypes.includes(a) && a!==last && !open.some(t=>t.arch===a));
  if(!allowed.length) return;
  const r=rngFor(world.seed,'threat',Math.floor(world.day));
  const arch = weighted(r, allowed, a=>clamp(ARCHETYPES[a].cond(world),0.15,1.4) + (world.bias[a]||0));
  spawnThreat(world, arch);
}
function playerPower(world){ const p=world.player; let pw=10; for(const cid in p.careers){ const cs=p.careers[cid]; if(cs.active) pw+=cs.rank*4; } if(p.powers) pw+=15; if(p.careers.lumen?.active && p.lumen.step==='guardian') pw+=12; pw+=p.companions.filter(c=>c.active).length*5; pw+= p.titles.length*2; return pw; }
function spawnThreat(world, arch){
  const A=ARCHETYPES[arch]; const r=rngFor(world.seed,'tspawn',arch,THREAT_SEQ);
  const realm = typeof A.realm==='function' ? A.realm(world) : A.realm==='*' ? pick(r,REALM_IDS) : A.realm;
  const scale = (1 + world.eraIndex*0.25) * (0.8 + playerPower(world)/60);
  const t={ id:`t${THREAT_SEQ++}`, arch, name:A.name, leader:pick(r,A.leaders), realm, stage:0, progress:0, strength: 2.2 + world.eraIndex*0.05, power: Math.round(60*scale), started:world.day, resolved:false, outcome:null, pressure:A.pressure, playerHits:0, stageNames:A.stages, era:world.eraIndex };
  world.threats.push(t); world.lastArch = arch; world.bias[arch]=0; for(const k in world.bias) world.bias[k]*=0.85; world.archHistory.push(arch); world.eraThreats.push(t.id);
  news(world, `THREAT: ${A.stages[0]} — ${t.leader} stirs in ${realm==='*'?'every realm':REALMS[realm].name}. (${A.name})`, realm, 'threat'); Bus.emit('threat.start',{threat:t});
  return t;
}
function threatHit(world, t, amount, byPlayer){ const early = t.stage<=1 ? 2 : 1; t.strength -= amount*early; if(byPlayer){ t.playerHits++; world.player.stats.threatHits=(world.player.stats.threatHits||0)+1; }
  t.progress=Math.max(0,t.progress-amount*0.3*early); if(t.strength<=0) resolveThreat(world,t,'defeated'); }
function threatTick(world){
  for(const t of world.threats.filter(t=>!t.resolved)){ const r=rngFor(world.seed,'tt',t.id,Math.floor(world.day));
    const growth = 0.011 * (1 + world.eraIndex*0.05) * world.settings.threatFreq;
    t.progress += growth; t.strength = Math.min(3, t.strength + 0.004);
    // realm factions oppose it on their own
    const defenders = Object.values(world.factions).filter(f=>f.alive && f.lawful && (f.realm===t.realm || t.realm==='*') && !f.player);
    const opp = defenders.reduce((a,f)=>a+f.strength,0)/2400*0.16; t.strength -= opp*(0.5+r()); if(r()<0.2) for(const f of defenders) f.strength=Math.max(5,f.strength-1);

}
function resolveThreat(world, t, outcome){
  if(t.resolved) return; t.resolved=true; t.outcome=outcome; t.ended=world.day; const A=ARCHETYPES[t.arch];
  world.seedNotes=[];

    if(t.playerHits>0){ const reward={ name:`${t.leader}'s ${pick(rngFor(t.id),['banner','crown','mount','cloak','helm','blade','trophy'])}`, era:world.eraIndex, kind:'era_reward' }; world.player.eraRewards.push(reward); grantTitle(world,'Champion of the Realms');
      if(t.playerHits>=2){ const realm = t.realm==='*'?'brightharbour':t.realm; const town=world.map.towns.find(x=>x.realm===realm&&x.capital)||world.map.towns[0]; world.statues = world.statues.filter(x=>x.town!==town.id); world.statues.push({ realm, town:town.id, era:world.eraIndex, deed:`defeated ${t.leader}` }); news(world,`A statue of ${world.player.name} is raised in ${town.name}.`,realm,'legacy'); } } }

  Bus.emit('threat.end',{threat:t});

}
// §ERAS -----------------------------------------------------------------------
const ERA_WORDS = { darkarmy:['Iron','Ash','Black Banners'], beast:['Tremors','the Waking Deep','Broken Hills'], armada:['Sails','Black Flags','the Long Tide'], umbral:['Shadows','Dimmed Lanterns','the Hidden Court'],
  machines:['Gears','the Silent Mines','Iron Rights'], invasion:['Strange Stars','the Far Lights','Fallen Ships'], blight:['Grey Leaves','the Pale Root','Burned Fields'], masterplan:['Masterminds','Neon Schemes','Gilded Lies'],
  rogueheroes:['False Capes','Dazzling Lies','Broken Idols'], storm:['Storms','High Water','Salt Winds'] };
function eraName(world, t){ const r=rngFor(world.seed,'era',world.eraIndex); const w=pick(r,ERA_WORDS[t.arch]); return t.outcome==='won' ? `The Age of ${w}` : pick(r,[`The Era After ${w}`,`The Dawn Past ${w}`,`The Rebuilding of ${w}`, `The Age Beyond ${w}`]); }
function endEra(world, t){
  const cur=world.eras[world.eras.length-1];
  cur.end=world.day; cur.threats=world.eraThreats.slice(); cur.outcome=`${t.leader} ${t.outcome==='defeated'?'was defeated':'won'}`;
  // compress: keep only the summary of a resolved era
  const F=world.factions; const ranked=Object.values(F).filter(f=>f.alive&&!f.player).sort((a,b)=>(b.sites.length*10+b.strength)-(a.sites.length*10+a.strength));
  cur.summary = { rose: ranked.slice(0,3).map(f=>f.name), fell: ranked.slice(-3).map(f=>f.name), player: { jobs:world.player.stats.jobs, threatHits:world.player.stats.threatHits||0, titles:world.player.titles.slice(-3) }, wars: world.wars.filter(w=>w.started>=cur.start).length, seed: world.seedNotes.slice() };
  world.eraIndex++; world.eraThreats=[];
  const next = { index:world.eraIndex, name:eraName(world,t), start:world.day, end:null, seededBy:t.id, seed: world.seedNotes.slice() };
  world.eras.push(next);
  world.quietUntil = world.day + 12 + Math.floor(rngFor(world.seed,'quiet',world.eraIndex)()*14);
  news(world, `A NEW ERA: ${next.name}. ${world.seedNotes.join(' ')}`, '*', 'era'); Bus.emit('era',{ prev:cur, next });
  // trim old threat records to summaries (save stays small)
  world.threats = world.threats.filter(x=>!x.resolved || world.day - x.ended < 60);
}

const FESTIVALS = { brightharbour:{name:'Regatta of Brightharbour',season:1,game:'regatta'}, apex:{name:'Neon Lantern Night',season:2,game:'lanterns'}, kingsreach:{name:'Grand Jousting Tournament',season:0,game:'joust'},
  isles:{name:'Treasure Regatta',season:1,game:'regatta'}, wildwood:{name:'Harvest Fair',season:2,game:'harvest'}, mistpeak:{name:'Lantern Festival',season:3,game:'lanterns'}, ember:{name:'Sand-Racing Cup',season:0,game:'race'},
  frontier:{name:'Brick-Building Championship',season:3,game:'building'} };
const MYSTERIES = ['A lost ship sails back into port, its crew unchanged after forty years','A door in the mountain opens for the first time','A stranger in a grey coat asks about the player','Bells ring from an empty tower','The tide goes out and does not come back for a day','A second moon is seen for one night'];
function eventsTick(world){
  const r=rngFor(world.seed,'events',Math.floor(world.day)); const day=Math.floor(world.day); const season=seasonOf(day); const dayInSeason=day%CONFIG.daysPerSeason;
  world.activeEvents = world.activeEvents.filter(e=>e.until>world.day);
  if(dayInSeason===3) for(const [realm,f] of Object.entries(FESTIVALS)) if(f.season===season && !world.activeEvents.some(e=>e.kind==='festival'&&e.realm===realm)){ addEvent(world,{kind:'festival',realm,name:f.name,game:f.game,until:world.day+2}); }
  if(r()<0.12) addEvent(world,{kind:'merchant',realm:pick(r,REALM_IDS),name:'A travelling merchant with rare pieces',until:world.day+2, stock:[pick(r,['gem_1x1','dome_4x4','canopy_4x6','rotor_6x6']),pick(r,['trans_orange','gold','trans_green'])]});
  if(r()<0.06) addEvent(world,{kind:'meteor',realm:pick(r,REALM_IDS),name:'A meteor shower drops rare Frontier bricks',until:world.day+1});
  if(r()<0.06){ const from=pick(r,REALM_IDS), to=pick(r,REALM_IDS); addEvent(world,{kind:'migration',realm:from,to,name:`A great migration of ${SPECIES[pick(r,REALMS[from].creatures)]?.name||'creatures'} heads toward ${REALMS[to].name}`,until:world.day+3}); }
  if(r()<0.03) addEvent(world,{kind:'mystery',realm:pick(r,REALM_IDS),name:pick(r,MYSTERIES),until:world.day+4});

}
function addEvent(world, e){ e.start=world.day; world.activeEvents.push(e); world.stats.events++; news(world, `${e.kind==='festival'?'FESTIVAL':e.kind.toUpperCase()}: ${e.name} in ${REALMS[e.realm].name}.`, e.realm, 'event'); Bus.emit('event',e); }

function legacyTick(world){
  const p=world.player;
  for(const c of p.companions){ if(c.retired||!c.active) continue; if(c.service>120){ c.retired=true; c.active=false; const home=p.towns[0];
      const trainee={ id:`${c.id}_trainee${Math.floor(world.day)}`, name:genName(rngFor(c.id,world.day)), species:c.species, role:`trainee of ${c.name}`, realm:c.realm, career:c.career, weapon:c.weapon, likes:c.likes, dislikes:c.dislikes, loyalty:60, joined:world.day, service:0, active:true, order:'follow', gearFrom:c.name };
      p.companions.push(trainee); if(home) home.folk.push({ name:c.name, species:c.species, job:'retired hero', happy:80, opinion:'tells old war stories' });
      news(world, `${c.name} retires${home?` to ${home.name}`:''}, passing their gear to ${trainee.name}.`, c.realm, 'legacy'); } }
  // titles from deeds
  if((p.stats.threatHits||0)>=10) grantTitle(world,'Champion of the Realms');
  for(const cid in p.careers){ const c=CAREERS[cid], cs=p.careers[cid]; if(cs.active && cs.rank>=c.ranks.length-1){ grantTitle(world,c.top); if(!p.mastery.includes(cid)){ p.mastery.push(cid); news(world,`${p.name} mastered ${c.name}.`,'*','legacy'); } } }
}
function hallOfRecords(world){ return world.eras.map(e=>({ name:e.name, start:Math.floor(e.start), end:e.end==null?null:Math.floor(e.end), outcome:e.outcome||'ongoing', summary:e.summary||null, seed:e.seed||[] })); }

function newPlayer(name='Hero'){
  return { name, species:'human', recipe:null, characters:[], pips:50, bank:{}, materials:{wood:4,stone:4}, seeds:{carrot:4,wheat:2}, inventory:[], functional:{}, hiltParts:[],
    careers:{}, abilities:[], gearUnlocks:['sword'], lumen:{ step:'none', trials:{}, choices:{}, heartstone:null, hilt:null, color:null, mentor:null }, corruption:0,
    powers:null, identity:null, heroName:null, costumes:[], heroRep:0, civRep:0, fame:{}, wanted:{}, companions:[], titles:[], towns:[], plots:[], homes:[], blueprints:[],
    farms:{}, pens:[], shops:[], stats:{ jobs:0, smashed:0, built:0, crafted:0, crimesStopped:0, kos:0, threatHits:0 }, waystones:['ws_brightharbour_t0'], mounts:[], eraRewards:[], mastery:[], statues:[],
    pos:null, respawn:null, battleCallups:true, frontierVisits:0 };

function newWorld(seed=CONFIG.seed, settings={}){
  Bus.clear();
  const world = { version:5, seed, day:0, tick:0, settings:{ size:1, warFreq:1, threatFreq:1, archetypes:ARCH_IDS.slice(), maxThreats:2, ...settings },
    map: buildWorldMap(seed), factions:null, player:newPlayer(), news:[], timeline:[], wars:[], threats:[], eras:[{ index:0, name:'The First Age', start:0, end:null }], eraIndex:0, eraThreats:[],

function advanceWorld(world, days){
  // coarse ticks independent of the player
  const tpd=CONFIG.factionTicksPerDay; const target = world.day + days;
  while(world.day < target - 1e-9){
    const step = Math.min(1/tpd, target-world.day); const before=Math.floor(world.day);
    world.day += step; world.tick++;
    factionTick(world); warTick(world); companionTick(world);
    world.metrics.towerPower = Math.max(0, world.metrics.towerPower + (world.factions.blacktower?.strength>80?0.01:-0.005));
    world.metrics.miningDepth += (world.factions.cinderdrill?.alive ? 0.004 : 0);
    if(Math.floor(world.day)>before){ dailyTick(world); }
  }
}
function dailyTick(world){
  warCheck(world); threatCheck(world); threatTick(world); eventsTick(world); villainTick(world); conflictTick(world); reputationTick(world); townTick(world); farmTick(world,1); legacyTick(world);
  // weekly pay for every active career
  if(Math.floor(world.day)%7===0) for(const cid in world.player.careers){ const cs=world.player.careers[cid]; if(cs.active) world.player.pips += CAREERS[cid].pay*(1+cs.rank*0.5); }
  generateJobs(world);
  world.pendingBattles = world.pendingBattles.filter(b=>world.day-b.day<1.5);
}

// §SAVE -----------------------------------------------------------------------
// Versioned schema: v1 (Stage 1) → v2 (realms) → v3 (careers) → v4 (building) → v5 (living world). Migrations only add.
const SAVE_VERSION = 5;
function serializeWorld(world){
  const sites = world.map.sites.map(s=>[s.id,s.owner,Math.round(s.defense),+(s.damage||0).toFixed(2),s.siege?1:0, s.player?{name:s.name,realm:s.realm,x:s.x,z:s.z,kind:s.kind}:0]);
  const F={}; for(const [id,f] of Object.entries(world.factions)){ F[id]={...f, strength:+f.strength.toFixed(1), wealth:+f.wealth.toFixed(1), rel:Object.fromEntries(Object.entries(f.rel).map(([k,v])=>[k,Math.round(v)])) }; }
  return { version:SAVE_VERSION, game:GAME_TITLE, seed:world.seed, settings:world.settings, day:world.day, tick:world.tick, player:world.player, factions:F, sites,
    wars: world.wars.filter(w=>!w.ended || world.day-w.endDay<30), warSeq:WAR_SEQ, threats:world.threats, threatSeq:THREAT_SEQ, jobSeq:JOB_SEQ, eras:world.eras, eraIndex:world.eraIndex, eraThreats:world.eraThreats,
    quietUntil:world.quietUntil, lastArch:world.lastArch, archHistory:world.archHistory.slice(-50), bias:world.bias, scars:world.scars, blight:world.blight, statues:world.statues,
    lostSites:world.lostSites.slice(-30), activeEvents:world.activeEvents, timeline:world.timeline.slice(-200), news:world.news.slice(-40), villains:world.villains, metrics:world.metrics, stats:world.stats,
    refugees:world.refugees, damage:world.damage, builds:world.builds, extraZones: world.map.spaceZones.filter(z=>z.deep) };
}
function migrateSave(s){
  if(!s || typeof s!=='object') throw new Error('Not a save');
  let v = s.version||1; const log=[];
  if(v<2){ // Stage 1 → 2: realms, factions, waystones, mounts
    s.player = s.player||{}; s.player.waystones = s.player.waystones||['ws_brightharbour_t0']; s.player.mounts = s.player.mounts||[]; s.player.materials = s.player.materials||{};
    s.factions = s.factions||null; s.sites = s.sites||null; s.timeline=s.timeline||[]; s.news=s.news||[]; v=2; log.push('1→2'); }
  if(v<3){ // → careers, companions, reputation
    const p=s.player; p.careers=p.careers||{}; p.abilities=p.abilities||[]; p.gearUnlocks=p.gearUnlocks||['sword']; p.lumen=p.lumen||{ step:'none', trials:{}, choices:{} }; p.corruption=p.corruption||0;
    p.powers=p.powers||null; p.identity=p.identity||null; p.companions=p.companions||[]; p.titles=p.titles||[]; p.fame=p.fame||{}; p.wanted=p.wanted||{}; p.heroRep=p.heroRep||0; p.civRep=p.civRep||0; p.costumes=p.costumes||[];
    s.villains=s.villains||null; v=3; log.push('2→3'); }
  if(v<4){ // → building and life
    const p=s.player; p.towns=p.towns||[]; p.plots=p.plots||[]; p.homes=p.homes||[]; p.blueprints=p.blueprints||[]; p.farms=p.farms||{}; p.pens=p.pens||[]; p.shops=p.shops||[]; p.seeds=p.seeds||{carrot:4};
    p.inventory=p.inventory||[]; p.functional=p.functional||{}; p.hiltParts=p.hiltParts||[]; s.builds=s.builds||{}; s.damage=s.damage||{}; v=4; log.push('3→4'); }
  if(v<5){ // → the living world
    s.wars=s.wars||[]; s.threats=s.threats||[]; s.eras=s.eras||[{ index:0, name:'The First Age', start:0, end:null }]; s.eraIndex=s.eraIndex||0; s.statues=s.statues||[]; s.scars=s.scars||[]; s.blight=s.blight||{};
    s.player.eraRewards=s.player.eraRewards||[]; s.player.mastery=s.player.mastery||[]; s.settings = s.settings||{}; v=5; log.push('4→5'); }
  s.version=v; s._migrated=log; return s;

function deserializeWorld(raw){
  const s = migrateSave(typeof raw==='string' ? JSON.parse(raw) : JSON.parse(JSON.stringify(raw)));
  const world = newWorld(s.seed||CONFIG.seed, s.settings||{});
  const base = newPlayer(); world.player = deepFill(s.player||{}, base);
  world.day = s.day||0; world.tick = s.tick||0;
  if(s.factions) for(const [id,f] of Object.entries(s.factions)) world.factions[id] = deepFill(f, world.factions[id]||{});
  if(s.sites){ for(const row of s.sites){ const [id,owner,def,dmg,siege,extra]=row; let site=siteById(world,id); if(!site && extra){ site={ id, ...extra, owner, defense:def, pop:0, player:true }; world.map.sites.push(site); } if(site){ site.owner=owner; site.defense=def; site.damage=dmg; site.siege=siege?{by:null}:null; } }
    for(const f of Object.values(world.factions)) f.sites = world.map.sites.filter(s=>s.owner===f.id).map(s=>s.id); }
  for(const k of ['wars','threats','eras','eraIndex','eraThreats','quietUntil','lastArch','archHistory','bias','scars','blight','statues','lostSites','activeEvents','timeline','news','metrics','stats','refugees','damage','builds']) if(s[k]!==undefined && s[k]!==null) world[k] = (typeof s[k]==='object' && !Array.isArray(s[k]) && world[k] && typeof world[k]==='object') ? deepFill(s[k], world[k]) : s[k];
  if(s.villains) world.villains = s.villains;
  if(s.extraZones) for(const z of s.extraZones) if(!world.map.spaceZones.some(x=>x.id===z.id)) world.map.spaceZones.push(z);
  WAR_SEQ=Math.max(WAR_SEQ,s.warSeq||1); THREAT_SEQ=Math.max(THREAT_SEQ,s.threatSeq||1); JOB_SEQ=Math.max(JOB_SEQ,s.jobSeq||1);
  // Stage 1 saves stored pips/bank at the top level
  if(s.pips!==undefined) world.player.pips = s.pips; if(s.bank) world.player.bank = { ...world.player.bank, ...s.bank };
  if(s.characters) world.player.characters = s.characters; if(s.character) world.player.recipe = s.character;
  world._migrated = s._migrated;
  generateJobs(world); return world;
}
function deepFill(v, def){ if(v===undefined||v===null) return def; if(Array.isArray(v)||typeof v!=='object'||typeof def!=='object'||Array.isArray(def)||def===null) return v; const out={...def}; for(const k in v) out[k]=deepFill(v[k], def[k]); return out; }
function saveToString(world){ return 'EBS5.'+lzwCompress(JSON.stringify(serializeWorld(world))); }
function loadFromString(str){ if(str.startsWith('EBS')){ const body=str.slice(str.indexOf('.')+1); return deserializeWorld(lzwDecompress(body)); } return deserializeWorld(str); }

// §SHARE ----------------------------------------------------------------------
function encodeBlueprint(bp){ const norm=normalizeBricks(bp.bricks); return 'EBB1.'+lzwCompress(JSON.stringify({ n:String(bp.name||'Blueprint').slice(0,40), k:bp.kind||'build', b:norm })); }
function normalizeBricks(bricks){ if(!bricks.length) return []; let mx=1e9,my=1e9,mz=1e9; for(const b of bricks){ mx=Math.min(mx,b[1]); my=Math.min(my,b[2]); mz=Math.min(mz,b[3]); } return bricks.map(b=>{ const o=[b[0],b[1]-mx,b[2]-my,b[3]-mz,b[4]||0,b[5]]; if(b[6]) o.push(b[6]); return o; }); }
function decodeBlueprint(code){
  if(typeof code!=='string' || !code.startsWith('EBB1.')) return { ok:false, error:'Not a blueprint code (expected EBB1.)' };
  let obj; try{ obj=JSON.parse(lzwDecompress(code.slice(5).trim())); }catch(e){ return { ok:false, error:'Code is damaged and could not be read' }; }
  if(!obj || !Array.isArray(obj.b)) return { ok:false, error:'No bricks in code' };
  if(obj.b.length > CONFIG.shareMaxBricks) return { ok:false, error:`Too many bricks (${obj.b.length} > ${CONFIG.shareMaxBricks})` };
  const errs = validateModel({ id:'import', version:1, bricks:obj.b, groups:{}, empties:{} });
  if(errs.length) return { ok:false, error:`Invalid: ${errs.slice(0,3).join('; ')}` };
  let ext=0; for(const b of obj.b){ const c=brickCells(b); ext=Math.max(ext,c.x1,c.z1,c.y1/3); if(c.x0<0||c.z0<0||c.y0<0) return { ok:false, error:'Negative coordinates' }; }
  if(ext>256) return { ok:false, error:'Build exceeds the 256-stud size limit' };

// Advances the world without rendering. mode: 'passive' | 'active' | 'pressure'
function simulatedPlayerDay(world, mode){
  const p=world.player; const r=rngFor(world.seed,'simplayer',Math.floor(world.day));
  if(mode==='passive') return 0;
  // a simulated player builds a life: careers, a town, farming
  if(mode==='active'){
    if(!p.careers.army_royalguard && world.day>2) joinCareer(world,'army_royalguard',{force:true});
    if(!p.careers.hero && world.day>10){ grantPowers(world,'lab'); p.identity={exposure:0,exposed:false}; p.heroName='The Bright Comet'; joinCareer(world,'hero',{force:true}); }
    if(!p.careers.builder && world.day>5) joinCareer(world,'builder',{force:true});
    if(p.lumen.step==='none' && world.day>15){ lumenAdvance(world,'spark'); lumenAdvance(world,'temple'); for(const t of Object.keys(LUMEN_TRIALS)) lumenAdvance(world,'trial',{trial:t,choice:t==='mercy'?'spared':t==='stillness'?0.9:'yielded'}); lumenAdvance(world,'heartstone',{stone:'sunkenship'}); lumenAdvance(world,'forge',{hilt:{pommel:'river stone',grip:'wrapped wood',guard:'root curl',emitter:'carved bark'}}); }
    if(!p.towns.length && p.pips>2100){ foundTown(world,'Simhaven', 1800, -2600); }
    for(const t of p.towns){ const g=(k,v,cap)=>{ t.stats[k]=Math.min(cap,t.stats[k]+v); }; g('beds',0.3,40); g('work',0.3,40); g('deco',0.1,20); g('food',0.3,40); g('safety',0.08,15); g('fun',0.05,10); if(t.raid) resolveTownRaid(world,t, r()<0.7); }
    if(world.day>3 && p.companions.length<2){ recruitCompanion(world, COMPANION_POOL[p.companions.length].id); }
  }
  // pick jobs from boards: threats and pressure points first, then war, then the rest
  const all=[]; for(const [sid,list] of Object.entries(world.boards)) for(const j of list) all.push(j);
  const prio = j => j.type==='pressure'?10: j.type==='threat'?8: j.type==='enlist'?6: j.type==='broker'?6: j.type==='capture'?5: j.legendary?4: j.career?3: 1;
  const cand = all.filter(j=> mode==='pressure' ? (j.type==='pressure') : true).sort((a,b)=>prio(b)-prio(a));
  const n = mode==='pressure' ? 1 : 3; let done=0; let threatJobs=0;
  for(const j of cand){ if(done>=n) break; if(j.threat){ if(threatJobs>=1) continue; threatJobs++; } const chance = clamp(0.55 + playerPower(world)/150, 0, 0.95); completeJob(world, j, { success: r()<chance }); done++; }
  return done;
}
function runHeadless(days, mode='active', seed=CONFIG.seed, settings={}){
  const t0 = (typeof performance!=='undefined'?performance:Date).now();
  WAR_SEQ=1; THREAT_SEQ=1; JOB_SEQ=1;
  const world=newWorld(seed, settings); let emptyBoards=0, minBoard=1e9;
  const archSeq=[];
  for(let d=0; d<days; d++){
    simulatedPlayerDay(world, mode);
    advanceWorld(world, 1);
    for(const list of Object.values(world.boards)){ minBoard=Math.min(minBoard,list.length); if(!list.length) emptyBoards++; }
  }

    this.meshG.renderOrder=5; this.meshS.castShadow=false;
  },
  KINDS: {
    fire:{ glow:true, col:['trans_orange','yellow','orange'], life:0.8, size:0.5, grow:-0.5, g:-3, drag:1 },
    smoke:{ glow:false, col:['light_grey','dark_grey'], life:1.6, size:0.6, grow:0.6, g:-1.5, drag:1.5 },
    splash:{ glow:false, col:['trans_blue','sky'], life:0.7, size:0.4, grow:-0.2, g:20, drag:0.2 },
    magic:{ glow:true, col:['trans_clear','sky','lavender'], life:0.6, size:0.35, grow:-0.4, g:0, drag:3 },
    lumen:{ glow:true, col:['trans_clear'], life:0.5, size:0.4, grow:-0.6, g:0, drag:4 },
    umbral:{ glow:false, col:['black','dark_red'], life:0.6, size:0.45, grow:-0.5, g:-2, drag:3 },
    sparkle:{ glow:true, col:['yellow','gold','white'], life:0.5, size:0.25, grow:-0.4, g:2, drag:2 },
    dust:{ glow:false, col:['tan','dark_tan'], life:0.8, size:0.4, grow:0.4, g:-1, drag:2 },
    rain:{ glow:false, col:['trans_blue'], life:1.2, size:0.12, grow:0, g:0, drag:0, stretch:6, splashOnLand:true },
    snow:{ glow:false, col:['white'], life:6, size:0.25, grow:0, g:0, drag:0.2, flat:true },
    hit:{ glow:true, col:['white','yellow'], life:0.25, size:0.35, grow:-1, g:0, drag:5 },
    energy:{ glow:true, col:['sky','trans_clear'], life:0.4, size:0.5, grow:-1, g:0, drag:3 },
    blade:{ glow:true, col:['trans_clear'], life:0.18, size:0.25, grow:-1, g:0, drag:6 },
    edge:{ glow:true, col:['trans_orange'], life:4, size:0.18, grow:-0.04, g:0, drag:10 },
    firework:{ glow:true, col:['red','yellow','lime','sky','magenta'], life:1.2, size:0.35, grow:-0.3, g:6, drag:0.6 },
  },
  spawn(kind,x,y,z,vx=0,vy=0,vz=0,colorOverride){
    const K=this.KINDS[kind]; if(!K) return; let it;
    if(this.items.length<this.cap){ it={}; this.items.push(it); } else { it=this.items[(this.n++)%this.cap]; }
    it.kind=kind; it.K=K; it.x=x; it.y=y; it.z=z; it.vx=vx+(K.drag>0.5?(Math.random()-.5)*2:0); it.vy=vy; it.vz=vz+(K.drag>0.5?(Math.random()-.5)*2:0); it.t=0; it.life=K.life*(0.7+Math.random()*0.6); it.s=K.size*(0.7+Math.random()*0.6);
    const c=colorOverride|| K.col[Math.floor(Math.random()*K.col.length)]; it.color = (c instanceof THREE.Color)? c : (COLORS[c]||COLORS.white); it.rot=Math.random()*6; it.alive=true; return it;
  },
  burst(kind,x,y,z,n=10,speed=4,col){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, e=Math.random()*Math.PI*0.5; this.spawn(kind,x,y,z,Math.cos(a)*Math.cos(e)*speed,Math.sin(e)*speed,Math.sin(a)*Math.cos(e)*speed,col); } },
  update(dt){
    const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), S=new THREE.Vector3(), P=new THREE.Vector3(); let ng=0, ns=0;
    for(const it of this.items){ if(!it.alive) continue; it.t+=dt; if(it.t>it.life){ it.alive=false; continue; } const K=it.K;
      it.vy -= K.g*dt; const d=Math.exp(-K.drag*dt); it.vx*=d; it.vz*=d; if(K.drag>2) it.vy*=d; it.x+=it.vx*dt; it.y+=it.vy*dt; it.z+=it.vz*dt;
      if(K.splashOnLand || K.flat){ const gy=terrainH(Math.floor(it.x),Math.floor(it.z))*PL; if(it.y<gy){ it.alive=false; if(K.splashOnLand && Math.random()<0.3) this.spawn('splash',it.x,gy+0.1,it.z,0,2,0); continue; } }
      const s=Math.max(0.01, it.s*(1+K.grow*it.t/it.life)); P.set(it.x,it.y,it.z); Q.setFromEuler(new THREE.Euler(K.stretch?0:it.rot, it.rot, 0)); S.set(s, K.stretch? s*K.stretch : s, s);
      M.compose(P,Q,S); const m = K.glow? this.meshG : this.meshS; const idx = K.glow? ng++ : ns++; if(idx>=this.cap) continue; m.setMatrixAt(idx,M); m.setColorAt(idx,it.color); }
    this.meshG.count=ng; this.meshS.count=ns; for(const m of [this.meshG,this.meshS]){ m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true; }
  },
};

// §SMASH ----------------------------------------------------------------------
// Smashing splits only the impact region into live physics bricks; pips burst out; bricks go to the brick bank.
const Live = {
  pool:[], mesh:null, cap:CONFIG.maxLiveBricks, active:0,
  init(){ const g=new THREE.BoxGeometry(1,1,1); const m=new THREE.MeshPhysicalMaterial({ roughness:0.3, clearcoat:0.6, clearcoatRoughness:0.2 });
    this.mesh=new THREE.InstancedMesh(g,m,this.cap); this.mesh.count=0; this.mesh.castShadow=true; this.mesh.receiveShadow=true; this.mesh.frustumCulled=false; this.mesh.setColorAt(0,new THREE.Color()); scene.add(this.mesh);
    for(let i=0;i<this.cap;i++) this.pool.push({ alive:false, p:new THREE.Vector3(), v:new THREE.Vector3(), q:new THREE.Quaternion(), w:new THREE.Vector3(), s:new THREE.Vector3(1,1,1), t:0 }); },
  spawn(pid, color, x, y, z, vx, vy, vz){
    let b=this.pool.find(o=>!o.alive); if(!b){ let oldest=null; for(const o of this.pool) if(o.settled && (!oldest||o.t>oldest.t)) oldest=o; b=oldest||this.pool[Math.floor(Math.random()*this.cap)]; }
    const P=PIECES[pid]||PIECES.brick_1x2; const [w,d]=pieceDims(P,0);
    b.alive=true; b.settled=false; b.t=0; b.pid=pid; b.color=color; b.p.set(x,y,z); b.v.set(vx,vy,vz); b.q.setFromEuler(new THREE.Euler(Math.random()*3,Math.random()*3,Math.random()*3));
    b.w.set((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14); b.s.set(Math.min(w,4)*0.96, P.h*PL*0.96, Math.min(d,4)*0.96); b.c=COLORS[color]||COLORS.white; b.rare=RARE_COLORS.has(color)||P.value>1; return b; },
  update(dt){
    const M=new THREE.Matrix4(), dq=new THREE.Quaternion(), e=new THREE.Euler(); let n=0;
    for(const b of this.pool){ if(!b.alive) continue; b.t+=dt;
      if(!b.settled){ b.v.y -= CONFIG.gravity*dt*RT.gravityMul; b.p.addScaledVector(b.v,dt);
        const gy = supportTop(Math.floor(b.p.x),Math.floor(b.p.z), b.p.y/PL+1)*PL + b.s.y/2;
        if(b.p.y<gy){ b.p.y=gy; if(Math.abs(b.v.y)>2){ b.v.y=-b.v.y*0.32; b.v.x*=0.7; b.v.z*=0.7; b.w.multiplyScalar(0.6); if(Math.random()<0.15) Audio.noise(0.02,4000,8,0.05); } else { b.v.y=0; b.v.x*=0.85; b.v.z*=0.85; b.w.multiplyScalar(0.8); } }
        e.set(b.w.x*dt,b.w.y*dt,b.w.z*dt); dq.setFromEuler(e); b.q.multiply(dq);
        if(b.t>0.6 && b.v.lengthSq()<0.3 && b.p.y<=gy+0.01){ b.settled=true; b.q.setFromEuler(new THREE.Euler(0, Math.round(Math.random()*4)*Math.PI/2, 0)); b.p.y=gy; } }
      if(b.settled && b.t>45){ b.alive=false; continue; }
      M.compose(b.p,b.q,b.s); this.mesh.setMatrixAt(n,M); this.mesh.setColorAt(n,b.c); n++; }
    this.mesh.count=n; this.active=n; this.mesh.instanceMatrix.needsUpdate=true; if(this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate=true; RT.stats.liveBricks=n;
  },
  collect(fig){ // walking over loose bricks collects them into the brick bank
    const p=fig.pos; const r2=CONFIG.pickupRadius*CONFIG.pickupRadius; let got=0;
    for(const b of this.pool){ if(!b.alive || b.t<0.5) continue; const dx=b.p.x-p.x, dz=b.p.z-p.z, dy=b.p.y-p.y; if(dx*dx+dz*dz<r2 && Math.abs(dy)<3){ b.alive=false; bankAdd(b.pid,b.color,1); got++; } }
    if(got){ Audio.click(got); RT.world.player.stats.bricksCollected=(RT.world.player.stats.bricksCollected||0)+got; }
  },
};
function bankAdd(pid,color,n){ const k=pid+':'+color; const B=RT.world.player.bank; B[k]=(B[k]||0)+n; if(B[k]<=0) delete B[k]; }
function bankCount(){ let n=0; for(const v of Object.values(RT.world.player.bank)) n+=v; return n; }
function bankHas(pid,color){ return RT.world.player.bank[pid+':'+color]||0; }
const Pips = {
  items:[], mesh:null, cap:400,
  init(){ const g=new THREE.CylinderGeometry(0.32,0.32,0.1,12); g.rotateX(Math.PI/2); this.mesh=new THREE.InstancedMesh(g,new THREE.MeshStandardMaterial({ color:0xf2cd37, metalness:0.9, roughness:0.25, emissive:0x553300 }),this.cap); this.mesh.count=0; this.mesh.frustumCulled=false; scene.add(this.mesh); },
  burst(x,y,z,n,value=1){ n=Math.min(n,40); for(let i=0;i<n;i++){ if(this.items.length>=this.cap) this.items.shift(); const a=Math.random()*Math.PI*2; this.items.push({ p:new THREE.Vector3(x,y,z), v:new THREE.Vector3(Math.cos(a)*4,6+Math.random()*4,Math.sin(a)*4), t:0, value, life:20 }); } },
  update(dt){ const M=new THREE.Matrix4(), Q=new THREE.Quaternion(); let n=0; const ps=RT.players.map(p=>p.fig).filter(f=>f&&!f.ko);
    for(const it of this.items){ it.t+=dt; let tgt=null, td=CONFIG.pipMagnet; for(const f of ps){ const d=f.pos.distanceTo(it.p); if(d<td && it.t>0.35){ td=d; tgt=f; } }
      if(tgt){ const dir=tgt.pos.clone().add(new THREE.Vector3(0,1.5,0)).sub(it.p); const d=dir.length(); if(d<0.9){ it.dead=true; RT.world.player.pips+=it.value; Audio.jingle(1); continue; } it.v.lerp(dir.normalize().multiplyScalar(18),0.2); }
      else { it.v.y-=CONFIG.gravity*dt*RT.gravityMul; const gy=supportTop(Math.floor(it.p.x),Math.floor(it.p.z),it.p.y/PL+1)*PL+0.3; if(it.p.y<gy){ it.p.y=gy; it.v.y=Math.abs(it.v.y)*0.4; it.v.x*=0.6; it.v.z*=0.6; } }
      it.p.addScaledVector(it.v,dt); if(it.t>it.life) it.dead=true; Q.setFromEuler(new THREE.Euler(0,it.t*5,0)); M.compose(it.p,Q,new THREE.Vector3(1,1,1)); this.mesh.setMatrixAt(n++,M); }
    this.items=this.items.filter(i=>!i.dead); this.mesh.count=n; this.mesh.instanceMatrix.needsUpdate=true; },
};
function damageRec(s){ const W=RT.world; return W.damage[s.key]||(W.damage[s.key]={ cols:{}, gone:[] }); }
function smashAt(pt, radius, opts={}){
  // pt: THREE.Vector3 in world units. Returns bricks smashed.
  const W=RT.world; let count=0; const yP=pt.y/PL; const R=radius; const strength=opts.strength||1;
  const seen=new Set(); const touched=new Set();
  for(let x=Math.floor(pt.x-R-4); x<=Math.ceil(pt.x+R); x++) for(let z=Math.floor(pt.z-R-4); z<=Math.ceil(pt.z+R); z++){
    const s=getSector(x,z); if(!s||!s.occ) continue; const col=s.occ[colIndex(s,x,z)]; if(!col) continue;
    for(const iv of col){ const ref=iv[2]; if(seen.has(ref)||ref.dead) continue; seen.add(ref); const b=ref.b; const P=PIECES[b[0]]; const [w,d]=pieceDims(P,b[4]);
      const cx=b[1]+w/2, cy=(b[2]+P.h/2)*PL, cz=b[3]+d/2; const dist=Math.hypot(cx-pt.x,(cy-pt.y)*1.2,cz-pt.z) - Math.max(w,d)*0.35;
      if(dist>R) continue; if(ref.owner && ref.owner.kind==='temple' && !opts.force) continue; if(ref.owner?.kind==='launchpad' && !opts.force) continue;
      if(opts.filter && !opts.filter(ref)) continue;
      // brittle walls only for bears bare-pawed; everything else smashes
      const home = ref.player ? ref.home : null;
      ref.dead=true; removeOcc(s,ref); const owner = ref.ownerSector||s.key; const os=RT.sectors.get(owner)||s; collapseBrick(os, ref.uid); touched.add(os);
      if(ref.player){ const list=W.builds[os.key]; if(list){ const i=list.findIndex(x=>`pb#${x[7]}`===ref.uid); if(i>=0) list.splice(i,1); } } else damageRec(os).gone.push(ref.uid);
      const dir=new THREE.Vector3(cx-pt.x, Math.max(0.5,cy-pt.y+0.8), cz-pt.z).normalize();
      if(!opts.silent) Live.spawn(b[0], b[5], cx, cy, cz, dir.x*(4+Math.random()*6)*strength, dir.y*(5+Math.random()*6)*strength, dir.z*(4+Math.random()*6)*strength);
      count++; if(ref.fn) Bus.emit('functional.smashed',{ref});
      if(count>180) break; }
  }
  // terrain: big hits dig columns out
  if(R>=1.6 && !opts.noTerrain){ for(let x=Math.floor(pt.x-R); x<=pt.x+R; x+=2) for(let z=Math.floor(pt.z-R); z<=pt.z+R; z+=2){ const s=getSector(x,z); if(!s) continue; const ci=Math.floor((x-s.x0)/2)*32+Math.floor((z-s.z0)/2); const h=s.cols[ci];
      if(Math.abs(h*PL-pt.y)>R*0.9 || h<=2) continue; if(Math.hypot(x+1-pt.x,z+1-pt.z)>R) continue; const dh=Math.min(3, h-2); s.cols[ci]-=dh; damageRec(s).cols[ci]=(damageRec(s).cols[ci]||0)-dh; touched.add(s);
      const col=s.colCol[ci]; for(let i=0;i<2;i++) Live.spawn('brick_2x2',col,x+1,h*PL-0.6,z+1,(Math.random()-.5)*6,4+Math.random()*5,(Math.random()-.5)*6); count+=2; if(W.player) W.metrics.miningDepth+=0.002; } }
  // scatter (trees fall apart into brown bricks; rocks into stone; ore into rare pieces)
  for(const [it,s] of Scatter.near(pt.x,pt.z,R+1.5)){ if(Math.abs(it.y*PL-pt.y)>8 && it.kind!=='tree') continue; if(it.kind==='tree' && pt.y>it.y*PL+14) continue; it.alive=false; damageRec(s).gone.push(it.id); Scatter.dirty=true;
    const m=genProp(it.kind==='grass'?'rock':it.kind, it.v, it.realm); const lim = it.kind==='grass'?2:Math.min(m.bricks.length,40);
    for(let i=0;i<lim;i++){ const b=m.bricks[i]; Live.spawn(b[0], it.kind==='grass'?'green':b[5], it.x+b[1], it.y*PL+b[2]*PL, it.z+b[3], (Math.random()-.5)*6, 3+Math.random()*6, (Math.random()-.5)*6); }
    const mat = it.kind==='tree'?'wood': it.kind==='rock'?'stone': it.kind==='ore'?'ore': it.kind==='crystal'?'crystal':null;
    if(mat && W){ W.player.materials[mat]=(W.player.materials[mat]||0)+(it.kind==='tree'?4:2); if(it.kind==='ore'&&it.realm==='isles') W.player.materials.gold=(W.player.materials.gold||0)+1; if(it.realm==='frontier') W.player.materials.alien=(W.player.materials.alien||0)+1; if(it.kind==='tree') W.metrics.forestCut+=0.2; }
    count+=lim; }
  if(count){ FX.burst('dust',pt.x,pt.y,pt.z,Math.min(12,count),3); Audio.click(count); if(!opts.noPips) Pips.burst(pt.x,pt.y+0.5,pt.z, Math.max(1,Math.round(count/3)));
    if(W) W.player.stats.smashed+=count; RT.shake=Math.min(1,RT.shake+count*0.02); Bus.emit('smash',{pt,count,by:opts.by});
    for(const s of touched) Stream.markDirty(s);
    if(opts.rubble!==false && count>=10 && Math.random()<0.45) Rubble.make(pt.clone(), count); }
  return count;
}
// cut through bricks along a line (lumen blades leave a glowing edge)
function cutLine(from, dir, len, by){ let n=0; for(let t=0;t<len;t+=0.6){ const p=from.clone().addScaledVector(dir,t); n+=smashAt(p,0.6,{noTerrain:true,noPips:true,rubble:false,strength:0.4,by}); if(n) for(let k=0;k<2;k++) FX.spawn('edge',p.x,p.y,p.z,0,0,0, by?.bladeColor); } return n; }

// §REBUILD --------------------------------------------------------------------
// Some rubble piles bounce and sparkle: hold build and the bricks leap up and click into place one by one.
const Rubble = {
  piles:[],
  make(pt, count){ const ch=pick(Math.random, RUBBLE_CHOICES); const ground=supportTop(Math.floor(pt.x),Math.floor(pt.z),pt.y/PL+2); if(this.piles.length>8) this.piles.shift();
    this.piles.push({ x:Math.floor(pt.x), z:Math.floor(pt.z), y:ground, options:ch, choice:0, progress:0, building:null, done:false, t:0, rot: Math.floor(Math.random()*4) }); },
  nearest(fig, r=4){ let best=null, bd=r; for(const p of this.piles){ if(p.done) continue; const d=Math.hypot(p.x-fig.pos.x,p.z-fig.pos.z); if(d<bd){ bd=d; best=p; } } return best; },
  update(dt){
    for(const p of this.piles){ if(p.done) continue; p.t+=dt; if(Math.random()<dt*6) FX.spawn('sparkle',p.x+(Math.random()-.5)*2,p.y*PL+0.5,p.z+(Math.random()-.5)*2,0,2,0);
      if(p.building){ const B=p.building; B.timer-=dt; if(B.holding===false){ B.idle+=dt; if(B.idle>0.3) continue; }
        while(B.timer<=0 && B.i<B.bricks.length){ B.timer+=0.045; const b=B.bricks[B.i++]; placeWorldBrick(b,{ silent:true, model:'rubble:'+B.id }); Audio.snap(B.i%12); FX.spawn('sparkle',b[1]+0.5,b[2]*PL+0.5,b[3]+0.5,0,1,0); }
        if(B.i>=B.bricks.length){ p.done=true; Audio.jingle(4); Pips.burst(p.x,p.y*PL+1,p.z,8); FX.burst('sparkle',p.x,p.y*PL+1,p.z,24,6); Bus.emit('rubble.built',{id:B.id,x:p.x,z:p.z,y:p.y}); toast(`Built: ${RUBBLE_BUILDS[B.id].name}!`);
          RT.rubbleBuilt.push({ id:B.id, x:p.x, y:p.y, z:p.z, bricks:B.bricks }); } } }
    this.piles=this.piles.filter(p=>!p.done || p.t<1);
  },
  build(p, holding){ if(!p) return; if(!p.building){ const id=p.options[p.choice%p.options.length]; const def=RUBBLE_BUILDS[id];
      const bricks=def.bricks.map(b=>{ const [x,z]=rotXZ(b[1],b[3],p.rot); return [b[0],p.x+x,p.y+b[2],p.z+z,(b[4]+p.rot)&3,b[5]]; }).sort((a,b)=>a[2]-b[2]);
      p.building={ id, bricks, i:0, timer:0, idle:0, holding:true }; }
    p.building.holding=holding; if(holding) p.building.idle=0; },
};
function rotXZ(x,z,r){ for(let i=0;i<r;i++){ const t=x; x=-z; z=t; } return [x,z]; }
function placeWorldBrick(b, opts={}){ // b: [pid,x,y,z,r,col,print]; stored as a delta in world.builds
  const s=getSector(b[1],b[3]); if(!s) return null; const W=RT.world; const id=(W.buildSeq=(W.buildSeq||0)+1);
  const row=[b[0],b[1],b[2],b[3],b[4]||0,b[5],b[6]||null,id]; (W.builds[s.key]||(W.builds[s.key]=[])).push(row);
  const ref={ uid:`pb#${id}`, b:row.slice(0,7), solid:PIECES[b[0]].shape!=='door', model:opts.model||'player', fn:FUNCTIONAL[b[0]]?.fn||null, player:true }; s.bricks.push(ref); registerBrick(s,ref); addDynBrick(s,ref); Stream.markDirty(s);
  if(!opts.silent) Audio.snap(); return ref;
}
function removeWorldBrick(ref){ const s=RT.sectors.get(ref.ownerSector) || getSector(ref.b[1],ref.b[3]); if(!s) return; ref.dead=true; removeOcc(s,ref); collapseBrick(s,ref.uid); if(s.dynMeshes){ for(const m of s.dynMeshes) if(m.userData.uid===ref.uid){ m.visible=false; } }
  if(ref.player){ const list=RT.world.builds[s.key]; if(list){ const i=list.findIndex(x=>`pb#${x[7]}`===ref.uid); if(i>=0) list.splice(i,1); } } else damageRec(s).gone.push(ref.uid); Stream.markDirty(s); }
