// §BATTLES --------------------------------------------------------------------
// 30–40 figure battles with objectives; Sergeants lead a squad, Captains several (orders: 5 follow, 6 hold, 7 charge, 8 regroup).
const Battles = {
  cur:null,
  start(o){ if(this.cur) return; const W=RT.world; const f=RT.players[0].fig; const site=siteById(W,o.site); const N=CONFIG.battleSize; const mySide=o.att||'royalguard', foe=o.def||W.factions[mySide]?.enemies?.[0]||'bandits';
    const center=new THREE.Vector3(f.pos.x+20*Math.sin(f.yaw), 0, f.pos.z+20*Math.cos(f.yaw)); const objective = pick(Math.random,['hold the wall','capture the flag tower','defend the camp']);
    const mk=(side,team,n,off)=>{ const F=W.factions[side]; for(let i=0;i<n;i++){ const x=center.x+off+(Math.random()-.5)*16, z=center.z+(Math.random()-.5)*24; const rc=randomRecipe(Math.random,pick(Math.random,['human','human','bear','wolf','frog']),{ held:pick(Math.random,['sword','spear','bow','hammer']), hat:'helmet_kettle', torso:'outfit_armor' }); rc.colors.torso=F?.color||'red';
      const s=spawnFigure(rc,new THREE.Vector3(x,surfaceY(x,z),z),{ team, brain: team==='player'?'follow':'goto', ai:{ dest:center.clone(), then:'hold', order:'charge' }, name:`${F?.name||side} soldier`, hp:50 }); s.battle=true; if(team==='player'){ s.controller.target=f; s.squad=Math.floor(i/6); } } };
    const rank=Math.max(...ARMY_IDS.map(a=>W.player.careers[a]?.active?W.player.careers[a].rank:0)); const allies=Math.floor(N/2)-1;
    mk(mySide,'player',allies,-14); mk(foe,'enemy',N-allies-1,14);
    this.cur={ center, objective, t:0, mySide, foe, job:o.job, rank, squads: rank>=5?Math.ceil(allies/6): rank>=3?1:0 };
    for(let i=0;i<4;i++) placeWorldBrick(['brick_2x2',Math.floor(center.x)+i*2,Math.floor(surfaceY(center.x,center.z)/PL),Math.floor(center.z),0,'red'],{silent:true});
    toast(`BATTLE: ${objective}! ${this.cur.squads?`You command ${this.cur.squads} squad${this.cur.squads>1?'s':''}: 5 follow · 6 hold · 7 charge · 8 regroup`:''}`); Audio.impact(true); },
  update(dt){ const B=this.cur; if(!B) return; B.t+=dt; const f=RT.players[0].fig;
    for(const [k,ord] of [['Digit5','follow'],['Digit6','hold'],['Digit7','charge'],['Digit8','regroup']]) if(Input.hit(k) && B.squads){ for(const s of RT.figures) if(s.battle && s.team==='player' && s.squad<B.squads){ s.controller.o.order=ord; s.controller.brain= ord==='hold'?'hold':'follow'; s.controller.home=s.pos.clone(); s.controller.target=f; } toast(`Squads: ${ord}!`); }
    const mine=RT.figures.filter(s=>s.battle&&s.team==='player'&&!s.ko&&s.alive).length, theirs=RT.figures.filter(s=>s.battle&&s.team==='enemy'&&!s.ko&&s.alive).length;
    if(B.job) B.job.progressText=`(allies ${mine} · enemies ${theirs})`;
    if(theirs===0 || (mine===0 && B.t>20) || B.t>240){ const won=theirs===0||theirs<mine; for(const s of RT.figures) if(s.battle) s.alive=false; this.cur=null; toast(won?'Victory!':'The battle is lost.'); if(B.job){ RT.job=B.job; Jobs.finish(won); } else if(won) completeJob(RT.world, makeJob(RT.world,'battle',nearestSite(f.pos),B.mySide,{target:B.foe}),{success:true}); } },
};
function nearestSite(p){ let best=null,bd=1e9; for(const s of RT.world.map.sites){ const d=Math.hypot(s.x-p.x,s.z-p.z); if(d<bd){ bd=d; best=s; } } return best; }

const BuildMode = {
  on:false, piece:'brick_2x4', color:'red', rot:0, ghost:null, layer:0, mirror:false, undo:[], redo:[],
  toggle(pl){ this.on=!this.on; Modes.set(this.on?'BUILD':'ON_FOOT'); $('buildbar').style.display=this.on?'block':'none'; if(this.on){ if(document.pointerLockElement) document.exitPointerLock(); this.renderBar(); toast('Build mode: click to place, right-drag to orbit, R rotate, Del/X remove, P paint, M mirror, Z undo, Y redo, B exit'); } if(this.ghost) this.ghost.visible=this.on; },
  renderBar(){ const P=RT.world.player; const cats=['brick','plate','tile','slope','round','functional'];
    $('buildbar').innerHTML=`<b>Build</b> · bank ${bankCount()} · ${P.pips} pips · ${esc(this.piece)} <span class="sw" style="background:${PALETTE[this.color]}"></span> ${this.mirror?'· mirror':''}<div class="pal">${Object.keys(PIECES).filter(id=>cats.includes(PIECES[id].cat)||PIECES[id].design&&['brick','plate','tile','slope','round','arch','frame','fence'].includes(PIECES[id].kind)).slice(0,90).map(id=>`<span class="pc ${id===this.piece?'on':''}" data-p="${id}">${id.replace('brick_','b').replace('plate_','p').replace('tile_','t').replace('fn_','★')} ${bankHas(id,this.color)||''}</span>`).join('')}</div><div class="pal">${COLOR_NAMES.map(c=>`<span class="sw ${c===this.color?'on':''}" data-c="${c}" style="background:${PALETTE[c]}"></span>`).join('')}</div>`;
    $('buildbar').querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{ this.piece=el.dataset.p; this.renderBar(); }); $('buildbar').querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{ this.color=el.dataset.c; this.renderBar(); }); },
  update(pl,dt){ if(!this.on) return; const f=pl.fig; if(Input.hit('KeyB')){ this.toggle(pl); return; }
    // free camera orbiting the build
    const cam=pl.cam; if(Input.mouse.b.has(2)){ cam.yaw-=Input.mouse.dx*0.005; cam.pitch=clamp(cam.pitch+Input.mouse.dy*0.005,-0.2,1.4); } RT.zoom=clamp((RT.zoom||1)+Input.mouse.wheel*0.1,0.4,3);
    const mv=new THREE.Vector3((Input.down('KeyD')?1:0)-(Input.down('KeyA')?1:0),0,(Input.down('KeyS')?1:0)-(Input.down('KeyW')?1:0)).applyAxisAngle(_UP,cam.yaw); f.pos.addScaledVector(mv,dt*14); f.pos.y=surfaceY(f.pos.x,f.pos.z);
    if(Input.hit('KeyR')) this.rot=(this.rot+1)&3; if(Input.hit('KeyM')) { this.mirror=!this.mirror; this.renderBar(); } if(Input.hit('PageUp')) this.layer++; if(Input.hit('PageDown')) this.layer--;
    if(Input.hit('KeyZ')) this.doUndo(); if(Input.hit('KeyY')) this.doRedo();
    // ghost brick snapped to studs under the mouse
    const ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(RT.mouseX/innerWidth*2-1, -(RT.mouseY/innerHeight)*2+1), camera);
    let hitP=null; for(let t=1;t<80;t+=0.25){ const p=ray.ray.at(t,new THREE.Vector3()); if(solidAt(Math.floor(p.x),Math.floor(p.y/PL),Math.floor(p.z))){ const back=ray.ray.at(t-0.25,new THREE.Vector3()); hitP={ cell:[Math.floor(back.x),Math.floor(back.y/PL),Math.floor(back.z)], solid:[Math.floor(p.x),Math.floor(p.y/PL),Math.floor(p.z)] }; break; } }
    if(!this.ghost){ this.ghost=new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45, depthWrite:false })); scene.add(this.ghost); }
    if(!hitP){ this.ghost.visible=false; return; } const P=PIECES[this.piece]; const [w,d]=pieceDims(P,this.rot); const y=Math.max(hitP.cell[1]+this.layer, supportTop(hitP.cell[0],hitP.cell[2],hitP.cell[1]+this.layer+0.5));
    const pos=[hitP.cell[0]-Math.floor((w-1)/2), y, hitP.cell[2]-Math.floor((d-1)/2)];
    this.ghost.visible=true; this.ghost.scale.set(w,P.h*PL,d); this.ghost.position.set(pos[0]+w/2,(pos[1]+P.h/2)*PL,pos[2]+d/2); this.ghost.material.color.copy(COLORS[this.color]);
    if(Input.mouse.pressed.has(0) && !RT.menuOpen && !(RT.mouseX<innerWidth*0.48 && RT.mouseY>innerHeight-200)) this.place(pos);
    if(Input.hit('Delete')||Input.hit('KeyX')){ const ref=brickSolidAt(...hitP.solid); if(ref && (ref.player||RT.creative)) this.remove(ref); }
    if(Input.hit('KeyP')){ const ref=brickSolidAt(...hitP.solid); if(ref && ref.player){ const b=ref.b.slice(); this.remove(ref,true); b[5]=this.color; this.placeRaw(b); } }
  },
  cost(pid,color){ if(RT.creative) return true; const P=RT.world.player; if(bankHas(pid,color)>0){ bankAdd(pid,color,-1); return true; } const price = FUNCTIONAL[pid]?.cost || PIECES[pid].w*PIECES[pid].d*Math.max(1,PIECES[pid].h/3)*(RARE_COLORS.has(color)?3:1); if(P.pips>=price){ P.pips-=price; return true; } toast(`Missing ${pid} in ${color} — needs ${price} pips.`); return false; },
  place(pos){ const bs=[[this.piece,pos[0],pos[1],pos[2],this.rot,this.color]]; if(this.mirror){ const cx=Math.floor(RT.players[0].fig.pos.x); const P=PIECES[this.piece]; const [w]=pieceDims(P,this.rot); bs.push([this.piece,2*cx-pos[0]-w,pos[1],pos[2],this.rot,this.color]); }
    for(const b of bs){ const cells=cellsOf(b); if(cells.some(c=>{ const [x,y,z]=c.split(',').map(Number); return solidAt(x,y,z); })) continue; if(!this.cost(b[0],b[5])) return; const ref=this.placeRaw(b); if(ref){ this.undo.push({op:'add',ref}); this.redo=[]; if(this.undo.length>CONFIG.maxUndo) this.undo.shift(); } }
    RT.world.player.stats.built++; this.renderBar(); },
  placeRaw(b){ return placeWorldBrick(b); },
  remove(ref, noRefund){ removeWorldBrick(ref); if(!noRefund && !RT.creative) bankAdd(ref.b[0],ref.b[5],1); this.undo.push({op:'del',b:ref.b.slice()}); Audio.click(1); this.renderBar(); },
  doUndo(){ const u=this.undo.pop(); if(!u) return; if(u.op==='add'){ removeWorldBrick(u.ref); bankAdd(u.ref.b[0],u.ref.b[5],1); this.redo.push({op:'add',b:u.ref.b.slice()}); } else { const ref=this.placeRaw(u.b); this.redo.push({op:'del',ref}); } },
  doRedo(){ const r=this.redo.pop(); if(!r) return; if(r.op==='add'){ const ref=this.placeRaw(r.b); this.undo.push({op:'add',ref}); } else if(r.ref){ removeWorldBrick(r.ref); this.undo.push({op:'del',b:r.ref.b.slice()}); } },
};

const Bench = {
  start(kind){ this.kind=kind; this.t=0; this.samples=[]; const f=RT.players[0].fig;
    if(kind==='crowd'){ const kinds=['human','bear','fox','wolf','rabbit','owl','horse','shark','dragon','robot','frog','cat','turtle','serpent','yeti']; for(let i=0;i<60;i++){ const k=kinds[i%kinds.length]; const sp=SPECIES[k]?k:'human'; const x=f.pos.x+(i%10)*3-15, z=f.pos.z+Math.floor(i/10)*3+6; spawnFigure({species:sp},new THREE.Vector3(x,surfaceY(x,z),z),{team:'neutral',brain:'wander',ai:{radius:8}}); } }
    if(kind==='smash'){ for(let i=0;i<10;i++){ const x=f.pos.x+i*2-10,z=f.pos.z+8; spawnFigure({species:'crab',held:'sword',colors:{body:'red',torso:'red',legs:'orange'}},new THREE.Vector3(x,surfaceY(x,z),z),{team:'enemy',brain:'wander',ai:{aggro:30}}); } }
    if(kind==='build'){ const ox=Math.floor(f.pos.x)+6, oz=Math.floor(f.pos.z)+6, oy=Math.floor(surfaceY(ox,oz)/PL); const q=[]; for(let i=0;i<2000;i++) q.push([pick(Math.random,['brick_2x4','brick_2x2','brick_1x2']),(i%20)*2-20,Math.floor(i/200)*3,Math.floor(i/20)%10*2,0,pick(Math.random,['red','yellow','blue','white'])]); for(const b of q) b[2]+=0; RT.creative=true; RT.autoBuild={queue:q.map(b=>[b[0],b[1],b[2],b[3],b[4],b[5]]),ox,oy,oz,t:0}; RT.autoBuild.t=0; }
    if(kind==='town'){ for(let i=0;i<40;i++){ const x=f.pos.x+(Math.random()-.5)*60, z=f.pos.z+(Math.random()-.5)*60; spawnFigure(randomRecipe(Math.random,pick(Math.random,PLAYABLE_SPECIES)),new THREE.Vector3(x,surfaceY(x,z),z),{team:'neutral',brain:'townsfolk',ai:{radius:20}}); } Weather.kind='rain'; Weather.next=999; }
    const step=()=>{ this.t+=1/60; this.samples.push(RT.frameMs); if(kind==='town'){ f.vel.set(Math.sin(this.t*0.2)*CONFIG.sprintSpeed,0,Math.cos(this.t*0.2)*CONFIG.sprintSpeed); f.pos.addScaledVector(f.vel,1/60); f.pos.y=surfaceY(f.pos.x,f.pos.z); }
      if(kind==='smash' && Math.floor(this.t*2)!==Math.floor((this.t-1/60)*2)){ const p=f.pos.clone().add(new THREE.Vector3(Math.sin(this.t)*10,2,Math.cos(this.t)*10)); smashAt(p,3,{by:f}); }
      if(this.t<(+QS.get('secs')||30)) requestAnimationFrame(step); else { const s=this.samples.slice(30); const avg=s.reduce((a,b)=>a+b,0)/s.length, worst=Math.max(...s); const fpsAvg=RT.fps; console.log(`BENCH ${kind}: avg frame ${avg.toFixed(2)}ms, worst ${worst.toFixed(2)}ms, fps ~${fpsAvg.toFixed(0)}, draw calls ${RT.drawCalls}, tris ${RT.tris}, live bricks ${Live.active}`); window.BENCH_RESULT={kind,avg,worst,fps:fpsAvg,drawCalls:RT.drawCalls,tris:RT.tris}; } };
    requestAnimationFrame(step); },
};

boot().catch(e=>{ console.error(e); $('loading').textContent='Everbrick failed to start: '+e.message; });

// §§END
</script>
