<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Everbrick</title>
<style>
  :root{--ink:#1b2a34;--paper:#fff8e8;--accent:#fe8a18;--good:#237841;--bad:#c91a09;--panel:rgba(255,248,232,.94)}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fc3e9;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;user-select:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
  #hudTop{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px}
  #hearts{display:flex;gap:3px}
  .heart{width:18px;height:16px;background:#c91a09;border:2px solid var(--ink);border-radius:4px 4px 8px 8px}
  .heart.off{background:#a0a5a9}
  #stam{width:150px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
  #stam>i{display:block;height:100%;background:#bbe90b}
  #slots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .slot{width:58px;height:58px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center;box-shadow:0 4px 0 var(--ink)}
  .slot b{font-size:15px}.slot .cd{position:absolute;inset:0;background:rgba(27,42,52,.45);border-radius:9px;transform-origin:bottom}
  #compass{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:300px;height:26px;overflow:hidden}
  #compassInner{white-space:nowrap;font-weight:800;letter-spacing:2px}
  #hudRight{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:340px}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:700;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #prompt{position:absolute;left:50%;bottom:90px;transform:translateX(-50%)}
  #debug{position:fixed;left:8px;bottom:8px;font:11px/1.35 monospace;background:rgba(0,0,0,.65);color:#bbe90b;padding:6px 8px;border-radius:6px;white-space:pre;display:none;pointer-events:none}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(27,42,52,.35);pointer-events:auto}
  #menuBox{background:var(--paper);border:4px solid var(--ink);border-radius:18px;min-width:min(720px,92vw);max-width:94vw;max-height:86vh;overflow:auto;padding:16px 20px;box-shadow:0 8px 0 var(--ink)}
  #menuBox h2{margin:0 0 8px}#menuBox h3{margin:12px 0 4px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  button{font:inherit;font-weight:700;background:#f2cd37;border:3px solid var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
  button.on{background:#fe8a18}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  table{border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #d6c9a8;padding:3px 6px;text-align:left}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .sw{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;cursor:pointer;display:inline-block}
  .sw.on{outline:3px solid #fe8a18}
  #buildbar{position:absolute;left:12px;bottom:12px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:8px;display:none;max-width:46vw;pointer-events:auto;font-size:12px}
  #buildbar .pal{display:flex;flex-wrap:wrap;gap:3px;max-height:96px;overflow:auto}
  #buildbar .pc{padding:2px 5px;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer}
  #buildbar .pc.on{background:#fe8a18}
  #news{font-size:12px;max-width:340px}
  #splitLine{position:absolute;inset:0;pointer-events:none}
  #photoUI{position:fixed;right:12px;bottom:12px;display:none;pointer-events:auto}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9fc3e9;font-size:28px;font-weight:900;z-index:9}
</style>

<script type="module">
/* ============================================================================

 *   §CONFIG §RNG §BUS §PALETTE §PIECES §FUNCTIONAL §VALIDATOR §COMPRESS

import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* §SIMCORE:BEGIN */
// §CONFIG ---------------------------------------------------------------------
const GAME_TITLE = "Everbrick";  // placeholder
const CURRENCY   = "pips";       // coins that spill from smashed things
const CONFIG = {
  seed: 20261021,

  sectorSize: 64,          // studs per sector edge

// §RNG ------------------------------------------------------------------------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function hashN(...a){ let h=0x9e3779b9|0; for(const v of a){ const k = typeof v==='number' ? (Math.floor(v)|0) : hashStr(String(v)); h^=k; h=Math.imul(h^(h>>>16),0x85ebca6b); h=Math.imul(h^(h>>>13),0xc2b2ae35); h^=h>>>16; } return h>>>0; }
const rngFor=(...a)=>mulberry32(hashN(...a));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)%arr.length];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function noise2(seed,x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const h=(i,j)=>(hashN(seed,i,j)&0xffff)/65535; const u=smooth(xf), v=smooth(zf);
  return lerp(lerp(h(xi,zi),h(xi+1,zi),u), lerp(h(xi,zi+1),h(xi+1,zi+1),u), v); }
function fbm(seed,x,z,oct=4){ let a=0,amp=.5,f=1,n=0; for(let i=0;i<oct;i++){ a+=amp*noise2(seed+i*101,x*f,z*f); n+=amp; amp*=.5; f*=2; } return a/n; }
function weighted(r, items, wf){ let tot=0; for(const it of items) tot+=Math.max(0,wf(it)); if(tot<=0) return null; let x=r()*tot; for(const it of items){ x-=Math.max(0,wf(it)); if(x<=0) return it; } return items[items.length-1]; }

// §BUS ------------------------------------------------------------------------
function makeBus(){ const h={}; return {
  on(e,f){ (h[e]||(h[e]=[])).push(f); return ()=>{ h[e]=h[e].filter(x=>x!==f); }; },
  emit(e,d){ const l=h[e]; if(l) for(const f of l.slice()) f(d); const w=h['*']; if(w) for(const f of w.slice()) f(e,d); },
  clear(){ for(const k in h) delete h[k]; }
}; }
const Bus = makeBus();

// §PALETTE --------------------------------------------------------------------
const PALETTE = {

  cream:'#F2E2B6', tan:'#D8B878', brown:'#7B4A29', dark_brown:'#4A2D1D', lime:'#A4CC38', green:'#2E9A48', dark_green:'#1E5833', sand_green:'#9ABD9B',
  light_blue:'#A4D4EC', blue:'#1E6EC1', dark_blue:'#1E3868', sky_blue:'#5DB6E5', purple:'#6A3E9F', lavender:'#C6B2E4', pink:'#F3A5C5', magenta:'#C22F7E',
  olive:'#7C7B39', gold:'#C8A139', silver:'#B6BBC1', trans_clear:'#E8F3F7', trans_blue:'#4CA2E0', trans_red:'#E03F38', trans_orange:'#F59829', trans_green:'#59C368',
};
const COLOR_NAMES = Object.keys(PALETTE);
const isTrans = c => c && c.startsWith('trans_');
const GLOW_COLORS = new Set(['trans_orange']);
const RARE_COLORS = new Set(['gold','silver','trans_orange','trans_green','trans_clear','trans_blue','trans_red','purple','magenta']);

// §PIECES ---------------------------------------------------------------------
// Grid: 1 stud = 1 unit (x,z); y in plates (1 plate = 0.4u, 1 brick = 3 plates).
// A piece id maps to { w (x-extent at r=0), d (z-extent), h (plates), shape, studs }.
const PIECES = {};
function defPiece(id, w, d, h, shape, extra={}){ PIECES[id] = { id, w, d, h, shape, studs: shape==='box', solid: shape==='box', cat: extra.cat||shape, value: extra.value||1, ...extra }; }
(function(){
  const sizes=[[1,1],[1,2],[1,3],[1,4],[1,6],[1,8],[2,2],[2,3],[2,4],[2,6],[2,8],[4,4],[4,6],[4,8],[6,6],[8,8],[16,16]];
  for(const [a,b] of sizes){

  defPiece('slope_2x2',2,2,3,'slope',{cat:'slope'}); defPiece('slope_2x4',4,2,3,'slope',{cat:'slope'});
  defPiece('slope_1x2',1,2,3,'slope',{cat:'slope'}); defPiece('slope_inv_2x2',2,2,3,'slopeInv',{cat:'slope'});

  defPiece('cone_1x1',1,1,3,'cone',{cat:'round'}); defPiece('cone_2x2',2,2,6,'cone',{cat:'round'});
  defPiece('dome_4x4',4,4,6,'dome',{cat:'round'}); defPiece('dome_2x2',2,2,3,'dome',{cat:'round'});
  defPiece('arch_1x4',1,4,3,'arch',{cat:'arch'}); defPiece('arch_1x6',1,6,6,'arch',{cat:'arch'});
  defPiece('wedge_2x4',2,4,1,'wedge',{cat:'wedge'}); defPiece('wedge_3x3',3,3,1,'wedge',{cat:'wedge'});
  defPiece('window_1x2x3',1,2,9,'window',{cat:'window'}); defPiece('window_1x4x3',1,4,9,'window',{cat:'window'});
  defPiece('door_1x2x5',1,2,15,'door',{cat:'door'}); defPiece('door_1x4x6',1,4,18,'door',{cat:'door'});
  defPiece('fence_1x4',1,4,3,'fence',{cat:'fence'}); defPiece('ladder_1x2',1,2,12,'ladder',{cat:'fence'});
  defPiece('wheel_2x2',2,2,4,'wheel',{cat:'vehicle'}); defPiece('tyre_2x2',2,2,4,'tyre',{cat:'vehicle'});
  defPiece('panel_1x4',1,4,9,'panel',{cat:'window'}); defPiece('panel_1x2',1,2,6,'panel',{cat:'window'});
  defPiece('hinge_1x2',1,2,1,'hinge',{cat:'technic'}); defPiece('turntable_2x2',2,2,1,'turntable',{cat:'technic'});
  defPiece('dish_4x4',4,4,1,'dish',{cat:'round'}); defPiece('rotor_6x6',6,6,1,'rotor',{cat:'vehicle'});
  defPiece('flame_1x1',1,1,3,'flame',{cat:'fx'}); defPiece('canopy_4x6',4,6,3,'canopy',{cat:'vehicle'});
  defPiece('screen_1x2',1,2,1,'screen',{cat:'tile',studs:false}); defPiece('lamp_1x1',1,1,3,'lamp',{cat:'fx'});
  defPiece('seat_2x2',2,2,3,'seat',{cat:'vehicle'}); defPiece('gem_1x1',1,1,1,'gem',{cat:'fx',value:5});
})();
const pieceDims = (p, r) => (r&1) ? [p.d, p.w] : [p.w, p.d];
// Design pieces (design/pieces.json): registered over the built-in set so every delivered model validates and renders.
const KIND_SHAPE = { brick:'box', plate:'box', tile:'box', tile_round:'round', slope:'slope', slope_inv:'slopeInv', curve:'curve', round:'round', dome:'dome', cone:'cone', arch:'arch', wedge:'wedge',
  frame:'window', glass:'panel', fence:'fence', bar:'fence', ladder:'ladder', rope_bridge:'box', wheel:'wheel', tyre:'tyre', axle:'hinge', leaf:'wedge', bamboo:'round', flower:'flame', grass:'flame',
  rock:'round', trunk:'round', hinge:'hinge', turntable:'turntable', dish:'dish', rotor:'rotor', flame:'flame', canopy:'canopy', screen:'screen', lamp:'lamp', steering:'hinge', seat:'seat', gem:'gem',
  sail:'panel', cannon:'wheel', chain:'fence' };
const NON_SOLID_KINDS = new Set(['grass','flower','flame','chain','sail','leaf']);
function registerDesignPieces(json){
  if(!json || !json.pieces) return 0; let n=0;
  for(const [id,v] of Object.entries(json.pieces)){
    const shape = KIND_SHAPE[v.kind] || 'box';
    PIECES[id] = { id, w:v.w, d:v.d, h:v.h_plates, shape, kind:v.kind, studs: (v.kind==='brick'||v.kind==='plate') && (v.studs||[]).length>0, studList:v.studs||[], solid: shape==='box' && v.kind!=='tile' || false,
      cat: v.kind, value: (v.kind==='gem'?5:1), fitsInto: v.fitsInto||null, nonSolid: NON_SOLID_KINDS.has(v.kind) || v.kind==='frame' && id.startsWith('door'), design:true, moving:v.moving||null };
    if(v.kind==='tile') PIECES[id].solid=true;
    n++; }
  return n;
}

// §FUNCTIONAL -----------------------------------------------------------------
// Functional pieces: each has a footprint, a group, a cost in pips, and a function key the runtime binds.
const FUNCTIONAL = {};
(function(){
  const D = (id, group, w, d, h, color, cost, fn, extra={}) => {
    FUNCTIONAL[id] = { id, group, w, d, h, color, cost, fn, ...extra };
    defPiece(id, w, d, h, 'functional', { cat:'functional', fnGroup: group, color, fn, value: 4 });
  };
  // Home
  D('fn_bed','home',2,4,3,'blue',60,'rest'); D('fn_chest','home',2,2,3,'brown',30,'storage');
  D('fn_wardrobe','home',2,2,9,'dark_brown',50,'wardrobe'); D('fn_kitchen','home',2,4,3,'white',70,'cook');

  // Vehicles
  D('fn_chassis','vehicle',4,8,1,'dark_grey',40,'chassis',{mass:3}); D('fn_axle','vehicle',6,2,4,'black',25,'axle',{mass:2});
  D('fn_engine','vehicle',2,2,3,'silver',60,'engine',{mass:3,power:10}); D('fn_seat','vehicle',2,2,3,'black',15,'steer');
  D('fn_booster','vehicle',2,2,3,'orange',70,'booster',{mass:1,power:8}); D('fn_headlight','vehicle',1,1,1,'trans_clear',8,'headlight');
  D('fn_horn','vehicle',1,1,1,'yellow',8,'horn'); D('fn_ram','vehicle',4,1,3,'silver',30,'ram',{mass:2}); D('fn_cargo','vehicle',4,4,3,'tan',30,'cargo',{mass:2});
  // Ships
  D('fn_keel','ship',4,12,3,'brown',80,'keel',{mass:6}); D('fn_mast','ship',1,1,36,'dark_brown',50,'mast',{mass:1,sail:12});
  D('fn_rudder','ship',1,2,6,'dark_brown',30,'rudder'); D('fn_cannon','ship',2,3,3,'black',60,'cannon',{mass:2});
  D('fn_anchor','ship',2,1,4,'dark_grey',20,'anchor'); D('fn_helm','ship',2,1,6,'brown',30,'helm');
  D('fn_crowsnest','ship',2,2,3,'dark_brown',25,'crowsnest'); D('fn_oars','ship',6,1,1,'tan',20,'oars',{sail:3});
  // Starships

  if(typeof m.version!=='number') errs.push(`${id}: missing numeric version`);
  const occ=new Map();
  m.bricks.forEach((b,i)=>{

    const [pid,x,y,z,r,col,pr]=b;

    if(!(col in PALETTE)) errs.push(`${id}#${i}: unknown colour ${col}`);
    if(pr && !PRINTS.has(pr) && !(extraPrints&&extraPrints.has(pr))) errs.push(`${id}#${i}: unknown print ${pr}`);
    if(![x,y,z].every(Number.isInteger)) errs.push(`${id}#${i}: non-integer position`);
    if(![0,1,2,3].includes(r)) errs.push(`${id}#${i}: bad rotation ${r}`);
    const fit=PIECES[pid].fitsInto; for(const c of cellsOf(b)){ if(occ.has(c)){ const j=occ.get(c); const o=m.bricks[j][0]; if(fit===o || PIECES[o]?.fitsInto===pid) continue; errs.push(`${id}#${i}: overlaps brick #${j} at ${c}`); break; } occ.set(c,i); }

}

// LZW over UTF-8 bytes, codes packed as varints, then base64url. Synchronous, used by saves and share codes.
function lzwCompress(str){
  const bytes = new TextEncoder().encode(str); const dict=new Map(); for(let i=0;i<256;i++) dict.set(String.fromCharCode(i),i);
  let next=256, w='', out=[];
  for(const b of bytes){ const c=String.fromCharCode(b); const wc=w+c; if(dict.has(wc)) w=wc; else { out.push(dict.get(w)); if(next<1<<20) dict.set(wc,next++); w=c; } }
  if(w) out.push(dict.get(w));
  const buf=[]; for(let v of out){ while(v>=128){ buf.push((v&127)|128); v>>>=7; } buf.push(v); }
  let bin=''; for(let i=0;i<buf.length;i++) bin+=String.fromCharCode(buf[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function lzwDecompress(b64){
  const s=b64.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(s+'==='.slice((s.length+3)%4));
  const codes=[]; let v=0, sh=0; for(let i=0;i<bin.length;i++){ const c=bin.charCodeAt(i); v|=(c&127)<<sh; if(c&128) sh+=7; else { codes.push(v>>>0); v=0; sh=0; } }
  const dict=[]; for(let i=0;i<256;i++) dict.push([i]);
  if(!codes.length) return '';
  let w=dict[codes[0]]; if(!w) throw new Error('bad code'); const out=[...w];
  for(let i=1;i<codes.length;i++){ const k=codes[i]; let entry;
    if(k<dict.length) entry=dict[k]; else if(k===dict.length) entry=[...w,w[0]]; else throw new Error('bad code');
    for(const x of entry) out.push(x); if(dict.length<1<<20) dict.push([...w,entry[0]]); w=entry; }
  return new TextDecoder().decode(new Uint8Array(out));
}

// Procedural brick models. Every model the game needs has a generator here, so empty models/ still plays.
function fillRun(out, axis, x0, y, z0, len, color, rng, mask, printEvery){
  // greedy 4/2/1 bricks along an axis ('x' or 'z'), skipping masked cells
  let i=0;
  while(i<len){
    if(mask && mask(i)){ i++; continue; }
    let n=1; for(const s of [4,3,2]){ let ok=i+s<=len; for(let k=0;ok&&k<s;k++) if(mask&&mask(i+k)) ok=false; if(ok){ n=s; break; } }
    const pid = `brick_1x${n}`;
    if(axis==='x') out.push([pid, x0+i, y, z0, n>1?1:0, color]); else out.push([pid, x0, y, z0+i, 0, color]);
    i+=n;
  }
}

  else if(realm==='apex'){ const m=genBuilding('apex','skyscraper',77); m.meta.w=14; for(const x of m.bricks) b.push(x); b.push(['cone_2x2',6,400,6,0,'gold']); }
  else if(realm==='kingsreach'){ for(let x=0;x<24;x++) for(let z=0;z<24;z++){ if(x===0||z===0||x===23||z===23){ for(let y=0;y<8;y++) if(!(z===0&&x>=10&&x<14&&y<4)) b.push(['brick_1x1',x,y*3,z,0,'light_grey']); if((x+z)%2===0) b.push(['brick_1x1',x,24,z,0,'light_grey']); } }
    for(const [cx,cz] of [[0,0],[20,0],[0,20],[20,20],[9,9]]){ for(let y=0;y<(cx===9?16:11);y++) for(let i=0;i<4;i++) for(let k=0;k<4;k++) if(i===0||k===0||i===3||k===3) b.push(['brick_1x1',cx+i,y*3,cz+k,0,cx===9?'olive':'light_grey']); b.push(['cone_2x2',cx+1,(cx===9?16:11)*3,cz+1,0,'dark_blue']); } }
  else if(realm==='isles'){ for(let x=0;x<20;x++) for(let y=0;y<4;y++){ b.push(['brick_1x1',x,y*3,0,0,'brown']); b.push(['brick_1x1',x,y*3,6,0,'brown']); } for(let z=1;z<6;z++) for(let y=0;y<3;y++){ b.push(['brick_1x1',0,y*3,z,0,'brown']); b.push(['brick_1x1',19,y*3,z,0,'brown']); } for(let y=0;y<12;y++) b.push(['round_1x1',9,y*3,3,0,'dark_brown']); b.push(['gem_1x1',10,0,3,0,'gold']); b.push(['gem_1x1',8,0,3,0,'gold']); }
  else if(realm==='wildwood'){ for(let y=0;y<30;y++) for(let i=0;i<6;i++) for(let k=0;k<6;k++) if(i===0||k===0||i===5||k===5) b.push(['brick_1x1',i+9,y*3,k+9,0,'brown']); for(let ly=0;ly<4;ly++){ const s=12-ly*2; for(let x=-s;x<=s;x+=2) for(let z=-s;z<=s;z+=2) if(x*x+z*z<=s*s) b.push(['brick_2x2',11+x,90+ly*3,11+z,0,ly%2?'green':'dark_green']); } }
  else if(realm==='mistpeak'){ const m=genBuilding('mistpeak','tower',9); for(const x of m.bricks) b.push(x); }
  else if(realm==='ember'){ for(let ly=0;ly<14;ly++){ const s=14-ly; for(let a=0;a<36;a++){ const x=Math.round(14+Math.cos(a/36*Math.PI*2)*s), z=Math.round(14+Math.sin(a/36*Math.PI*2)*s); b.push(['brick_1x1',x,ly*3,z,0,ly>10?'dark_grey':'olive']); } } for(let x=10;x<19;x++) for(let z=10;z<19;z++) if((x-14)**2+(z-14)**2<16) b.push(['plate_1x1',x,40,z,0,'trans_orange']); }
  else if(realm==='frontier'){ for(let a=0;a<48;a++){ const x=Math.round(12+Math.cos(a/48*Math.PI*2)*11), z=Math.round(12+Math.sin(a/48*Math.PI*2)*11); for(let y=0;y<4;y++) b.push(['brick_1x1',x,y*3,z,0,'white']); } b.push(['dome_4x4',10,12,10,0,'trans_blue']); for(let y=0;y<10;y++) b.push(['round_2x2',30,y*3,12,0,y>7?'red':'white']); b.push(['cone_2x2',30,30,12,0,'red']); }
  return { id:`landmark_${realm}`, version:1, bricks:dedupe(b), groups:{}, empties:{}, meta:{ tags:['landmark',realm], destructible:true, function:'landmark' } };
}
function genTemple(realm){ // Lumen Order temples are built into nature
  const b=[]; const r=rngFor('temple',realm);
  const stone = realm==='frontier'?'dark_grey':realm==='wildwood'?'brown':realm==='brightharbour'?'white':'sand_green';
  for(let a=0;a<28;a++){ const x=Math.round(8+Math.cos(a/28*Math.PI*2)*7), z=Math.round(8+Math.sin(a/28*Math.PI*2)*7); const h = a<3||a>25?0:4+Math.floor(r()*2); for(let y=0;y<h;y++) b.push(['brick_1x1',x,y*3,z,0,stone]); }
  b.push(['fn_shrine',7,0,7,0,'trans_clear']); b.push(['dome_4x4',6,15,6,0,'sand_green']);
  if(realm==='mistpeak') for(let y=0;y<8;y++) for(let x=4;x<12;x+=2) b.push(['plate_2x2',x,y*3+30,16,0,'trans_blue']);
  return { id:`temple_${realm}`, version:1, bricks:dedupe(b), groups:{}, empties:{ shrine:[8,0,8,0] }, meta:{ tags:['temple',realm], destructible:false, function:'temple' } };
}

// §WORLDMAP -------------------------------------------------------------------
// Deterministic continent: seven wedges around a central sea, joined by a ring road; Frontier zones off-map.
function realmAt(x,z){
  if(!(x===x && z===z)) return 'brightharbour';
  if(x > SPACE_ORIGIN.x - 3000) return 'frontier';
  const a = Math.atan2(z,x); const wedge = 2*Math.PI/7;
  let rel = a - REALMS.brightharbour.angle; rel = ((rel % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const idx = Math.floor((rel + wedge/2) / wedge) % 7;
  return REALM_IDS[idx];
}
function realmBlend(x,z){ // 0 at a border, 1 deep in a realm
  const a=Math.atan2(z,x), wedge=2*Math.PI/7; let rel=a-REALMS.brightharbour.angle; rel=((rel%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const f=((rel+wedge/2)/wedge)%1; const dEdge=Math.min(f,1-f)*wedge*Math.hypot(x,z); return clamp(dEdge/60,0,1);
}
function buildWorldMap(seed){
  const map = { seed, towns:[], sites:[], roads:[], rivers:[], waystones:[], plots:[], temples:[], landmarks:[], spaceZones:[] };
  const R = rngFor(seed,'map');
  for(const id of REALM_IDS){
    const realm=REALMS[id]; const wedge=2*Math.PI/7;
    const n = realm.towns.length;
    realm.towns.forEach((name,i)=>{
      const t = n===1?0:(i/(n-1)-.5); const a = realm.angle + t*wedge*0.62 + (R()-.5)*0.05;
      let rad = id==='apex' ? 1900+i*420 : (1650 + ((i*977+id.length*131)%5)*430);
      if(id==='brightharbour' && i===0) rad = 1500;
      if(id==='isles') rad = 1550 + i*520;
      const x=Math.round(Math.cos(a)*rad), z=Math.round(Math.sin(a)*rad);
      const town = { id:`${id}_t${i}`, name, realm:id, x, z, radius: id==='apex'?150: i===0?110:80, capital:i===0, h:0 };
      map.towns.push(town);
      map.sites.push({ id:town.id, name, realm:id, kind: id==='isles'?'island':'town', x, z, owner:null, defense:20+(i===0?20:0), pop:100 });
      map.waystones.push({ id:`ws_${town.id}`, town:town.id, x:x+12, z:z+12 });
      map.plots.push({ id:`plot_${town.id}`, town:town.id, realm:id, x:x-40, z:z+30, w:24, d:24, price: 400 + i*100 + (id==='apex'?600:0), kind: ['cottage lot','hillside','island','treehouse branch','mountain ledge','moon crater'][({brightharbour:0,apex:0,kingsreach:1,isles:2,wildwood:3,mistpeak:4,ember:1})[id]] });
    });
    // extra sites: forts, passes, mines, outposts
    const extras = { brightharbour:['Harbour Fort','Smugglers Cove'], apex:['Novagen Campus','Docklands','Power Station'], kingsreach:['Black Tower','Greenhood Camp','Border Fort'],
      isles:['Skull Shoal','Navy Bastion','Reef Spire'], wildwood:['Pack Den','Thornwall','Old Ruins'], mistpeak:['High Pass','Bandit Ridge','Jade Dojo'],
      ember:['Cinderdrill Mine','Raider Camp','Glass Ruins'] }[id];
    extras.forEach((name,i)=>{ const a = realm.angle + ((i+.5)/extras.length-.5)*wedge*0.7; const rad = 2700 + (i%2)*500 + R()*200;
      map.sites.push({ id:`${id}_x${i}`, name, realm:id, kind: name.match(/Tower|Fort|Bastion/)?'fort': name.match(/Mine|Station|Campus/)?'industry':'camp', x:Math.round(Math.cos(a)*rad), z:Math.round(Math.sin(a)*rad), owner:null, defense:30, pop:30 }); });
    // landmark + temple
    const la = realm.angle + 0.08, lr = id==='apex'?2100: id==='isles'? 1350 : 2300;
    map.landmarks.push({ realm:id, name:realm.landmark, x:Math.round(Math.cos(la)*lr), z:Math.round(Math.sin(la)*lr) });
    const ta = realm.angle - 0.12, tr = 2500;
    map.temples.push({ realm:id, x:Math.round(Math.cos(ta)*tr), z:Math.round(Math.sin(ta)*tr) });
    // river from the mountains to the sea
    const ra = realm.angle + wedge*0.28; const pts=[]; for(let k=0;k<=12;k++){ const rr = 3900 - k*(3900-CONFIG.seaRadius+80)/12; const aa = ra + Math.sin(k*0.9 + id.length)*0.05; pts.push([Math.cos(aa)*rr, Math.sin(aa)*rr]); }
    if(id!=='apex') map.rivers.push({ realm:id, pts });
  }
  // roads: within realm chain towns; ring road joins every capital
  const caps = REALM_IDS.map(id=>map.towns.find(t=>t.realm===id && t.capital));
  for(let i=0;i<caps.length;i++){ const a=caps[i], b=caps[(i+1)%caps.length]; if(a.realm==='isles'||b.realm==='isles') continue; map.roads.push([a.x,a.z,b.x,b.z]); }
  for(const id of REALM_IDS){ if(id==='isles') continue; const ts=map.towns.filter(t=>t.realm===id); for(let i=1;i<ts.length;i++) map.roads.push([ts[i-1].x,ts[i-1].z,ts[i].x,ts[i].z]); }
  // frontier zones
  SPACE_ZONES.forEach((z,i)=>{ const zone={ id:z, name:REALMS.frontier.towns[i], x:SPACE_ORIGIN.x + i*1200, z:0, radius: z==='station'?160:z==='belt'?260:300, gravity: z==='moon'?1/3: z==='station'?0.5: z==='belt'?0.4: 0.8, alien: i>=3 };
    map.spaceZones.push(zone); map.sites.push({ id:`frontier_${z}`, name:zone.name, realm:'frontier', kind: i<3?'colony':'world', x:zone.x, z:zone.z, owner:null, defense:25, pop:40 }); });
  map.waystones.push({ id:'ws_station', town:'frontier_station', x:SPACE_ORIGIN.x+30, z:30 });
  map.launchPad = { x: Math.round(Math.cos(REALMS.brightharbour.angle+0.18)*1700), z: Math.round(Math.sin(REALMS.brightharbour.angle+0.18)*1700) };
  map.ferries = [ ['brightharbour_t0','isles_t0'], ['isles_t1','kingsreach_t0'], ['ember_t0','brightharbour_t1'] ];
  map.train = ['brightharbour_t0','apex_t0','kingsreach_t0'];
  map.airships = ['brightharbour_t0','mistpeak_t0','wildwood_t0','ember_t0'];
  return map;
}

// Terrain height (in plates) and surface colour per 2x2-stud column, deterministic from seed.
function distToSeg(px,pz,ax,az,bx,bz){ const dx=bx-ax, dz=bz-az; const l2=dx*dx+dz*dz||1; let t=((px-ax)*dx+(pz-az)*dz)/l2; t=clamp(t,0,1); return Math.hypot(px-(ax+t*dx), pz-(az+t*dz)); }
function makeTerrain(map){
  const seed=map.seed; const cache=new Map();
  const townGrid = map.towns; const roads=map.roads; const rivers=map.rivers;
  function raw(x,z){
    const realm = realmAt(x,z);
    if(realm==='frontier'){
      const zone = map.spaceZones.find(s=>Math.abs(s.x-x)<s.radius+40 && Math.abs(z)<s.radius+40);
      if(!zone) return { h:-999, realm, col:'black', water:false };
      const d=Math.hypot(x-zone.x,z-zone.z); if(d>zone.radius) return { h:-999, realm, col:'black', water:false, zone:zone.id };
      if(zone.id==='station') return { h:8, realm, col: ((Math.floor(x/4)+Math.floor(z/4))&1)?'light_grey':'white', zone:zone.id };
      const n=fbm(seed+77+zone.x,x/90,z/90); let h=6+Math.floor(n*(zone.id==='belt'?30:16));
      if(zone.id==='belt' && fbm(seed+5,x/40,z/40)<.45) return { h:-999, realm, col:'black', zone:zone.id };
      const col = zone.id==='moon'?(n>.55?'light_grey':'white'): zone.id==='verdant'?(n>.6?'trans_green':'lime'): zone.id==='crystal'?(n>.62?'trans_blue':'lavender'): zone.id==='ironwind'?(n>.5?'dark_red':'brown'):'dark_grey';
      return { h, realm, col, zone:zone.id };
    }
    const R=REALMS[realm]; const rad=Math.hypot(x,z);
    let h; let col=R.ground;
    const hp=R.height; const n=fbm(seed+hashStr(realm)%1000, x*hp.freq, z*hp.freq);
    h = hp.base + n*hp.amp;
    if(realm==='mistpeak'){ const ridge = 1-Math.abs(noise2(seed+9,x/300,z/300)*2-1); h = hp.base + Math.pow(ridge,2)*hp.amp + n*12; }
    if(realm==='ember'){ const v=map.landmarks.find(l=>l.realm==='ember'); const dv=Math.hypot(x-v.x,z-v.z); if(dv<220) h+= (220-dv)*0.35; }
    if(realm==='isles'){ const isl=fbm(seed+33,x/140,z/140); h = isl>.52 ? 7+ (isl-.52)*90 : 2+isl*3; }
    // blend heights across realm borders so terrain never cliffs at a border
    const b = realmBlend(x,z); if(b<1) h = lerp(12, h, b);
    // coast: sea in the middle and beyond the rim
    const coast = rad < CONFIG.seaRadius ? (CONFIG.seaRadius-rad) : rad > CONFIG.worldRadius ? (rad-CONFIG.worldRadius) : 0;
    if(coast>0){ h = h - coast*0.12; }
    // rivers
    for(const rv of rivers){ if(rv.realm!==realm) continue; for(let i=1;i<rv.pts.length;i++){ const d=distToSeg(x,z,rv.pts[i-1][0],rv.pts[i-1][1],rv.pts[i][0],rv.pts[i][1]); if(d<14){ h=Math.min(h, CONFIG.seaLevel-2 + d*0.15); } } }
    // towns flatten
    for(const t of townGrid){ const d=Math.hypot(x-t.x,z-t.z); if(d<t.radius+60){ const th = realm==='isles'?9:Math.max(9, Math.round(hp.base+fbm(seed+hashStr(realm)%1000,t.x*hp.freq,t.z*hp.freq)*hp.amp*0.5)); const k=clamp((d-t.radius)/60,0,1); h = lerp(th, h, smooth(k)); if(d<t.radius) col = realm==='apex'?(((Math.floor(x/8)+Math.floor(z/8))&1)?'dark_grey':'light_grey'): realm==='kingsreach'?'green': R.ground; } }
    // roads
    let onRoad=false; for(const r of roads){ const d=distToSeg(x,z,r[0],r[1],r[2],r[3]); if(d<5){ onRoad=true; break; } }
    h = Math.round(h);
    if(onRoad && h>CONFIG.seaLevel){ col = realm==='apex'?'black':'olive'; }
    else if(h<=CONFIG.seaLevel+1) col = R.sand;
    if(realm==='mistpeak' && h>60) col='white';
    if(realm==='kingsreach' && h>34) col='light_grey';
    if(realm==='ember' && h>34) col='dark_grey';
    if(realm==='ember' && !onRoad && fbm(seed+81,x/50,z/50)>.74 && h>CONFIG.seaLevel+2) { col='trans_orange'; }
    return { h, realm, col, water: h<CONFIG.seaLevel, road:onRoad };
  }
  return {
    // column API (2x2 studs): returns cached record
    col(cx,cz){ const k=cx*100003+cz; let v=cache.get(k); if(!v){ v=raw(cx*2+1,cz*2+1); if(cache.size>400000) cache.clear(); cache.set(k,v); } return v; },
    height(x,z){ return this.col(Math.floor(x/2),Math.floor(z/2)).h; },
    realm: realmAt,
    raw,
  };
}

function initFactions(world){
  const F={};
  for(const [id,name,realm,kind,lawful,enemies,color] of FACTION_DEFS){
    F[id] = { id, name, realm, kind, lawful, color, strength: 50 + (kind==='military'?30:0) + (kind==='trade'?-10:0), wealth: 60 + (kind==='trade'?60:0),
      sites:[], rel:{}, enemies:[...enemies], alive:true, standing:0, weariness:0, player:false };
  }
  for(const a in F) for(const b in F){ if(a===b) continue; F[a].rel[b] = F[a].enemies.includes(b)||F[b].enemies.includes(a) ? -60 : (F[a].realm===F[b].realm ? 10 : 0); }
  // assign site ownership
  const own = (siteId, fid) => { const s=world.map.sites.find(x=>x.id===siteId); if(s){ s.owner=fid; } };
  for(const s of world.map.sites){
    const realmF = Object.values(F).filter(f=>f.realm===s.realm);
    let owner;
    if(s.kind==='town'||s.kind==='island'||s.kind==='colony') owner = realmF.find(f=>f.kind==='military') || realmF.find(f=>f.lawful) || realmF[0];
    else if(s.name.match(/Black Tower/)) owner=F.blacktower; else if(s.name.match(/Greenhood/)) owner=F.greenhood; else if(s.name.match(/Skull/)) owner=F.freecaptains;
    else if(s.name.match(/Navy/)) owner=F.navy; else if(s.name.match(/Reef/)) owner=F.reefwardens; else if(s.name.match(/Pack/)) owner=F.pack; else if(s.name.match(/Thorn/)) owner=F.hollowroot;
    else if(s.name.match(/Bandit/)) owner=F.bandits; else if(s.name.match(/Dojo/)) owner=F.jadeblades; else if(s.name.match(/Cinderdrill/)) owner=F.cinderdrill; else if(s.name.match(/Raider/)) owner=F.ashraiders;
    else if(s.name.match(/Novagen/)) owner=F.novagen; else if(s.name.match(/Smugglers/)) owner=F.raccoons; else if(s.name.match(/Docklands/)) owner=F.syndicate;
    else owner = realmF.find(f=>!f.lawful) || realmF[0];
    if(s.realm==='isles' && s.id==='isles_t2') owner=F.freecaptains;
    if(s.realm==='frontier' && s.kind==='world') owner = s.id.endsWith('ironwind') ? F.marauders : F.prospectors;
    s.owner = owner ? owner.id : null;
  }
  for(const s of world.map.sites) if(s.owner) F[s.owner].sites.push(s.id);
  return F;
}
function siteById(world,id){ return world.map.sites.find(s=>s.id===id); }
function transferSite(world, site, to, why){
  const from = site.owner; if(from===to) return;
  if(from && world.factions[from]) world.factions[from].sites = world.factions[from].sites.filter(x=>x!==site.id);
  site.owner = to; if(to && world.factions[to]) world.factions[to].sites.push(site.id);
  site.damage = Math.min(1,(site.damage||0)+0.3);
  news(world, `${site.name} falls to ${world.factions[to]?.name||'nobody'}${why?` (${why})`:''}.`, site.realm, 'territory');
  Bus.emit('territory', { site:site.id, from, to });
}
function news(world, text, realm='*', kind='news'){
  const item = { day: Math.floor(world.day*100)/100, text, realm, kind }; world.news.push(item); if(world.news.length>80) world.news.shift();
  if(kind!=='news' || world.timelineAll) world.timeline.push(item); if(world.timeline.length>400) world.timeline.splice(0, world.timeline.length-400);
  Bus.emit('news', item);
}
function resolveBattle(world, attId, defId, site, opts={}){
  const A=world.factions[attId], D=world.factions[defId]; const r=rngFor(world.seed,'battle',world.tick,attId,site.id);
  const playerBonus = opts.playerSide===attId ? opts.playerPower||0 : opts.playerSide===defId ? -(opts.playerPower||0) : 0;
  const atk = A.strength*(0.7+r()*0.6) + playerBonus; const def = (D?D.strength:10)*(0.6+r()*0.5) + site.defense*0.8;
  const win = atk > def;
  A.strength = Math.max(5, A.strength - (win?6:12) - r()*4); if(D) D.strength = Math.max(5, D.strength - (win?12:5) - r()*4);
  world.stats.battles++;
  return { win, atk, def };
}
function factionTick(world){
  const F=world.factions; const ids=Object.keys(F).sort();
  for(const id of ids){ const f=F[id]; if(!f.alive || f.player) continue;
    const r=rngFor(world.seed,'ftick',world.tick,id);
    const warMul = (world.wars||[]).some(w=>!w.ended && (w.a===id||w.b===id)) ? 0.5 : 1;
    const routes = world.tradeClosed?.[f.realm] ? 0.4 : 1;
    f.wealth += (f.kind==='trade'?3:1.2) * routes + f.sites.length*0.35;
    // utilities
    const opts=[];
    if(f.wealth>15) opts.push(['recruit', (100-f.strength)/40 + r()*.5]);
    opts.push(['trade', (f.kind==='trade'?1.2:0.4) + r()*.4]);
    const enemies = f.enemies.filter(e=>F[e]&&F[e].alive);
    if(enemies.length && f.kind!=='trade' && f.kind!=='order'){
      opts.push(['raid', (f.lawful?0.3:0.9)*warMul + r()*.5]);
    }
    const weakSite = f.sites.map(s=>siteById(world,s)).filter(Boolean).sort((a,b)=>a.defense-b.defense)[0];
    if(weakSite) opts.push(['defend', (40-weakSite.defense)/40 + r()*.3]);
    opts.sort((a,b)=>b[1]-a[1]);
    const act = opts[0][0];
    if(act==='recruit'){ const spend=Math.min(f.wealth*0.4, 30); f.wealth-=spend; f.strength=Math.min(160, f.strength+spend*0.35); }
    else if(act==='trade'){ f.wealth += 4*routes; }
    else if(act==='defend' && weakSite){ weakSite.defense=Math.min(80, weakSite.defense+3); f.wealth-=2; weakSite.damage=Math.max(0,(weakSite.damage||0)-0.1); }
    else if(act==='raid'){ const e=F[pick(r,enemies)]; const loot=Math.min(e.wealth*0.15, 12); e.wealth-=loot; f.wealth+=loot; f.rel[e.id]=Math.max(-100,(f.rel[e.id]||0)-3); e.rel[id]=Math.max(-100,(e.rel[id]||0)-4);
      world.metrics.raids++; if(r()<0.08) news(world, `${f.name} raided ${e.name}.`, f.realm, 'raid');
      // outlaws can snatch a lightly held site outright
      const tgt = e.sites.map(s=>siteById(world,s)).filter(s=>s && s.kind!=='town' && s.realm===f.realm)[0];
      if(tgt && !f.lawful && r()<0.05){ const res=resolveBattle(world,id,e.id,tgt); if(res.win) transferSite(world,tgt,id,'a raid'); }
    }
    f.weariness = Math.max(0, f.weariness - 0.02);
    // relations drift back toward baseline slowly
    for(const o in f.rel){ const base = f.enemies.includes(o)?-60:0; f.rel[o] += (base - f.rel[o])*0.004; }
  }
}

function addCareerXp(world, cid, xp){

function joinCareer(world, cid, opts={}){
  const p=world.player; const c=CAREERS[cid];
  if(p.careers[cid]?.active) return { ok:false, why:'Already a member.' };
  if(p.careers[cid]?.hostile) return { ok:false, why:`${c.name} won't have you back.` };
  if(c.join.req?.standing) for(const [f,v] of Object.entries(c.join.req.standing)) if((world.factions[f]?.standing||0)<v && !opts.force) return { ok:false, why:`Needs standing ${v} with ${world.factions[f].name}.` };
  if(c.join.how==='prove' && (p.stats.crimesStopped||0) < c.join.crimes && !opts.force) return { ok:false, why:`Stop ${c.join.crimes} street crimes in Apex City first.` };
  p.careers[cid] = { active:true, rank:0, xp:0, joined:world.day, secret: !!c.hidden || !!opts.secret, suspicion:0 };
  for(const a of (c.abilities[0]||[])) if(!p.abilities.includes(a)) p.abilities.push(a);

function generateJobs(world){
  const boards={}; const F=world.factions; const p=world.player;
  for(const site of world.map.sites){ if(site.kind!=='town' && site.kind!=='island' && site.kind!=='colony') continue;
    const r=rngFor(world.seed,'board',site.id,Math.floor(world.day)); const list=[]; const owner=F[site.owner];
    // faction needs
    if(owner){
      const lost = world.lostSites.filter(l=>l.faction===owner.id && siteById(world,l.site).owner!==owner.id);
      for(const l of lost.slice(0,2)) list.push(makeJob(world,'capture',siteById(world,l.site),owner.id,{target:siteById(world,l.site).owner, effect:{flip:l.site, to:owner.id}}));
      const ens = owner.enemies.filter(e=>F[e]?.alive);
      if(ens.length){ const e=F[pick(r,ens)]; const es=e.sites.map(s=>siteById(world,s)).filter(s=>s&&s.realm===site.realm);
        if(es.length) list.push(makeJob(world,'raid',pick(r,es),owner.id,{target:e.id, effect:{weaken:e.id, amount:8}})); }
      if(world.wars.some(w=>!w.ended && (w.a===owner.id||w.b===owner.id))){ const w=world.wars.find(w=>!w.ended && (w.a===owner.id||w.b===owner.id));
        const front=siteById(world,w.fronts[0]); if(front) list.push(makeJob(world,'enlist',front,owner.id,{war:w.id, target: w.a===owner.id?w.b:w.a, effect:{warScore:w.id, side:owner.id}})); }
      if((site.damage||0)>0.3) list.push(makeJob(world,'fortify',site,owner.id,{effect:{repair:site.id}}));
    }
    // townsfolk personal requests — always present so a board never empties
    list.push(makeJob(world, pick(r,['deliver','find','chase','goat','gather','rescue']), site, 'townsfolk'));
    list.push(makeJob(world, pick(r,['deliver','gather','cook','trade','map']), site, 'townsfolk'));
    if(site.realm==='apex'){ const v=world.villains.find(v=>v.active); list.push(makeJob(world, v?'scheme':'heist', site, 'paragon', {target:v?.id||'syndicate', effect: v?{villain:v.id}:{crime:1}})); }
    if(site.realm==='brightharbour') list.push(makeJob(world,'commission',site,'traders',{effect:{commission:true}}));
    // threats post jobs where they press
    for(const t of world.threats.filter(t=>!t.resolved)){ if(t.realm===site.realm || t.realm==='*'){ list.push(makeJob(world, t.stage<=1?'pressure':'threat', site, owner?.id||'townsfolk', {threat:t.id, effect:{threat:t.id}})); } }
    // career jobs
    for(const cid of CAREER_IDS){ const cs=p.careers[cid]; if(!cs?.active) continue; const c=CAREERS[cid]; if(c.realm && c.realm!==site.realm && r()<0.6) continue;
      const jt=pick(r,CAREER_JOBS[cid]||['patrol']); list.push(makeJob(world,jt,site,c.faction||'townsfolk',{career:cid}));
      if(cs.rank>=c.ranks.length-1 && r()<0.5) list.push(makeJob(world,'legendary',site,c.faction||'townsfolk',{career:cid, legendary:true, pay:500})); }
    // peace brokering
    for(const w of world.wars.filter(w=>!w.ended && w.weary)) if(siteById(world,w.fronts[0])?.realm===site.realm) list.push(makeJob(world,'broker',site,'lumen',{war:w.id, effect:{peace:w.id}}));
    boards[site.id]=list;
  }
  world.boards=boards; return boards;
}
function completeJob(world, job, opts={}){
  const p=world.player; const F=world.factions; const ok = opts.success!==false;
  if(!ok){ if(F[job.client]) F[job.client].standing-=2; return false; }
  p.pips += job.pay; p.stats.jobs++; world.stats.jobsDone++;
  if(F[job.client]){ F[job.client].standing+=4; if(job.target && F[job.target]) F[job.target].standing-=3; }
  p.fame[job.realm]=(p.fame[job.realm]||0)+1;
  if(job.career) addCareerXp(world, job.career, job.xp); else for(const cid of CAREER_IDS){ const cs=p.careers[cid]; if(cs?.active && CAREERS[cid].faction===job.client) addCareerXp(world,cid,Math.round(job.xp*0.6)); }
  const e=job.effect||{};
  if(e.flip){ const s=siteById(world,e.flip); if(s && s.owner!==e.to){ transferSite(world,s,e.to,`with help from ${p.name}`); } }
  if(e.weaken && F[e.weaken]) F[e.weaken].strength=Math.max(5,F[e.weaken].strength-e.amount);
  if(e.repair){ const s=siteById(world,e.repair); if(s) s.damage=0; }
  if(e.villain) defeatVillain(world, e.villain);
  if(e.crime){ p.stats.crimesStopped=(p.stats.crimesStopped||0)+1; p.heroRep+=1; }
  if(e.warScore){ const w=world.wars.find(x=>x.id===e.warScore); if(w){ w.score += (w.a===e.side?1:-1)*0.12; w.playerFought=true; } }
  if(e.peace){ const w=world.wars.find(x=>x.id===e.peace); if(w && !w.ended) endWar(world,w,'treaty', p.name); }
  if(e.threat){ const t=world.threats.find(x=>x.id===e.threat); if(t && !t.resolved) threatHit(world,t, job.type==='pressure'?0.07:0.05, true); }
  if(job.legendary) grantTitle(world, `Legend of ${CAREERS[job.career]?.name||'the Realms'}`);
  Bus.emit('job.done',{job}); world.jobLog.push({day:Math.floor(world.day), title:job.title}); if(world.jobLog.length>50) world.jobLog.shift();
  for(const b of Object.values(world.boards||{})){ const i=b.indexOf(job); if(i>=0) b.splice(i,1); }
  return true;
}

function brickCells(b){ const p=PIECES[b[0]]; const [w,d]=pieceDims(p,b[4]||0); return {x0:b[1],x1:b[1]+w,z0:b[3],z1:b[3]+d,y0:b[2],y1:b[2]+p.h}; }
function stabilityCheck(bricks, groundTop){ // returns indices not connected (via stud contact) to the ground
  const n=bricks.length; const boxes=bricks.map(brickCells); const top=new Map(), bot=new Map();
  const key=(x,y,z)=>x+','+y+','+z;
  boxes.forEach((b,i)=>{ for(let x=b.x0;x<b.x1;x++) for(let z=b.z0;z<b.z1;z++){ top.set(key(x,b.y1,z),i); bot.set(key(x,b.y0,z),i); } });
  const adj=Array.from({length:n},()=>new Set()); const grounded=new Array(n).fill(false);
  boxes.forEach((b,i)=>{ for(let x=b.x0;x<b.x1;x++) for(let z=b.z0;z<b.z1;z++){ const below=top.get(key(x,b.y0,z)); if(below!==undefined){ adj[i].add(below); adj[below].add(i); } const above=bot.get(key(x,b.y1,z)); if(above!==undefined){ adj[i].add(above); adj[above].add(i); }
    if(b.y0 <= groundTop(x,z)) grounded[i]=true; } });
  const seen=new Array(n).fill(false); const q=[]; for(let i=0;i<n;i++) if(grounded[i]){ seen[i]=true; q.push(i); }
  while(q.length){ const i=q.pop(); for(const j of adj[i]) if(!seen[j]){ seen[j]=true; q.push(j); } }
  const out=[]; for(let i=0;i<n;i++) if(!seen[i]) out.push(i); return out;
}
function blueprintStats(bricks){
  let mass=0, cells=0, wheels=0, power=0, sail=0, cannons=0, thrust=0, thrustX=0, shields=0, fuel=0, blasters=0, comY=0, minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9, maxY=0, seats=0, hyper=0;
  for(const b of bricks){ const p=PIECES[b[0]]; if(!p) continue; const c=brickCells(b); const vol=(c.x1-c.x0)*(c.z1-c.z0)*p.h; const fn=FUNCTIONAL[b[0]];
    const m = fn?.mass ?? vol*0.02; mass+=m; comY += m*(c.y0+p.h/2); cells+=vol;
    minX=Math.min(minX,c.x0); maxX=Math.max(maxX,c.x1); minZ=Math.min(minZ,c.z0); maxZ=Math.max(maxZ,c.z1); maxY=Math.max(maxY,c.y1);
    if(b[0]==='fn_axle') wheels+=2; if(b[0]==='wheel_2x2'||b[0]==='tyre_2x2') wheels+=1;
    if(b[0]==='fn_engine') power+=fn.power; if(b[0]==='fn_booster') power+=fn.power;
    if(b[0]==='fn_mast'||b[0]==='fn_oars') sail+=fn.sail; if(b[0]==='fn_cannon') cannons++;
    if(b[0]==='fn_thruster'){ thrust+=fn.power; thrustX += ((c.x0+c.x1)/2); }
    if(b[0]==='fn_shield') shields++; if(b[0]==='fn_fuel') fuel++; if(b[0]==='fn_blaster') blasters++; if(b[0]==='fn_seat'||b[0]==='fn_cockpit'||b[0]==='fn_helm'||b[0]==='seat_2x2') seats++; if(b[0]==='fn_hypercore') hyper++;
  }
  if(!bricks.length) return null;
  const width=Math.max(1,maxX-minX), length=Math.max(1,maxZ-minZ); comY = mass? comY/mass : 0; const cx=(minX+maxX)/2;
  const thrusters = bricks.filter(b=>b[0]==='fn_thruster').length;
  return { mass:+mass.toFixed(2), bricks:bricks.length, width, length, height:maxY, comY:+comY.toFixed(2), wheels, power, sail, cannons, thrust, shields, fuel, blasters, seats, hyper,
    // handling derived from the build
    accel: +(power/Math.max(1,mass)*6).toFixed(2), topSpeed: +(Math.min(40, 8 + power*1.2/Math.sqrt(Math.max(1,mass)))).toFixed(1),
    grip: Math.min(1, wheels/4), turn: +(Math.min(3, 0.6 + wheels*0.25 + 6/length)).toFixed(2), rollRisk: +(comY/ (width*2.5)).toFixed(2),
    sailSpeed: +(Math.min(30, sail*1.4/Math.sqrt(Math.max(1,mass)))).toFixed(1), shipTurn: +(1.6*8/Math.max(8,length)).toFixed(2),
    spaceThrust: +(thrust/Math.max(1,mass)*4).toFixed(2), spin: thrusters? +(((thrustX/thrusters)-cx)/Math.max(1,width)).toFixed(2) : 0, endurance: 60 + fuel*60 + shields*20 };
}

function foundTown(world, name, x, z){

  if(near) return { ok:false, why:`${world.factions[near.owner]?.name||'Someone'} holds this land.` };
  if(p.pips < FUNCTIONAL.fn_townstone.cost) return { ok:false, why:`A town stone costs ${FUNCTIONAL.fn_townstone.cost} pips.` };
  p.pips -= FUNCTIONAL.fn_townstone.cost;
  const id=`ptown${p.towns.length}`; const fid=`player_${id}`;
  const town = { id, name, x, z, realm, radius:96, founded:world.day, folk:[], level:0, stats:{beds:0,work:0,deco:0,safety:0,food:0,fun:0}, happiness:50, raid:null, statue:false, trade:[], allies:[] };

  world.factions[fid] = { id:fid, name, realm, kind:'town', lawful:true, color:'yellow', strength:15, wealth:30, sites:[], rel:{}, enemies:[], alive:true, standing:100, weariness:0, player:true, town:id };
  for(const o in world.factions){ if(o===fid) continue; world.factions[fid].rel[o]=0; world.factions[o].rel[fid]= world.factions[o].lawful?5:-20; }
  const site={ id:`site_${id}`, name, realm, kind:'town', x, z, owner:fid, defense:10, pop:0, player:true }; world.map.sites.push(site); world.factions[fid].sites.push(site.id);

function townTick(world){

    if(!t.raid && t.level>=0 && t.folk.length>=2 && r()<0.05 + t.level*0.02){ const raiders=pick(r,Object.values(world.factions).filter(f=>!f.lawful && f.alive && (f.realm===t.realm || r()<0.2))); if(raiders){ t.raid={ by:raiders.id, day:world.day, strength: 8+raiders.strength*0.15 }; news(world,`${raiders.name} are raiding ${t.name}!`,t.realm,'raid'); Bus.emit('town.raid',{town:t.id, by:raiders.id}); } }

function shopTick(world, shop, hours, present){
  const p=world.player; if(!shop.open || !(present || shop.keeper)) return 0; let earned=0; const r=rngFor(world.seed,'shop',shop.id,Math.floor(world.day*24));
  const customers = Math.floor(hours * (1.2 + (shop.townFolk||0)*0.15) + r());
  for(let i=0;i<customers;i++){ const item=pick(r, shop.stock.filter(s=>s.qty>0)); if(!item) break; const base=itemValue(item.item); const ratio=item.price/base;
    if(r() < clamp(1.4 - ratio*0.8, 0, 0.95)){ item.qty--; earned+=item.price; shop.sold=(shop.sold||0)+1; } else shop.walkouts=(shop.walkouts||0)+1; }
  if(shop.keeper) earned=Math.round(earned*0.85);
  shop.till=(shop.till||0)+earned; return earned;
}

function craft(world, rid, station){
  const p=world.player; const rc=RECIPES[rid]; if(!rc) return {ok:false,why:'Unknown recipe'}; if(rc.station!==station) return {ok:false,why:`Needs a ${rc.station}`};
  for(const [m,q] of Object.entries(rc.needs)) if((p.materials[m]||0)<q) return {ok:false,why:`Needs ${q} ${m}`};
  for(const [m,q] of Object.entries(rc.needs)) p.materials[m]-=q;
  const r=rngFor(world.seed,'craft',rid,p.stats.crafted++); const roll=r(); const tier = roll>0.985?4: roll>0.93?3: roll>0.78?2: roll>0.5?1:0;
  if(rc.kind==='material'||rc.kind==='food'){ p.materials[rid]=(p.materials[rid]||0)+1; return {ok:true, item:rid}; }
  if(rc.kind==='piece'){ p.functional[rc.piece]=(p.functional[rc.piece]||0)+1; return {ok:true,item:rc.piece}; }
  if(rc.kind==='hilt'){ p.hiltParts.push(rid); return {ok:true,item:rid}; }
  if(rc.kind==='suit'){ grantPowers(world,'suit'); return {ok:true,item:'powersuit'}; }
  const stats={}; for(const [k,v] of Object.entries(rc.base||{})) stats[k]=+(v*RARITY[tier].mul*(0.9+r()*0.25)).toFixed(1);
  const item={ id:`it${p.stats.crafted}`, recipe:rid, kind:rc.kind, weapon:rc.weapon, rarity:tier, stats, name:`${RARITY[tier].name} ${rid.replace(/_/g,' ')}` };
  p.inventory.push(item); return { ok:true, item };
}

  { id:'bridge', name:'A footbridge', req:{ minLength:12, minPieces:30 }, base:180 }, { id:'lighthouse', name:'A lighthouse', req:{ minHeight:30, needs:['lamp_1x1'] }, base:220 },
  { id:'statue', name:'A statue of the mayor', req:{ minHeight:18, minPieces:40 }, base:160 }, { id:'racetrack', name:'A race track', req:{ minLength:30, needs:['fn_startline'] }, base:260 },
  { id:'fort', name:'A fortification', req:{ minLength:16, minHeight:12, needs:['fn_gate'] }, base:300 }, { id:'garden', name:'A garden', req:{ needs:['fn_soil'], minPieces:20 }, base:120 },

function judgeCommission(brief, bricks){
  const st = blueprintStats(bricks)||{length:0,height:0,bricks:0,width:0}; const ids=new Set(bricks.map(b=>b[0])); const cols=new Set(bricks.map(b=>b[5]));
  const req=brief.req; let met=0, total=0; const notes=[];
  if(req.minLength){ total++; const L=Math.max(st.length,st.width); if(L>=req.minLength) met++; else notes.push(`too short (${L}/${req.minLength})`); }
  if(req.minHeight){ total++; if(st.height>=req.minHeight) met++; else notes.push(`too low (${st.height}/${req.minHeight} plates)`); }
  if(req.minPieces){ total++; if(st.bricks>=req.minPieces) met++; else notes.push(`needs ${req.minPieces} pieces`); }
  for(const n of req.needs||[]){ total++; if(ids.has(n)) met++; else notes.push(`missing ${n}`); }
  const reqScore = total? met/total : 1; const size = clamp(st.bricks/120,0,1); const deco = clamp((cols.size-1)/6 + (ids.size-2)/12, 0, 1);
  const score = reqScore*0.6 + size*0.2 + deco*0.2; return { score:+score.toFixed(2), pay: Math.round(brief.base*(0.3+score)), notes, reqScore, size, deco };
}

// §WARS -----------------------------------------------------------------------
let WAR_SEQ=1;
function warCheck(world){
  const F=world.factions; const active=world.wars.filter(w=>!w.ended); const freq=world.settings.warFreq;
  if(active.length >= 2 + (freq>1?1:0)) return;
  const r=rngFor(world.seed,'warcheck',Math.floor(world.day));
  const pairs=[]; const ids=Object.keys(F).sort();
  for(const a of ids) for(const b of ids){ if(a>=b) continue; const A=F[a],B=F[b]; if(!A.alive||!B.alive||A.kind==='order'||B.kind==='order'||A.kind==='hidden'||B.kind==='hidden') continue;
    if(active.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))) continue;
    const tension = -(A.rel[b]+B.rel[a])/2; if(tension<55) continue;
    const ratio = Math.min(A.strength,B.strength)/Math.max(A.strength,B.strength); pairs.push([a,b,tension*(0.5+ratio)]); }
  // realm against realm, sometimes
  if(r()<0.1*freq){ const ra=pick(r,REALM_IDS), rb=pick(r,REALM_IDS); if(ra!==rb){ const fa=ids.find(i=>F[i].realm===ra&&F[i].kind==='military'&&F[i].alive), fb=ids.find(i=>F[i].realm===rb&&F[i].kind==='military'&&F[i].alive); if(fa&&fb&&!active.some(w=>(w.a===fa&&w.b===fb)||(w.a===fb&&w.b===fa))) pairs.push([fa,fb,40]); } }
  if(!pairs.length) return;
  const choice = weighted(r,pairs,p=>p[2]); if(r() > 0.12*freq) return;
  declareWar(world, choice[0], choice[1]);
}
function declareWar(world, a, b, why){
  const F=world.factions; const fronts=[];
  const sA=F[a].sites.map(s=>siteById(world,s)).filter(Boolean), sB=F[b].sites.map(s=>siteById(world,s)).filter(Boolean);
  const cand=[]; for(const x of sA) for(const y of sB) cand.push([x,y,Math.hypot(x.x-y.x,x.z-y.z)]); cand.sort((p,q)=>p[2]-q[2]);
  for(const [x,y] of cand){ if(fronts.length>=3) break; if(!fronts.includes(y.id)) fronts.push(y.id); if(fronts.length<3 && !fronts.includes(x.id)) fronts.push(x.id); }
  const w={ id:`w${WAR_SEQ++}`, a, b, started:world.day, fronts, score:0, battles:0, sieges:{}, weary:false, ended:false, outcome:null, playerFought:false, why: why||'old grudges' };
  world.wars.push(w); world.stats.wars++;
  news(world, `WAR: ${F[a].name} and ${F[b].name} go to war (${w.why}).`, F[a].realm, 'war'); Bus.emit('war.start',{war:w});
  // the player's town may be requisitioned if allied with a side
  for(const t of world.player.towns){ const pf=F[`player_${t.id}`]; if(!pf) continue; if((pf.rel[a]||0)>30||(pf.rel[b]||0)>30){ t.requisitioned=true; news(world,`Soldiers requisition supplies in ${t.name}.`,t.realm,'war'); } }
  return w;
}
function warTick(world){
  const F=world.factions; world.tradeClosed={}; world.prices={}; world.refugees=world.refugees||{};
  for(const w of world.wars){ if(w.ended) continue; const A=F[w.a], B=F[w.b]; if(!A?.alive||!B?.alive){ endWar(world,w,'collapse'); continue; }
    const r=rngFor(world.seed,'war',w.id,world.tick);
    for(const realm of new Set([A.realm,B.realm])){ world.tradeClosed[realm]=true; world.prices[realm]=1.35; }
    w.fronts = w.fronts.filter(id=>{ const s=siteById(world,id); return s && (s.owner===w.a||s.owner===w.b); });
    if(!w.fronts.length){ const more=[...A.sites,...B.sites].slice(0,2); w.fronts.push(...more); if(!w.fronts.length){ endWar(world,w,'exhaustion'); continue; } }
    if(r()<0.35){ // a battle or siege at a front
      const site=siteById(world,pick(r,w.fronts)); const def=site.owner; const att= def===w.a?w.b:w.a;
      if(world.player.battleCallups) world.pendingBattles.push({ war:w.id, site:site.id, att, def, day:world.day });
      const res = resolveBattle(world, att, def, site);
      w.battles++; w.score += (att===w.a?1:-1)*(res.win?0.15:-0.05);
      w.sieges[site.id]=(w.sieges[site.id]||0)+1; site.siege={ by:att, assaults:w.sieges[site.id] }; site.damage=Math.min(1,(site.damage||0)+0.12);
      world.metrics.siegeDamage += 0.12;
      if(res.win && (w.sieges[site.id]>=2 || site.kind!=='town')){ if(F[def].lawful) world.lostSites.push({ faction:def, site:site.id, day:world.day }); transferSite(world, site, att, 'war'); site.siege=null; w.sieges[site.id]=0; }
      else if(r()<0.05) news(world, `The siege of ${site.name} grinds on.`, site.realm, 'war');
    }
    // refugees flee to the nearest safe realm
    const safe = REALM_IDS.find(x=>!world.tradeClosed[x]); if(safe){ world.refugees[safe]=(world.refugees[safe]||0)+0.25; }
    A.weariness+=0.012; B.weariness+=0.012; A.rel[w.b]=Math.max(-100,A.rel[w.b]-0.5); B.rel[w.a]=Math.max(-100,B.rel[w.a]-0.5);
    if(!w.weary && (A.weariness>0.6 || B.weariness>0.6)){ w.weary=true; news(world, `Both sides tire of the war between ${A.name} and ${B.name}. Talk of peace.`, A.realm, 'war'); }
    if(Math.abs(w.score)>1.2) endWar(world, w, 'victory');
    else if(w.weary && r()<0.03) endWar(world, w, 'treaty');
    else if(world.day - w.started > 90 && r()<0.05) endWar(world, w, 'treaty');
  }
  // defenders rebuild between assaults
  for(const s of world.map.sites){ if(s.siege && rngFor(world.seed,'reb',s.id,world.tick)()<0.15) s.siege=null; if(!s.siege && s.damage>0) s.damage=Math.max(0,s.damage-0.01); }
  for(const k in world.refugees) world.refugees[k]=Math.max(0, world.refugees[k]-0.05);
}
function endWar(world, w, how, broker){
  if(w.ended) return; w.ended=true; w.endDay=world.day; w.outcome=how; const F=world.factions; const A=F[w.a], B=F[w.b];
  if(A&&B){ const win = w.score>0?A:B; A.rel[w.b]=-35; B.rel[w.a]=-35; A.weariness=0; B.weariness=0;
    news(world, how==='treaty' ? `PEACE: ${A.name} and ${B.name} sign a treaty${broker?` brokered by ${broker}`:''}.` : how==='victory' ? `${win.name} wins the war against ${win===A?B.name:A.name}.` : `The war between ${A.name} and ${B.name} fizzles out.`, A.realm, 'war');
    if(broker){ world.player.stats.treaties=(world.player.stats.treaties||0)+1; grantTitle(world,'Peacemaker'); } }
  Bus.emit('war.end',{war:w});
}

// Advances the world without rendering. mode: 'passive' | 'active' | 'pressure'
function simulatedPlayerDay(world, mode){
  const p=world.player; const r=rngFor(world.seed,'simplayer',Math.floor(world.day));
  if(mode==='passive') return 0;
  // a simulated player builds a life: careers, a town, farming
  if(mode==='active'){
    if(!p.careers.army_royalguard && world.day>2) joinCareer(world,'army_royalguard',{force:true});
    if(!p.careers.hero && world.day>10){ grantPowers(world,'lab'); p.identity={exposure:0,exposed:false}; p.heroName='The Bright Comet'; joinCareer(world,'hero',{force:true}); }
    if(!p.careers.builder && world.day>5) joinCareer(world,'builder',{force:true});
    if(p.lumen.step==='none' && world.day>15){ lumenAdvance(world,'spark'); lumenAdvance(world,'temple'); for(const t of Object.keys(LUMEN_TRIALS)) lumenAdvance(world,'trial',{trial:t,choice:t==='mercy'?'spared':t==='stillness'?0.9:'yielded'}); lumenAdvance(world,'heartstone',{stone:'sunkenship'}); lumenAdvance(world,'forge',{hilt:{pommel:'river stone',grip:'wrapped wood',guard:'root curl',emitter:'carved bark'}}); }
    if(!p.towns.length && p.pips>2100){ foundTown(world,'Simhaven', 1800, -2600); }
    for(const t of p.towns){ const g=(k,v,cap)=>{ t.stats[k]=Math.min(cap,t.stats[k]+v); }; g('beds',0.3,40); g('work',0.3,40); g('deco',0.1,20); g('food',0.3,40); g('safety',0.08,15); g('fun',0.05,10); if(t.raid) resolveTownRaid(world,t, r()<0.7); }
    if(world.day>3 && p.companions.length<2){ recruitCompanion(world, COMPANION_POOL[p.companions.length].id); }
  }
  // pick jobs from boards: threats and pressure points first, then war, then the rest
  const all=[]; for(const [sid,list] of Object.entries(world.boards)) for(const j of list) all.push(j);
  const prio = j => j.type==='pressure'?10: j.type==='threat'?8: j.type==='enlist'?6: j.type==='broker'?6: j.type==='capture'?5: j.legendary?4: j.career?3: 1;
  const cand = all.filter(j=> mode==='pressure' ? (j.type==='pressure') : true).sort((a,b)=>prio(b)-prio(a));
  const n = mode==='pressure' ? 1 : 3; let done=0; let threatJobs=0;
  for(const j of cand){ if(done>=n) break; if(j.threat){ if(threatJobs>=1) continue; threatJobs++; } const chance = clamp(0.55 + playerPower(world)/150, 0, 0.95); completeJob(world, j, { success: r()<chance }); done++; }
  return done;
}
function runHeadless(days, mode='active', seed=CONFIG.seed, settings={}){

  const p=RT.focus||new THREE.Vector3(); sun.position.set(p.x+Math.cos(ang)*120, p.y+Math.max(12,Math.abs(sunUp)*160), p.z+40); sun.target.position.copy(p);

// scatter: shared instanced meshes per kind/variant across all loaded sectors
const Scatter = {
  meshes:{}, dirty:true, list:[],
  geom(kind, v, realm){ const key=kind+v+realm; if(this.meshes[key]) return this.meshes[key];
    let geo;
    if(kind==='grass'){ const g=GB(); const p=g.part('o',null); for(let i=0;i<3;i++){ const a=i*2.1; g.box(p,0.4+Math.cos(a)*0.2,0,0.4+Math.sin(a)*0.2,0.55+Math.cos(a)*0.2,0.5+i*0.15,0.55+Math.sin(a)*0.2); } geo=partsToGeo(g.out(), realm==='mistpeak'?'sand_green':realm==='wildwood'?'lime':'green'); }
    else { const km=scatterKitModel(kind, v, realm); geo=modelToGeo(km||genProp(kind==='tree'?'tree':kind, v, realm)); }
    const im=new THREE.InstancedMesh(geo, MAT.opaque, 1024); im.count=0; im.castShadow=kind!=='grass'; im.receiveShadow=true; im.frustumCulled=false; scene.add(im);
    this.meshes[key]={ im, kind, v, realm, items:[] }; return this.meshes[key]; },
  sync(){ // rebuilt only when sectors load/unload or a scatter item is smashed
    const keys=[...RT.sectors.values()].filter(s=>s.group).map(s=>s.key).sort().join('|'); if(keys===this.lastKeys && !this.dirty) return; this.lastKeys=keys; this.dirty=false;
    for(const m of Object.values(this.meshes)){ m.items=[]; }
    const M=new THREE.Matrix4();
    for(const s of RT.sectors.values()){ if(!s.group) continue; for(const it of s.scatter){ if(!it.alive) continue; const e=this.geom(it.kind,it.v,it.realm); e.items.push(it); } }
    for(const e of Object.values(this.meshes)){ const n=Math.min(e.items.length, 1024); e.im.count=n; for(let i=0;i<n;i++){ const it=e.items[i]; M.makeTranslation(it.x, it.y*PL, it.z); e.im.setMatrixAt(i,M); } e.im.instanceMatrix.needsUpdate=true; }
  },
  near(x,z,r){ const out=[]; for(const s of RT.sectors.values()) for(const it of s.scatter) if(it.alive && Math.abs(it.x+1-x)<r && Math.abs(it.z+1-z)<r) out.push([it,s]); return out; },
};
function modelToGeo(m, studs=false){ const buf=new MeshBuf(); const occ=new Set(); for(const b of m.bricks) if(PIECES[b[0]]?.shape==='box') for(const c of cellsOf(b)) occ.add(c);
  const full=(xs,ys,zs)=>{ for(const x of xs) for(const y of ys) for(const z of zs) if(!occ.has(x+','+y+','+z)) return false; return true; }; const rng=(a,b)=>{ const r=[]; for(let i=a;i<b;i++) r.push(i); return r; };
  for(const b of m.bricks){ const P=PIECES[b[0]]; if(!P) continue; const col=COLORS[b[5]]||COLORS.white; const [w,d]=pieceDims(P,b[4]); const x0=b[1],y0=b[2]*PL,z0=b[3],x1=x0+w,y1=y0+P.h*PL,z1=z0+d;
    if(P.shape==='box'){ const X=rng(b[1],b[1]+w), Y=rng(b[2],b[2]+P.h), Z=rng(b[3],b[3]+d);
      if(!full(X,[b[2]+P.h],Z)) emitQuad(buf,[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],[0,1,0],col,[1,1,1,1],[w,d]);
      if(!full([b[1]+w],Y,Z)) emitQuad(buf,[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],[1,0,0],col,[.8,.8,1,1],[d,y1-y0]); if(!full([b[1]-1],Y,Z)) emitQuad(buf,[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[-1,0,0],col,[.8,.8,1,1],[d,y1-y0]);
      if(!full(X,Y,[b[3]+d])) emitQuad(buf,[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],col,[.8,.8,1,1],[w,y1-y0]); if(!full(X,Y,[b[3]-1])) emitQuad(buf,[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],[0,0,-1],col,[.8,.8,1,1],[w,y1-y0]);
      if(studs && P.studs) for(let x=b[1];x<b[1]+w;x++) for(let z=b[3];z<b[3]+d;z++) if(!occ.has(x+','+(b[2]+P.h)+','+z)) studQuads(buf,x+0.5,y1,z+0.5,col); }
    else for(const part of shapeGeom(b[0])){ const pc=part.color?COLORS[part.color]:col; for(let k=0;k<part.pos.length;k+=3) buf.vert(x0+part.pos[k],y0+part.pos[k+1],z0+part.pos[k+2],part.nrm[k],part.nrm[k+1],part.nrm[k+2],pc.r,pc.g,pc.b,1,1,2,2); } }

function studQuads(buf,x,y,z,col){ const r=0.3,h=0.17,seg=6; for(let i=0;i<seg;i++){ const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2; const c0=Math.cos(a0)*r,s0=Math.sin(a0)*r,c1=Math.cos(a1)*r,s1=Math.sin(a1)*r; const nx=Math.cos((a0+a1)/2), nz=Math.sin((a0+a1)/2);
  emitQuad(buf,[[x+c0,y,z+s0],[x+c1,y,z+s1],[x+c1,y+h,z+s1],[x+c0,y+h,z+s0]].reverse(),[nx,0,nz],col,[.9,.9,1,1],[1,1]); buf.vert(x,y+h,z,0,1,0,col.r,col.g,col.b,1,1,2,2); buf.vert(x+c1,y+h,z+s1,0,1,0,col.r,col.g,col.b,1,1,2,2); buf.vert(x+c0,y+h,z+s0,0,1,0,col.r,col.g,col.b,1,1,2,2); } }
function partsToGeo(parts, colorName){ const buf=new MeshBuf(); const col=COLORS[colorName]; for(const part of parts){ const pc=part.color?COLORS[part.color]:col; for(let k=0;k<part.pos.length;k+=3) buf.vert(part.pos[k],part.pos[k+1],part.pos[k+2],part.nrm[k],part.nrm[k+1],part.nrm[k+2],pc.r,pc.g,pc.b,1,1,2,2); } return buf.geometry(); }

// Smashing splits only the impact region into live physics bricks; pips burst out; bricks go to the brick bank.
const Live = {
  pool:[], mesh:null, cap:CONFIG.maxLiveBricks, active:0,
  init(){ const g=new THREE.BoxGeometry(1,1,1); const m=new THREE.MeshPhysicalMaterial({ roughness:0.3, clearcoat:0.6, clearcoatRoughness:0.2 });
    this.mesh=new THREE.InstancedMesh(g,m,this.cap); this.mesh.count=0; this.mesh.castShadow=true; this.mesh.receiveShadow=true; this.mesh.frustumCulled=false; this.mesh.setColorAt(0,new THREE.Color()); scene.add(this.mesh);

  spawn(pid, color, x, y, z, vx, vy, vz){

    const P=PIECES[pid]||PIECES.brick_1x2; const [w,d]=pieceDims(P,0);
    b.alive=true; b.settled=false; b.t=0; b.pid=pid; b.color=color; b.p.set(x,y,z); b.v.set(vx,vy,vz); b.q.setFromEuler(new THREE.Euler(Math.random()*3,Math.random()*3,Math.random()*3));
    b.w.set((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14); b.s.set(Math.min(w,4)*0.96, P.h*PL*0.96, Math.min(d,4)*0.96); b.c=COLORS[color]||COLORS.white; b.rare=RARE_COLORS.has(color)||P.value>1; return b; },
  update(dt){
    const M=new THREE.Matrix4(), dq=new THREE.Quaternion(), e=new THREE.Euler(); let n=0;
    for(const b of this.pool){ if(!b.alive) continue; b.t+=dt;
      if(!b.settled){ b.v.y -= CONFIG.gravity*dt*RT.gravityMul; b.p.addScaledVector(b.v,dt);
        const gy = supportTop(Math.floor(b.p.x),Math.floor(b.p.z), b.p.y/PL+1)*PL + b.s.y/2;
        if(b.p.y<gy){ b.p.y=gy; if(Math.abs(b.v.y)>2){ b.v.y=-b.v.y*0.32; b.v.x*=0.7; b.v.z*=0.7; b.w.multiplyScalar(0.6); if(Math.random()<0.15) Audio.noise(0.02,4000,8,0.05); } else { b.v.y=0; b.v.x*=0.85; b.v.z*=0.85; b.w.multiplyScalar(0.8); } }

      if(b.settled && b.t>45){ b.alive=false; continue; }
      M.compose(b.p,b.q,b.s); this.mesh.setMatrixAt(n,M); this.mesh.setColorAt(n,b.c); n++; }

    if(got){ Audio.click(got); RT.world.player.stats.bricksCollected=(RT.world.player.stats.bricksCollected||0)+got; }
  },
};

function nearbyFn(f, r=6){ let best=null, bd=r; for(const s of RT.sectors.values()) for(const fn of s.fn){ const d=Math.hypot(fn.x-f.pos.x,fn.z-f.pos.z); if(d<bd){ bd=d; best=fn; } } return best; }
function interactPrompt(f){
  const p=Rubble.nearest(f,4); if(p) return p.options.length>1 ? `Hold E to build: ${p.options.map((o,i)=>(i===p.choice?'▶':'')+RUBBLE_BUILDS[o].name).join(' / ')} (1/2 to choose)` : `Hold E to build a ${RUBBLE_BUILDS[p.options[0]].name}`;
  const fn=nearbyFn(f); if(fn) return { waystone:'E: Waystone (fast travel)', board:'E: Job board', recruiter:'E: Recruiter', inn:'E: Inn (rest, save)', shop:'E: Shop', bakery:'E: Bakery', temple:'E: Lumen temple', launchpad:'E: Launch to the Frontier', statue:`A statue: ${fn.deed||''}`, colony:'E: Colony (return to the launch pad)' }[fn.kind]||null;
  const m=nearestMountable(f); if(m) return `X: ${m.tamed||m===RT.players[1]?.fig?'Ride':'Tame'} ${m.name}`;
  const prop=nearestCarryable(f); if(prop) return 'G: pick up';
  return null;
}
function interact(pl){
  const f=pl.fig; const W=RT.world; const fn=nearbyFn(f); if(!fn) return false;
  switch(fn.kind){
    case 'waystone': { const ws=W.map.waystones.find(w=>w.town===fn.town); if(ws && !W.player.waystones.includes(ws.id)){ W.player.waystones.push(ws.id); toast('Waystone unlocked!'); Audio.jingle(4); FX.burst('magic',fn.x,fn.y+4,fn.z,20,4); } Menu.open('travel'); return true; }
    case 'board': Menu.open('jobs',{ site:fn.town }); return true;
    case 'recruiter': Menu.open('recruiter',{ realm:fn.realm }); return true;
    case 'inn': case 'bakery': Menu.open('inn',{ town:fn.town }); return true;
    case 'shop': Menu.open('shop',{ town:fn.town }); return true;
    case 'temple': Menu.open('temple',{ realm:fn.realm }); return true;
    case 'launchpad': launchToSpace(); return true;
    case 'colony': returnFromSpace(); return true;
  }
  return false;
}
function nearestMountable(f){ let best=null,bd=4.5; for(const o of RT.figures){ if(o===f||o.ko||o.rider) continue; if(!(o.sp.mount || (o.isPlayer && o.scale>=1.2 && (o.plan==='quad')))) continue; const d=o.pos.distanceTo(f.pos); if(d<bd){ bd=d; best=o; } } return best; }
function nearestCarryable(f){ let best=null, bd=3; for(const b of Live.pool){ if(!b.alive||!b.settled) continue; const d=b.p.distanceTo(f.pos); if(d<bd && (b.pid.startsWith('round')||b.pid.startsWith('brick_2'))){ bd=d; best=b; } } return best; }

const Modes = { list:['ON_FOOT','RIDING','VEHICLE','BUILD','MENU','CUTSCENE','SAIL','FLY','SPACE','PHOTO'], set(m){ if(RT.mode===m) return; Bus.emit('mode',{from:RT.mode,to:m}); RT.mode=m; } };
function playerUpdate(pl, dt){
  const f=pl.fig; const it=pl.ctrl.intent(pl.cam); pl.it=it;
  if(RT.mode!=='ON_FOOT' && RT.mode!=='RIDING' && RT.mode!=='FLY') return it;
  // lock-on
  if(it.lock){ f.lockTarget = f.lockTarget ? null : nearestFoe(f,25)||nearestInFront(f,25); if(f.lockTarget) toast(`Locked on: ${f.lockTarget.name}`); }
  if(f.lockTarget && (f.lockTarget.ko || f.lockTarget.pos.distanceTo(f.pos)>40)) f.lockTarget=null;
  // block / parry
  if(it.block && !f.blocking){ f.blocking=true; f.blockT=RT.time; } else if(!it.block) f.blocking=false;
  if(it.dodge && f.stamina>12 && !f.ko){ f.stamina-=12; const d=it.mag>0.1?new THREE.Vector3(it.mx,0,it.mz):forward(f).negate(); f.vel.addScaledVector(d,16); f.iframes=0.35; f.action={anim:'dodge',t:0,dur:0.35,fired:true,A:{effects:[],tags:[],cast:0},cancel:true}; Audio.whoosh(); }
  // attacks: light combo, heavy, special, abilities
  const W=WEAPONS[f.weapon]||WEAPONS.natural;
  if(it.light||it.heavy||it.special){ const t=f.lockTarget||nearestFoe(f,6); if(t) f.yaw=Math.atan2(t.pos.x-f.pos.x,t.pos.z-f.pos.z); } // soft auto-aim
  if(it.light){ if(f.carry){ throwCarry(f); } else { const id=W.light[f.combo%W.light.length]; if(useAbility(f,id)){ f.combo=(f.combo+1); f.comboT=1.2; } } }
  if(it.heavy) useAbility(f, f.carry?'throw':W.heavy);
  const list=abilityList(f); if(it.special) useAbility(f, list[0]); if(it.ab>=0) useAbility(f, list[it.ab+1]); if(it.power) useAbility(f, list[5]||list[list.length-1]);
  if(it.blade) toggleBlade(f);
  // interact / build from rubble
  const pile=Rubble.nearest(f,4); if(pile){ if(Input.hit('Digit1')&&pile.options.length>1) pile.choice=0; if(Input.hit('Digit2')&&pile.options.length>1) pile.choice=1; if(it.interactHeld) Rubble.build(pile,true); else if(pile.building) pile.building.holding=false; }
  else if(it.interact) interact(pl);
  if(it.throw){ if(f.carry) throwCarry(f); else { const b=nearestCarryable(f); if(b){ b.alive=false; f.carry={pid:b.pid,color:b.color}; toast('Picked up — click to throw.'); } } }
  if(it.mount){ if(f.mount){ dismount(f); } else { const m=nearestMountable(f); if(m) mountOn(f,m); } }
  if(it.build){ BuildMode.toggle(pl); }
  return it;
}
function throwCarry(f){ const fwd=RT.camAim?RT.camAim.clone():forward(f); const b=Live.spawn(f.carry.pid,f.carry.color,f.pos.x+fwd.x,f.pos.y+3,f.pos.z+fwd.z,fwd.x*22,6+fwd.y*20,fwd.z*22); f.carry=null; f.action={anim:'throw',t:0,dur:0.35,fired:true,A:{effects:[],tags:[],cast:0}};
  Proj.list.push({ src:f, A:ABILITIES.throw, pos:new THREE.Vector3(f.pos.x+fwd.x,f.pos.y+3,f.pos.z+fwd.z), vel:new THREE.Vector3(fwd.x*22,6+fwd.y*20,fwd.z*22), t:0, life:1.2, mult:1, col:COLORS.brown, team:f.team, carried:b }); }
function mountOn(f,m){ if(!m.tamed && !(m.isPlayer)){ // tame by feeding (spend crops), calming (Lumen), or besting it
    const food = Object.keys(CROPS).find(c=>RT.world.player.materials[c]>0); const calm = RT.world.player.abilities.includes('lumen_calm');

    else { toast(`The ${m.name} won't let you on. Feed it a crop, calm it, or best it in a scuffle.`); m.angry=f; if(m.controller) { m.controller.brain='fight'; m.controller.target=f; } return; }

  f.mount=m; m.rider=f; if(!m.isPlayer){ m.controller=RT.players.find(p=>p.fig===f)?.ctrl; m.riderCtrl=true; } Modes.set('RIDING'); Audio.voice(m.sp.voice||'neigh'); }

const Travel = {

};

// §JOBS (runtime objectives) -----------------------------------------------------
const Jobs = {
  start(j){ const W=RT.world; const site=siteById(W,j.site); RT.job={ ...j, pos:new THREE.Vector3(site.x+(Math.random()-.5)*60, 0, site.z+(Math.random()-.5)*60), spawned:false, kills:0, progressText:'' };
    if(j.obj==='deliver'||j.obj==='escort'||j.obj==='trade'){ const other=pick(Math.random, W.map.towns.filter(t=>t.realm===site.realm && t.id!==site.id)) || site; RT.job.pos.set(other.x, 0, other.z); RT.job.destName=other.name; }
    toast(`Job: ${j.title}`); Audio.jingle(2); Bus.emit('job.start',{job:j}); },
  clear(){ for(const f of RT.figures) if(f.jobSpawn) f.alive=false; RT.job=null; },
  update(dt){
    const J=RT.job; if(!J) return; const f=RT.players[0].fig; const d=Math.hypot(J.pos.x-f.pos.x, J.pos.z-f.pos.z);
    if(['defeat','boss','hunt','battle','defend','capture','rescue','duel'].includes(J.obj)){
      if(!J.spawned && d<60){ J.spawned=true; const n = J.obj==='boss'?1: J.obj==='battle'||J.obj==='capture'?0: J.count||3; const realm=realmAt(J.pos.x,J.pos.z);
        if(J.obj==='battle'||J.obj==='capture'||J.obj==='defend'){ Battles.start({ site:J.site, att: J.client, def: J.target||null, job:J }); }
        for(let i=0;i<n;i++){ const x=J.pos.x+(Math.random()-.5)*14, z=J.pos.z+(Math.random()-.5)*14; const foeF=RT.world.factions[J.target]; const rec=pickCharacter(Math.random, foeF?.lawful===false?'Factions':'Townsfolk', realm) || randomRecipe(Math.random,'human');
          rec.held = rec.held&&rec.held!=='none'?rec.held:pick(Math.random,['sword','spear','hammer','daggers']); if(foeF) rec.colors={...(rec.colors||{}), torso:foeF.color};
          const e=spawnFigure(rec,new THREE.Vector3(x,surfaceY(x,z),z),{ team:'enemy', brain:'wander', ai:{aggro:30,radius:6}, name: J.obj==='boss' ? (J.threat?RT.world.threats.find(t=>t.id===J.threat)?.leader:'A notorious villain') : (foeF?.name||'Bandit'), hp: J.obj==='boss'?400:60 }); e.jobSpawn=true; if(J.obj==='boss'){ e.scale*=1.4; e.root.scale.setScalar(e.scale); e.boss='job'; } }
        if(J.obj==='rescue'){ for(let i=0;i<3;i++){ const x=J.pos.x+i*3,z=J.pos.z; const t=spawnFigure(randomRecipe(Math.random,'human'),new THREE.Vector3(x,surfaceY(x,z),z),{team:'neutral',brain:'idle',name:'Stranded townsfolk'}); t.jobSpawn=true; t.rescuee=true; t.emote={name:'wave',t:0,dur:999}; } } }
      const foes=RT.figures.filter(o=>o.jobSpawn && o.team==='enemy' && o.alive && !o.ko); const resc=RT.figures.filter(o=>o.rescuee && o.alive);
      if(J.spawned){ if(J.obj==='rescue'){ for(const r of resc) if(r.pos.distanceTo(f.pos)<3){ r.alive=false; FX.burst('sparkle',r.pos.x,r.pos.y+2,r.pos.z,10,4); if(RT.world.player.powers) RT.world.player.powers.charge=Math.min(100,RT.world.player.powers.charge+20); } J.progressText=`(${3-resc.length}/3 rescued)`; if(!resc.length) this.finish(true); }
        else if(J.obj!=='battle'&&J.obj!=='capture'&&J.obj!=='defend'){ J.progressText=`(${foes.length} left)`; if(!foes.length) this.finish(true); } }
      else J.progressText=`(${Math.round(d)}m)`;
    } else if(J.obj==='gather'){ const have=(RT.world.player.stats.smashed||0)-(J.base??(J.base=RT.world.player.stats.smashed||0)); J.progressText=`(${Math.min(have,J.count*5)}/${J.count*5} smashed)`; if(have>=J.count*5) this.finish(true); }
    else if(J.obj==='race'){ Race.update(J,f,dt); }
    else if(J.obj==='build'){ J.progressText='(open Build mode on a plot, then submit from the Blueprints menu)'; }
    else { J.progressText=`(${Math.round(d)}m${J.destName?' to '+J.destName:''})`; if(d<8){ if(J.obj==='meditate'){ f.emote={name:'meditate',t:0,dur:3}; } if(J.obj==='tame'||J.obj==='cook'||J.obj==='sneak'||J.obj==='catch'||J.obj==='broker'||J.obj==='reach'||J.obj==='deliver'||J.obj==='escort'||J.obj==='meditate') this.finish(true); } }
    // a marker of glowing bricks shows where to go
    if(RT.frame%4===0){ const y=surfaceY(J.pos.x,J.pos.z)+6+Math.sin(RT.time*3); FX.spawn('sparkle',J.pos.x,y,J.pos.z,0,1,0); }
  },
  finish(ok){ const J=RT.job; if(!J) return; const W=RT.world; const real=Object.values(W.boards).flat().find(x=>x.id===J.id)||J; completeJob(W, real, {success:ok}); if(ok){ toast(`Job done! +${J.pay} pips`); Audio.jingle(4); Pips.burst(RT.players[0].fig.pos.x,RT.players[0].fig.pos.y+3,RT.players[0].fig.pos.z,6); } this.clear(); },
};

const MEM = {}; const SAVE_KEY='everbrick.save';
function storeGet(k){ try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return MEM[k]??null; }
function storeSet(k,v){ MEM[k]=v; try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function saveGame(){ const W=RT.world; const f=RT.players[0]?.fig; if(f) W.player.pos=[+f.pos.x.toFixed(1),+f.pos.y.toFixed(1),+f.pos.z.toFixed(1)]; W.player.inSpace=!!RT.inSpace; const s=saveToString(W); storeSet(SAVE_KEY,s); RT.lastSave=RT.time; return s.length; }
Menu.pages.save = ()=>`<h2>Save & settings</h2><div class="row"><button data-act="saveNow">Save now</button><button data-act="exportSave">Export JSON</button><button data-act="importSave">Import JSON</button><button data-act="newWorldPrompt">New world…</button></div>

  <p>Save size: ${(storeGet(SAVE_KEY)||'').length} chars. Version ${SAVE_VERSION}${RT.world._migrated?.length?` (migrated ${RT.world._migrated.join(', ')})`:''}.</p>`;
Menu.acts.exportSave = ()=>{ const s=JSON.stringify(serializeWorld(RT.world)); $('saveText').value=s; try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'application/json'})); a.download='everbrick-save.json'; a.click(); }catch(e){} };
Menu.acts.newWorldPrompt = ()=>{ if(confirm('Start a new world? Your current save will be replaced.')){ storeSet(SAVE_KEY,''); location.href=location.pathname+'?new=1'; } };
Menu.acts.importSave = ()=>{ try{ const w=loadFromString($('saveText').value.trim()); RT.world=w; storeSet(SAVE_KEY,saveToString(w)); location.reload(); }catch(e){ toast('Import failed: '+e.message); } };
Menu.acts.toggle = k=>{ if(k==='music'){ Audio.musicOn=!Audio.musicOn; return; } CONFIG[k]=!CONFIG[k]; if(k==='shadows'){ renderer.shadowMap.enabled=CONFIG.shadows; sun.castShadow=CONFIG.shadows; scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); } if(k==='bloom') bloom.enabled=CONFIG.bloom; if(k==='tiltShift') tiltPass.enabled=CONFIG.tiltShift; };

// §DEBUG ----------------------------------------------------------------------
const dbg = {
  help(){ return Object.keys(dbg).join(', '); },
  teleport(x,z){ teleportPlayers(x,z,'debug'); }, realm(id){ const t=RT.world.map.towns.find(t=>t.realm===id&&t.capital); if(t) teleportPlayers(t.x+10,t.z+10); else if(id==='frontier') launchToSpace(); },
  spawn(kind, n=1){ const f=RT.players[0].fig; const out=[]; for(let i=0;i<n;i++){ const p=f.pos.clone().add(new THREE.Vector3(4+i*2,1,4)); if(SPECIES[kind]) out.push(spawnFigure({species:kind},p,{team:SPECIES[kind].boss?'enemy':'wild',brain:'wander',ai:{aggro:SPECIES[kind].boss?20:0}})); else { const m=RT.assets.models[kind]||(RUBBLE_BUILDS[kind]?{bricks:RUBBLE_BUILDS[kind].bricks}:null); if(m) for(const b of m.bricks) placeWorldBrick([b[0],Math.floor(p.x)+b[1],Math.floor(p.y/PL)+b[2],Math.floor(p.z)+b[3],b[4],b[5],b[6]],{silent:true}); } } return out.length||kind; },
  body(species){ applyPlayerRecipe({...defaultRecipe(species)}); }, smash(r=3){ const f=RT.players[0].fig; const p=f.pos.clone().addScaledVector(RT.camAim||forward(f),6); p.y=f.pos.y+2; return smashAt(p,r,{by:f}); },
  pips(n=1000){ RT.world.player.pips+=n; }, bricks(n=500){ for(let i=0;i<n;i++) bankAdd(pick(Math.random,['brick_2x4','brick_1x2','plate_2x2','brick_2x2','slope45_2x2','tile_1x2']),pick(Math.random,['red','blue','yellow','white','green','tan','dark_grey']),1); },

  days(n=1){ advanceWorld(RT.world,n); return RT.world.day; }, war(a,b){ return declareWar(RT.world,a||'royalguard',b||'blacktower','debug')?.id; }, threat(arch='darkarmy'){ const t=spawnThreat(RT.world,arch); return t.id; },

};
