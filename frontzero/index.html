<title>FRONT ZERO</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);user-select:none;-webkit-user-select:none}

<script type="module">
/* =====================================================================================
   FRONT ZERO — near-future tactical first-person shooter (converted from BOUNTY RUN)
   Content lives in data/*.json (maps, biomes, countries, operators, weapons, items,
   vehicles, missions, traders, contracts, challenges). Code lives here.
   -------------------------------------------------------------------------------------
   MANIFEST (search for the anchor to jump to a system)
   §CONFIG      engine tunables (movement, ballistics, AI, vehicles, render)
   §UTIL        math helpers, seeded RNG, simplex noise, canvas helpers
   §DATA        loads data/*.json
   §ASSETS      optional design pack (BOUNTY RUN's ../bounty-run/design): bike GLBs → speeder bike, pip.glb → recon drone
   §AUDIO       synthesised gunfire with biome acoustics + distance, engines, radio, adaptive regional score
   §INPUT       keyboard + mouse (pointer lock), gamepads, split-screen player 2
   §WORLD       map runtime: biome generators, heightfield/surface/water/biome grids, sites, rivers, roads, sea
   §RENDER      renderer, sky + day cycle, post (thermal / night vision / flash / damage), terrain chunks + LOD, water
   §COL         collision world: oriented boxes, cylinders, ramps; rays with materials; ground / ceiling; capsule moves
   §BUILD       biome building kits, destructible panels, large structures (tower, bridge, dam, radar, cable car), cover points
   §FOLIAGE     instanced vegetation with wind + impostors; foliage density (blocks AI sight)
   §FX          particles, muzzle flashes, tracers, surface impacts, explosions, smoke volumes, debris, cloth
   §WEAPONS     weapon + attachment stats, ammo types, ballistics (travel, drop, penetration), damage + armour, throwables
   §VIEWMODEL   first-person arms + weapons built from attachments; keyframe animation tables; third-person guns
   §SOLDIER     movement (prone, lean, slide, mantle, vault, swim), grapple, rappel, parachute + wingsuit, health, revives
   §SOLDIERGFX  instanced soldier bodies posed from keyframe tables (one draw per part for all soldiers)
   §OPERATORS   eight operators: signature gadgets, class tools, ultimates, deployables, drones
   §AI          navigation (coarse + fine A*), cover, perception, squad tactics, vehicle crews, difficulty
   §VEHICLES    speeders (ported from SANDLINE), armour, walkers, air, sea, snow, drones; seats, part damage, repair
   §EVENTS      mission event system (converted escape-trick registry): triggers + actions for campaign and extraction
   §MODES       GameMode base, team deathmatch, domination, firing range, vehicle training
   §WARFARE     Breakthrough + Conquest: 32v32, squads, orders, spawning, commander support, destructible objectives

// ---- benchmarks (?bench=firefight | warfare) ------------------------------------------------------------------------
const Bench = {
  async run(kind) {
    G.bench = { kind, results: [], t: 0, samples: [] }; const box = document.getElementById('bench'); box.style.display = 'block'; const dur = +(QS.get('dur') || CONFIG.bench.duration);
    if (kind === 'warfare') {
      const big = DATA.mapOrder.map((id) => DATA.maps[id]).filter((m) => m.breakthrough).sort((a, b) => b.size - a.size)[0]; const n = +(QS.get('size') || 32);
      await Game.start(new Warfare({ map: big.id, warfare: 'breakthrough', perTeam: n, difficulty: 'regular', bench: true, allVehicles: true })); await this.measure(big.id + ' warfare ' + n + 'v' + n, dur);
    } else {
      const byBiome = {}; for (const id of DATA.mapOrder) { const m = DATA.maps[id]; if (m.areas?.length && !byBiome[m.biomes[0]]) byBiome[m.biomes[0]] = id; }
      for (const [b, id] of Object.entries(byBiome)) { await Game.start(new TeamDeathmatch({ map: id, perTeam: 12, difficulty: 'regular', bench: true, limit: 999, time: 9999 })); await this.measure(id + ' (' + b + ') firefight 12v12', dur); Game.teardown(); }
    }
    const out = 'BENCH ' + JSON.stringify(G.bench.results); console.log(out); box.textContent = G.bench.results.map((r) => `${r.name}: avg ${r.avg} ms (${r.fps} fps) · p95 ${r.p95} · worst ${r.worst} · logic ${r.logic} · draws ${r.draws}`).join('\n'); G.bench.done = true;
  },
  measure(name, dur) { return new Promise((res) => { const b = G.bench; b.samples = []; b.logic = []; b.draws = []; b.t = 0; b.name = name; b.dur = dur; b.res = res; G.players[0].soldier.invulnT = 1e9; }); },
  update(dt) { const b = G.bench; if (!b || b.done || !b.res || !G.inGame) return; b.t += dt; if (b.t < 2) return; b.samples.push(dt * 1000); b.logic.push(G.logicMs || 0); b.draws.push(renderer.info.render.calls);
    // fly-by camera over the fight
    const P = G.players[0]; const s = P.soldier; const c = G.mode.benchFocus ? G.mode.benchFocus() : V3(); const a = b.t * 0.12; s.invulnT = 1e9; s.pos.set(c.x + Math.cos(a) * 60, World.heightAt(c.x + Math.cos(a) * 60, c.z + Math.sin(a) * 60) + 0.1, c.z + Math.sin(a) * 60); P.lookYaw = Math.atan2(c.x - s.pos.x, c.z - s.pos.z); P.lookPitch = -0.15;

    if (b.t >= b.dur + 2) { const S = [...b.samples].sort((x, y) => x - y); const avg = S.reduce((x, y) => x + y, 0) / S.length; const r = { name: b.name, avg: +avg.toFixed(2), fps: +(1000 / avg).toFixed(1), p95: +S[Math.floor(S.length * 0.95)].toFixed(2), worst: +S[S.length - 1].toFixed(2), logic: +(b.logic.reduce((x, y) => x + y, 0) / b.logic.length).toFixed(2), draws: Math.round(b.draws.reduce((x, y) => x + y, 0) / b.draws.length), soldiers: Soldiers.list.length, vehicles: Vehicles.list.length }; b.results.push(r); const res = b.res; b.res = null; res(); } },
};
