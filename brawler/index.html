    <script>
      // Phones cache this page hard. Ask the server for the live stamp once; if it is newer, load
      // the fresh page under a new query so no cache can answer. No storage is used: the stamp
      // itself rides in the query, which also stops any reload loop.
      (async () => {
        try {
          const meta = document.querySelector('meta[name="build"]');
          const mine = meta ? meta.getAttribute('content') : '';
          if (!mine || mine.startsWith('__')) return;
          const res = await fetch(location.pathname, { cache: 'no-store' });
          const live = (await res.text()).match(/name="build" content="([^"]+)"/);
          const stamp = live ? live[1] : '';
          if (stamp && stamp !== mine) {
            const q = new URLSearchParams(location.search);
            if (q.get('r') === stamp) return;
            q.set('r', stamp);
            location.replace(location.pathname + '?' + q.toString() + location.hash);
          }
        } catch {}
      })();
    </script>
