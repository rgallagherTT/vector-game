      #hud {

      /* A short mode notice under the strip. */
      #hud-notice {
        position: fixed; top: 108px; left: 50%; transform: translateX(-50%); pointer-events: none; user-select: none;
        padding: 6px 16px; border-radius: 4px; background: rgba(20, 22, 28, 0.8); border: 1px solid #f2c14e; color: #fff1c9;

      @keyframes noticein { from { transform: translateX(-50%) translateY(-6px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

      #hud-abilities {

      #hud-abilities .label { text-transform: uppercase; min-width: 44px; }

      #hud-abilities .pips { display: flex; gap: 6px; flex: 1; }
      #hud-abilities .pip { width: 14px; height: 14px; border-radius: 50%; background: #4fbf5a; box-shadow: 0 0 6px rgba(79, 191, 90, 0.6); }
      #hud-abilities .pip.spent { background: #3a3f4c; box-shadow: none; }
      #hud-abilities .ability.ready { border-color: #f2c14e; color: #e6dfd0; }

      #hud-abilities .ultra.ready { border-color: #9a5cff; }
