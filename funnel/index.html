<style>
:root{
  --ink:#fff8ec; --ink-dim:#ffe9c7; --shade:rgba(45,22,6,.55); --accent:#ffcf3f; --hot:#ff7a2f;
  --red:#ff4d3d; --energy:#5fdcff; --panel:rgba(38,26,48,.58); --line:rgba(255,248,236,.22);
  --font:"Arial Black","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;overscroll-behavior:none;background:#f3d9a6;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.hidden{display:none!important}
.txt{text-shadow:0 3px 0 var(--shade),0 0 12px rgba(0,0,0,.25)}
button{font:inherit;font-size:18px;color:#3a2108;background:var(--accent);border:0;border-bottom:5px solid #c98d12;padding:12px 26px;border-radius:14px;cursor:pointer;letter-spacing:.04em}
button:hover{filter:brightness(1.08)} button:active{transform:translateY(3px);border-bottom-width:2px}
button.ghost{background:rgba(255,255,255,.18);color:var(--ink);border-bottom-color:rgba(0,0,0,.25)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#tl{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:min(340px,46vw)}
#tierName{font-size:clamp(20px,3.4vw,34px);letter-spacing:.03em;line-height:1}

#growWrap{margin-top:8px;display:flex;align-items:center;gap:8px}

#growFill{height:100%;width:0;background:linear-gradient(90deg,#ffd75e,#ff9b3d);border-radius:7px;transition:width .12s}
#nextBox{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:12px;white-space:nowrap}
#nextIcon{font-size:22px;line-height:1}
#tc{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center}
#score{font-size:clamp(20px,3vw,30px)}
#combo{font-size:16px;color:var(--accent);height:20px}
#tr{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));text-align:right}
#timer{font-size:20px;margin-bottom:6px}
#minimap{width:132px;height:132px;border-radius:50%;border:3px solid var(--line);background:#7bb35a;display:block;margin-left:auto}
#bc{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(460px,70vw);text-align:center}
#energyLabel{font-size:12px;letter-spacing:.14em;margin-bottom:3px}
#energyBar{height:18px;border-radius:10px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
#energyFill{height:100%;width:100%;background:linear-gradient(90deg,#3fb6ff,#8ff0ff);border-radius:8px}
#energyBar.low #energyFill{background:linear-gradient(90deg,#ff4d3d,#ff9d5e);animation:blink .4s infinite alternate}
@keyframes blink{to{opacity:.45}}
#zoneNote{font-size:14px;height:20px;margin-top:4px;color:var(--ink-dim)}
#surgeBox{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));font-size:12px;letter-spacing:.1em}
#surgeBar{width:110px;height:8px;border-radius:5px;background:var(--panel);overflow:hidden;margin-top:3px}
#surgeFill{height:100%;width:100%;background:#fff}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none}
#bannerText{display:inline-block;font-size:clamp(40px,9vw,104px);letter-spacing:.02em;line-height:1;color:#fff;-webkit-text-stroke:3px #3a2108;text-shadow:0 7px 0 #3a2108,0 0 30px rgba(255,190,60,.6)}
#bannerSub{font-size:clamp(16px,2.6vw,26px);margin-top:10px}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
#ring{position:fixed;left:50%;top:calc(30% + 50px);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:8px solid #fff;opacity:0;pointer-events:none}
#ring.go{animation:ring .8s ease-out}
@keyframes ring{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(28);border-width:1px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,20,.35));opacity:0;transition:opacity .3s}
#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:0;top:0;font-size:16px;white-space:nowrap;will-change:transform;text-shadow:0 2px 0 var(--shade)}
.lock{position:absolute;left:0;top:0;font-size:15px;white-space:nowrap;color:#fff;background:rgba(220,40,30,.82);border-radius:8px;padding:1px 5px;font-family:system-ui,sans-serif;font-weight:800}
.bubble{position:absolute;left:0;top:0;font-size:13px;color:#3a2108;background:#fff;border-radius:10px;padding:2px 7px;white-space:nowrap;font-family:system-ui,sans-serif;font-weight:900}
.tag{position:absolute;left:0;top:0;font-size:11px;color:#fff;background:rgba(30,30,40,.7);border-radius:6px;padding:1px 6px;white-space:nowrap;font-family:system-ui,sans-serif;font-weight:800}
#aim{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#title{background:linear-gradient(180deg,rgba(255,214,140,.0),rgba(80,40,10,.35))}
#titleCard{text-align:center;padding:20px}
#titleCard h1{margin:0;font-size:clamp(72px,17vw,190px);line-height:.9;color:#fff;-webkit-text-stroke:4px #3a2108;text-shadow:0 10px 0 #3a2108,0 0 50px rgba(255,190,60,.7);letter-spacing:.02em}
#titleCard .tag2{font-size:clamp(14px,2.4vw,22px);margin:14px 0 26px}
#titleCard .hint{font-family:system-ui,sans-serif;font-weight:700;font-size:13px;opacity:.9;margin-top:18px;line-height:1.6}
#titleBest{font-size:14px;margin-top:10px;opacity:.9}
.panel{background:rgba(42,28,52,.88);border:3px solid var(--line);border-radius:22px;padding:22px 26px;max-width:min(560px,92vw);max-height:90vh;overflow:auto}
.panel h2{margin:0 0 12px;font-size:30px}
.row{display:flex;align-items:center;gap:12px;margin:10px 0;font-family:system-ui,sans-serif;font-weight:700}
.row label{width:150px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row select{flex:1;font:inherit;padding:4px;border-radius:8px}
.keys{font-family:system-ui,sans-serif;font-size:13px;line-height:1.7;opacity:.9;margin:12px 0}
#endStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px;text-align:center}
#endStats div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px}

#endStats span{font-size:11px;letter-spacing:.1em;opacity:.85}
#ate{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 16px;font-family:system-ui,sans-serif;font-weight:800;font-size:14px}
#ate span{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 9px}
#endBest{font-size:13px;opacity:.85;margin-bottom:14px}
#endTitle{font-size:clamp(30px,6vw,52px)!important;color:#fff}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;width:var(--sk,130px);height:var(--sk,130px);margin:calc(var(--sk,130px) / -2) 0 0 calc(var(--sk,130px) / -2);border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(40,30,50,.28)}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#stickGhost{position:absolute;width:var(--sk,130px);height:var(--sk,130px);border-radius:50%;border:3px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;letter-spacing:.08em;color:#fff;opacity:.8;transition:opacity .4s;pointer-events:none}
#stickGhost.used{opacity:.22}#stickGhost.used span{display:none}
.tbtn{position:absolute;width:84px;height:84px;border-radius:50%;background:rgba(255,207,63,.88);color:#3a2108;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;letter-spacing:.06em;pointer-events:auto;border:3px solid rgba(255,255,255,.65);box-shadow:0 3px 10px rgba(0,0,0,.25);overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
.tbtn b{font-size:1.9em;line-height:1}.tbtn.down{transform:scale(.92);filter:brightness(1.15)}
.tbtn .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.45) var(--p,0%),transparent 0);pointer-events:none}
#tFling{background:rgba(255,120,80,.88)}#tFling.empty{opacity:.45}
#tPause{right:max(14px,env(safe-area-inset-right));top:170px;width:48px;height:48px;font-size:18px;background:rgba(40,30,50,.55);color:#fff}
#debug{position:fixed;left:8px;top:120px;font:12px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.6);color:#9f9;padding:6px 9px;border-radius:6px;white-space:pre;pointer-events:none;text-shadow:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:#f3d9a6;color:#3a2108}
@media (max-width:640px){#minimap{width:92px;height:92px}#tc{left:max(14px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 84px);transform:none;text-align:left}#nextBox{display:none}#tl{width:56vw}
  #bc{width:calc(100vw - 32px)}#surgeBox{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 66px)}}

/* ---- Stage 2 UI ---- */
body.touch #surgeBox{display:none}
body.touch #powersHud{transform:none;left:0;top:0;right:auto;bottom:auto;width:100%;height:100%;display:block;pointer-events:none}

@media (max-width:640px){body.touch #bc{width:calc(100vw - 32px)}#tc{left:auto!important;right:max(14px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 146px)!important;text-align:right!important}}
.mono{font-family:ui-monospace,Menlo,monospace}
#ui{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;pointer-events:auto;background:rgba(30,20,40,.35);padding:max(14px,env(safe-area-inset-top)) 12px 30px}
#ui.clear{background:transparent}
#uiBox{width:min(1100px,100%);margin-top:10px}
.uhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.uhead h2{margin:0;font-size:clamp(26px,4vw,40px);flex:1;color:#fff;-webkit-text-stroke:1.5px #3a2108;text-shadow:0 4px 0 #3a2108}
.pts{background:rgba(42,28,52,.85);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:18px;color:var(--accent)}
.card{background:rgba(42,28,52,.88);border:3px solid var(--line);border-radius:18px;padding:14px;color:var(--ink)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g6{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.btn{font:inherit;font-size:16px;color:#3a2108;background:var(--accent);border:0;border-bottom:4px solid #c98d12;padding:9px 16px;border-radius:12px;cursor:pointer}
.btn.small{font-size:13px;padding:6px 10px;border-bottom-width:3px}
.btn.ghost{background:rgba(255,255,255,.16);color:var(--ink);border-bottom-color:rgba(0,0,0,.3)}
.btn.red{background:#ff7a5e;border-bottom-color:#b84a33}
.btn:disabled{opacity:.4;cursor:default}
.glow{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(255,207,63,0)}to{box-shadow:0 0 22px rgba(255,207,63,.95)}}
.menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.menuGrid .btn{font-size:18px;padding:14px 10px}
.menuGrid .btn.big{grid-column:span 2;font-size:26px}
.mapCard{position:relative;cursor:pointer;padding:8px;transition:transform .12s}
.mapCard:hover{transform:translateY(-3px)}
.mapCard canvas{width:100%;aspect-ratio:1.6;border-radius:12px;display:block;background:#7bb35a}
.mapCard .nm{font-size:18px;margin-top:6px}
.mapCard .st{color:var(--accent);font-size:18px;letter-spacing:2px}
.mapCard.locked canvas{filter:grayscale(1) brightness(.5)}
.mapCard .lockTag{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:16px;background:rgba(0,0,0,.65);border-radius:10px;padding:6px 10px}
.mapCard.sel{outline:4px solid var(--accent)}
.small{font-size:12px;opacity:.85;font-family:system-ui,sans-serif;font-weight:700}
.mis{font-family:system-ui,sans-serif;font-weight:800;font-size:14px;margin:4px 0}
.mis.done{color:#9be3a8}
.upRow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px}
.upRow .nm{flex:1}
.pips{display:flex;gap:3px}.pips i{width:14px;height:8px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--accent)}
.pedia{position:relative;text-align:center;padding:6px;cursor:pointer;border-radius:12px;background:rgba(255,255,255,.06)}

.pedia.rare{outline:3px solid #ffd54a;box-shadow:0 0 14px rgba(255,213,74,.6)}
.pedia .pn{font-size:11px;font-family:system-ui,sans-serif;font-weight:800;min-height:26px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs .btn{font-size:13px;padding:6px 10px}
.tabs .btn.on{background:#fff}
.bar{height:12px;border-radius:7px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}

#split{position:fixed;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:rgba(255,255,255,.7);pointer-events:none}

.lock.cb{background:rgba(30,110,255,.85)}

function ensureGeo(T) {
  if (T.geo) return T.geo;
  T.geo = T.gen();
  if (T.rad === undefined || T.h === undefined) {
    const b = T.geo.boundingBox;
    if (T.rad === undefined) T.rad = Math.max(0.05, Math.max(Math.abs(b.min.x), Math.abs(b.max.x), Math.abs(b.min.z), Math.abs(b.max.z)) * 0.92);
    if (T.h === undefined) T.h = Math.max(0.03, b.max.y);

}

// §SCALE (render side) — world curvature for the megatier view: every object/ground material bends
// away from the camera so the continent "curves away below" at World-Eater height.
const CURVE = { value: 0 };              // 1/(2R); 0 = flat
const ORIGIN = { x: 0, z: 0 };            // floating origin: world coords are rendered relative to this
function curveMat(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uCurve = CURVE;
    sh.vertexShader = 'uniform float uCurve;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_BATCHING

      #endif
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      vec4 wpC = modelMatrix * mvPosition;
      vec3 camW = cameraPosition;
      vec2 dC = wpC.xz - camW.xz;
      wpC.y -= uCurve * dot(dC, dC);
      mvPosition = viewMatrix * wpC;
      gl_Position = projectionMatrix * mvPosition;`);
  };
  m.customProgramCacheKey = () => 'curve';
  return m;
}

const RIVER = [[-205, -840], [-170, -640], [-60, -430], [110, -250], [150, -110], [142, 40], [170, 220], [290, 420], [360, 640], [330, 860], [300, 1250]];
const LAKES = [{ x: -640, z: 470, r: 78 }, { x: 610, z: -560, r: 60 }, { x: -215, z: -915, r: 72 }];
const RING_ROADS = [232, 405, 530, 672];
const RADIALS = Array.from({ length: 8 }, (_, i) => (i * 45 + 22.5) * Math.PI / 180);
const SPOKES = Array.from({ length: 16 }, (_, i) => (i * 22.5 + 11.25) * Math.PI / 180);
const GRID_STEP = 55;
const PARKING = [];       // rectangles {x,z,w,d} (axis-aligned) — hot ground
function riverInfo(x, z) {
  let best = 1e9, bx = 0, bz = 0;
  for (let i = 0; i < RIVER.length - 1; i++) {
    const [ax, az] = RIVER[i], [cx, cz] = RIVER[i + 1];
    const dx = cx - ax, dz = cz - az, l2 = dx * dx + dz * dz;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1);
    const px = ax + dx * t, pz = az + dz * t, d = Math.hypot(x - px, z - pz);
    if (d < best) { best = d; bx = dx; bz = dz; }
  }
  return { d: best, dx: bx, dz: bz };
}
const riverHalfW = (x, z) => Math.hypot(x, z) < 420 ? 19 : 15;
function pcWater(x, z) {
  for (const l of LAKES) if ((x - l.x) ** 2 + (z - l.z) ** 2 < l.r * l.r) return true;
  return riverInfo(x, z).d < riverHalfW(x, z);
}
function angDist(a, b) { let d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; }

  if (d < 250) { BENCH.dwell = (BENCH.dwell || 0) + 1 / 60; if (BENCH.dwell > 4) { BENCH.ti++; BENCH.dwell = 0; } }
  return { x: dx / d, z: dz / d, surge: false, fling: false, aim: { x: dx, z: dz }, powers: [false, false] };
}
function benchTick(raw) {
  if (GS.mode !== 'play') return;
  BENCH.t += raw; if (BENCH.t < BENCH.warm) return;
  BENCH.frames.push(raw * 1000);
  if (BENCH.ti >= BENCH.targets.length || BENCH.t > 80) {
    BENCH.on = false; const f = BENCH.frames.slice().sort((a, b) => a - b), avg = f.reduce((a, b) => a + b, 0) / f.length;
    const res = { frames: f.length, avgMs: +avg.toFixed(2), p95Ms: +f[Math.floor(f.length * 0.95)].toFixed(2), worstMs: +f[f.length - 1].toFixed(2), avgFps: +(1000 / avg).toFixed(1), citiesCrossed: BENCH.ti, seconds: +BENCH.t.toFixed(1) };
    window.BENCH_RESULT = res; console.log('BENCH continent', JSON.stringify(res));
    banner(`BENCH: ${res.avgFps} fps`, `avg ${res.avgMs} ms · p95 ${res.p95Ms} ms · worst ${res.worstMs} ms`, true);
  }
}
const dbg = {
  sim: simRun,
  sims(n = 3, seconds = 300, mapId = 'pinecrest') { return Array.from({ length: n }, (_, i) => simRun(seconds, i + 1, [0.75, 0.85, 0.65][i % 3], mapId)); },
  map(id) { startMode('map', { mapId: id }); }, mode(m, o = {}) { startMode(m, o); },
  tier(n) { const H1 = STORMS.find(s => s.human); if (H1) setTierFor(H1, n); },
  grant(n = 1000) { SAVE.points += n; writeSave(); },
  spawn(id) { const T = TYPES[id], H1 = STORMS.find(s => s.human); if (!T || !H1) return 'unknown type'; ensureGeo(T); bindStorm(H1); const sp = Math.hypot(P.vx, P.vz) || 1, d = pullR() * 1.6 + T.rad + 4; const o = makeObj(T, P.x + P.vx / sp * d, P.z + (P.vz / sp || -1) * d, 0, 1, new THREE.Color(T.cols[0]).getHex(), T.tier + 0.1); addObj(o); return o; },
  spawnRare() { return dbg.spawn((MAPDEF && MAPDEF.rare) || 'goldencow'); },
  bench: startBench, advance(sec, inp = { x: 0, z: -1 }) { const dt = 1 / 30; for (let t = 0; t < sec; t += dt) { GS.realTime += dt; if (GS.slowT > 0) GS.slowT -= dt; step(dt, dt, Object.assign({ surge: false, fling: false, aim: inp, powers: [false, false] }, inp)); updateParticles(dt); for (const s of STORMS) { bindStorm(s); updateFunnelVisual(dt); } updateSkirt(dt); updateCamera(dt); updateScale(); } updateHUD(0.016); const H1 = STORMS.find(s => s.human); return H1 && [H1.L, H1.score, H1.orb.length]; },
  get P() { return STORMS.find(s => s.human); }, Input, CONFIG, TYPES, GS, RUN, SAVE: () => SAVE, MAPS, STORMS, CONT, MEGA, _i: { renderer, scene, camera, live, step, botInput, query, pullR, liftPower, BOT, startMode, endRun, usePower },
};
window.dbg = dbg;
function applyQuality() {

  const ultra = settings.quality === 'ultra', med = settings.quality === 'medium';
  renderer.setPixelRatio(Math.min(devicePixelRatio, LOWQ ? CONFIG.perf.lowPixelRatio : ultra ? 2 : CONFIG.perf.maxPixelRatio)); renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = !LOWQ; sun.castShadow = !LOWQ;
  const sm = ultra ? 4096 : med ? 1024 : CONFIG.perf.shadowMap; if (sun.shadow.mapSize.x !== sm) { sun.shadow.mapSize.set(sm, sm); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }

  if (LOWQ || med) composer = null; else setupPost();
}
addEventListener('resize', () => { for (const c of [camera, camera2]) { c.aspect = innerWidth / innerHeight; c.updateProjectionMatrix(); } renderer.setSize(innerWidth, innerHeight); sizePost(); });

// ---- boot
$('gameTitle') && ($('gameTitle').textContent = GAME_TITLE); document.title = GAME_TITLE;
loadSave(); applyQuality();
goMenu();
applyLook();
$('loading').classList.add('hidden');
