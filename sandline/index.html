<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SANDLINE</title>
<style>
:root{
  --ink:#2a1a12; --paper:#efe0c0; --paper2:#e2cc9c; --rust:#d9692b; --rust2:#a8431a; --sun:#ffc35a;
  --teal:#38c7c0; --teal2:#1d8c88; --red:#e0412f; --green:#8fd16a; --hud:#fff4dc; --hudDim:rgba(255,244,220,.55);
  --shadow:0 2px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140d09;color:var(--hud);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hudRoot,#ui,#fade,#letterbox{position:fixed;inset:0;pointer-events:none}
#ui{pointer-events:none;z-index:20}
#ui .panel,#ui .menu,#ui button,#ui input,#ui textarea,#ui select,#ui .clickable{pointer-events:auto}
.mono{font-family:"Consolas","Courier New",monospace}
.slab{font-family:"Rockwell","Roboto Slab","Georgia",serif;letter-spacing:.04em}
/* ---------- HUD ---------- */
.hud{position:absolute;overflow:hidden;text-shadow:var(--shadow)}
.hud .speedo{position:absolute;right:22px;bottom:18px;text-align:right}
.hud .speedo .v{font:700 64px/1 "Consolas","Courier New",monospace;letter-spacing:-2px}
.hud .speedo .u{font-size:14px;opacity:.75;margin-left:4px}
.hud .bars{position:absolute;right:22px;bottom:92px;width:230px}
.bar{height:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,244,220,.35);margin-top:5px;position:relative;transform:skewX(-18deg)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width .08s}
.bar.boost>i{background:linear-gradient(90deg,#3a8cff,#9fe0ff)}
.bar.hp>i{background:linear-gradient(90deg,#d23a2a,#ffb347)}
.bar.fuel>i{background:linear-gradient(90deg,#c9a227,#f4e27a)}
.bar.drift>i{background:linear-gradient(90deg,#ff7b2a,#ffe25a)}
.barlbl{font-size:11px;opacity:.8;display:flex;justify-content:space-between;margin-top:6px;letter-spacing:.12em}
.hud .compass{position:absolute;top:10px;left:50%;width:min(520px,70%);height:30px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.45) 15%,rgba(0,0,0,.45) 85%,transparent);overflow:hidden;border-bottom:1px solid rgba(255,244,220,.25)}
.hud .compass .tick{position:absolute;top:4px;font:700 13px "Consolas",monospace;transform:translateX(-50%)}
.hud .compass .mk{position:absolute;top:0;width:0;height:0;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--rust)}
.hud .compass .mk.town{border-top-color:var(--teal)}
.hud .compass .mk.area{border-top-color:#f4d35e}
.hud .compass .mk.wp{border-top-color:#ffb040}
.hud .compass .mk.cap{border-top-color:#fff;border-top-width:14px}
.hud .compass .capv{position:absolute;left:50%;top:30px;transform:translateX(-50%);font:700 14px "Consolas",monospace;background:rgba(0,0,0,.5);padding:0 6px}
.hud .compass .mk.rival{border-top-color:#9aa7ff}
.hud .compass .center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--hud);opacity:.8}
.hud .radio{position:absolute;left:18px;top:52px;max-width:360px;display:none;background:rgba(20,12,8,.72);border:1px solid rgba(255,195,90,.5);padding:8px 10px 8px 64px;min-height:58px;font-size:14px}
.hud .radio canvas{position:absolute;left:6px;top:6px;width:50px;height:50px;border:1px solid rgba(255,255,255,.3);image-rendering:pixelated}
.hud .radio .who{font:700 12px "Rockwell","Georgia",serif;color:var(--sun);letter-spacing:.08em}
.hud .radio .txt{font-style:italic}
.hud .radio.static{animation:crackle .12s steps(2) 3}
@keyframes crackle{50%{filter:contrast(2) brightness(1.5);transform:translateX(1px)}}
.hud .prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,12,8,.7);padding:6px 14px;border:1px solid var(--sun);font-size:15px;display:none;white-space:nowrap}
.hud .prompt kbd,.kbd{display:inline-block;padding:0 6px;border:1px solid var(--hud);border-radius:3px;margin-right:6px;font:700 13px "Consolas",monospace}
.hud .notes{position:absolute;left:50%;top:64px;transform:translateX(-50%);text-align:center;width:80%}
.hud .note{font:700 20px "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);animation:notein 3.2s forwards}
.hud .note.big{font-size:38px;color:#fff}
.hud .note.bad{color:#ff7a5c}
.hud .note.good{color:var(--green)}
@keyframes notein{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.hud .minimap{position:absolute;right:18px;top:52px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,244,220,.5);overflow:hidden;background:#000}
.hud .minimap canvas{width:100%;height:100%}
.hud .dmg{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(220,40,20,.5));opacity:0;transition:opacity .3s}
.hud .speedlines{position:absolute;inset:0;opacity:0}
.hud .stateTag{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;opacity:.8}
.hud .scoreline{position:absolute;left:50%;top:40px;transform:translateX(-50%);font:700 14px "Consolas",monospace;color:var(--sun)}
.hud .clock{position:absolute;left:50%;top:58px;transform:translateX(-50%);font:700 26px "Consolas",monospace;display:none;white-space:nowrap}
.hud .clock .pen{color:#ff7a5c;font-size:18px;margin-left:8px}
.hud .clock .pos{color:var(--sun);font-size:16px;margin-left:10px}
.hud .notes{top:100px}
.hud .zone{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font:700 15px "Consolas",monospace;color:var(--sun);background:rgba(20,12,8,.65);padding:3px 12px;border:1px solid rgba(255,195,90,.6);display:none;white-space:nowrap}
.hud .focusfx{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(10,5,0,.75));opacity:0;pointer-events:none}
.hud .dustfx{position:absolute;inset:0;background:rgba(190,150,100,.0);pointer-events:none}
.hud .foot{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:14px;display:none;background:rgba(0,0,0,.5);padding:4px 10px}
#letterbox::before,#letterbox::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#letterbox::before{top:0}#letterbox::after{bottom:0}
#letterbox.on::before,#letterbox.on::after{height:11vh}
#cine{position:fixed;left:0;right:0;bottom:13vh;text-align:center;pointer-events:none;z-index:15;display:none}
#cine .t{font:700 54px "Rockwell","Georgia",serif;color:#fff;letter-spacing:.08em;text-shadow:0 3px 0 #000,0 0 30px rgba(217,105,43,.8)}
#cine .s{font:italic 20px Georgia,serif;color:var(--sun);text-shadow:0 2px 0 #000}
#fade{background:#000;opacity:0;transition:opacity .45s;z-index:30}
#fade.on{opacity:1}
#split{position:fixed;background:#000;z-index:5;display:none}
/* ---------- KART HUD (circuit races) ---------- */
.hud.kart .compass,.hud.kart .clock,.hud.kart .stateTag,.hud.kart .bars .hpw{display:none}
.hud .k{display:none}.hud.kart .k{display:block}
.hud .kitem{position:absolute;left:18px;top:16px;width:104px;height:104px;border-radius:18px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.22),rgba(20,12,8,.78));border:4px solid #ffc35a;box-shadow:0 0 0 3px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.5)}
.hud .kitem canvas{position:absolute;left:4px;top:4px;width:88px;height:88px}
.hud .kitem .n{position:absolute;right:-8px;bottom:-10px;font:900 26px "Rockwell",Georgia,serif;color:#fff;-webkit-text-stroke:2px #000}
.hud .kitem .key{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font:700 11px Verdana;opacity:.8;white-space:nowrap}
.hud .kitem.roll{animation:kroll .12s steps(2) infinite}
@keyframes kroll{50%{border-color:#fff}}
.hud .kitem.got{animation:kgot .4s}
@keyframes kgot{0%{transform:scale(1.35)}100%{transform:none}}
.hud .kpos{position:absolute;right:26px;bottom:16px;font:italic 900 96px/1 "Rockwell",Georgia,serif;color:#fff;-webkit-text-stroke:4px #1a0e08;text-shadow:0 6px 0 rgba(0,0,0,.5)}
.hud .kpos sup{font-size:40px;vertical-align:top;margin-left:2px}
.hud .kpos.p1{color:#ffd84a}.hud .kpos.p2{color:#e8eef4}.hud .kpos.p3{color:#e89a5a}
.hud .kpos.pop{animation:kpop .35s}
@keyframes kpop{0%{transform:scale(1.4)}100%{transform:none}}
.hud .klap{position:absolute;right:20px;top:14px;text-align:right;font:900 30px "Rockwell",Georgia,serif;-webkit-text-stroke:1.5px #000}
.hud .klap small{display:block;font:700 18px "Consolas",monospace;-webkit-text-stroke:0;margin-top:2px}
.hud .klap i{display:block;font:12px "Consolas",monospace;opacity:.85;font-style:normal;-webkit-text-stroke:0}
.hud.kart .radio{left:140px;top:14px;max-width:min(420px,40%)}
.hud.kart .minimap{top:104px;border-radius:12px;background:rgba(10,6,4,.55)}
.hud .kboard{position:absolute;left:18px;top:150px;width:190px}
.hud .kboard div{display:flex;align-items:center;gap:6px;height:24px;margin-bottom:3px;padding-right:6px;background:linear-gradient(90deg,rgba(20,12,8,.75),rgba(20,12,8,.2));font:700 13px Verdana;white-space:nowrap;overflow:hidden;transition:transform .25s}
.hud .kboard div b{width:22px;text-align:center;font:900 15px "Rockwell",Georgia,serif;color:var(--sun)}
.hud .kboard div canvas{width:22px;height:22px;border:1px solid rgba(255,255,255,.4)}
.hud .kboard div.me{background:linear-gradient(90deg,rgba(217,105,43,.95),rgba(217,105,43,.25))}
.hud .kboard div.hit{animation:khit .5s}
@keyframes khit{50%{background:#e0412f}}
.hud .kbanner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:italic 900 72px "Rockwell",Georgia,serif;color:#fff;-webkit-text-stroke:3px #1a0e08;text-shadow:0 6px 0 rgba(0,0,0,.45);white-space:nowrap;pointer-events:none;opacity:0}
.hud .kbanner.on{animation:kban 1.4s forwards}
.hud .kbanner.count{font-size:140px;color:#ffd84a}.hud .kbanner.go{font-size:130px;color:#8fd16a}.hud .kbanner.final{color:#ff7a5c}.hud .kbanner.warn{color:#ff5a3a;font-size:46px}.hud .kbanner.title{font-size:54px;color:var(--sun)}.hud .kbanner.lap{font-size:60px}
@keyframes kban{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
.hud .kdust{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at 30% 40%,rgba(120,80,40,.92) 0 14%,transparent 15%),radial-gradient(circle at 62% 55%,rgba(140,95,50,.9) 0 18%,transparent 19%),radial-gradient(circle at 45% 70%,rgba(110,75,40,.88) 0 12%,transparent 13%),radial-gradient(circle at 75% 30%,rgba(130,90,50,.85) 0 10%,transparent 11%)}
.hud .kwarn{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 20px rgba(255,40,20,.0);transition:box-shadow .15s}
.hud .kwarn.on{animation:kwarn .3s infinite alternate}
@keyframes kwarn{to{box-shadow:inset 0 0 70px 26px rgba(255,40,20,.55)}}
.hud.kart .speedo{right:auto;left:22px;bottom:14px;text-align:left}
.hud.kart .bars{right:auto;left:22px;bottom:86px;width:200px}
.trk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.trk .tc{background:#f6ead0;border:2px solid #8a6a44;padding:8px;cursor:pointer;position:relative}
.trk .tc:hover{filter:brightness(1.05);transform:translateY(-2px)}
.trk .tc canvas{width:100%;display:block;background:#2a1a10}
.trk .tc b{font:700 15px "Rockwell",Georgia,serif;display:block;margin-top:4px}
.trk .tc.locked{opacity:.5;cursor:default}
.cupcard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 12px}
.classes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.classes button{font:700 14px "Rockwell",Georgia,serif;padding:6px 14px;border:2px solid #5b3a20;background:#d8bf8c;cursor:pointer}
.classes button.on{background:#5b3a20;color:var(--paper)}
.classes button:disabled{opacity:.4;cursor:default}
.trophy{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;border:2px solid #3a2414;margin-left:3px}
.trophy.gold{background:#ffd84a}.trophy.silver{background:#d8dee6}.trophy.bronze{background:#d88a4a}.trophy.none{background:transparent;opacity:.35}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0}
.podium div{width:120px;text-align:center;background:#5b3a20;color:var(--paper);font:700 14px "Rockwell",Georgia,serif;padding:6px 4px}
/* ---------- PARTY / ONLINE ---------- */
.pslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.pslot{border:3px dashed #8a6a44;padding:10px;background:#f2e2c0;min-height:82px}
.pslot.on{border-style:solid;background:#fff2d4}
.pslot b{font:900 22px "Rockwell",Georgia,serif;margin-right:6px}
.pslot .pkeys{font:12px Verdana;opacity:.7;margin-top:6px}
.pslot kbd{border:1px solid #2a1a12;padding:0 6px;border-radius:3px;font:700 13px Consolas,monospace}
.hud.small .kpos{font-size:52px;right:12px;bottom:8px}.hud.small .kpos sup{font-size:22px}
.hud.small .kitem{transform:scale(.6);transform-origin:top left;left:8px;top:8px}.hud.small .kitem .key{display:none}
.hud.small .kboard{display:none}.hud.small .klap{font-size:20px;right:10px;top:8px}.hud.small .klap small{font-size:13px}.hud.small .klap i{display:none}
.hud.small .minimap{width:96px;height:96px;top:62px!important;right:8px}.hud.small .kbanner{font-size:40px}.hud.small .kbanner.count,.hud.small .kbanner.go{font-size:80px}
.hud.small .speedo .v{font-size:30px}.hud.small .bars{display:none}.hud.small .radio{display:none!important}.hud.small .notes .note{font-size:14px}.hud.small .notes .note.big{font-size:22px}
/* ---------- MENUS ---------- */
.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,20,10,.55),rgba(10,5,3,.92))}
.title{font:900 min(13vw,120px)/0.9 "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);text-shadow:0 6px 0 var(--rust2),0 12px 30px rgba(0,0,0,.8);text-align:center}
.subtitle{font:italic 20px Georgia,serif;color:var(--paper);text-align:center;margin:10px 0 28px;opacity:.85}
.btncol{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(340px,86vw);margin:0 auto}
button.b{font:700 17px "Rockwell","Georgia",serif;letter-spacing:.1em;padding:11px 18px;background:linear-gradient(#e6782f,#b14a1b);color:#fff6e4;border:2px solid #3a1d0e;box-shadow:0 4px 0 #3a1d0e;cursor:pointer;text-transform:uppercase}
button.b:hover,button.b.focus{filter:brightness(1.15);transform:translateY(-1px)}
button.b.alt{background:linear-gradient(#3a9d98,#1d6663)}
button.b.dim{background:linear-gradient(#6b5a4a,#463a2f)}
button.b:disabled{opacity:.45;cursor:default}
.paperpanel{background:var(--paper);color:var(--ink);border:3px solid #5b3a20;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:18px 22px;max-width:min(1100px,94vw);max-height:90vh;overflow:auto;position:relative}
.paperpanel h2{font:900 30px "Rockwell","Georgia",serif;letter-spacing:.06em;margin:0 0 6px;color:#5b2a12}
.paperpanel h3{font:700 18px "Rockwell","Georgia",serif;margin:14px 0 6px;color:#5b2a12}
.paperpanel .close{position:absolute;right:10px;top:8px}
.paperpanel p{margin:6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{font:700 13px "Rockwell",Georgia,serif;padding:6px 12px;background:#d8bf8c;border:2px solid #5b3a20;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#5b3a20;color:var(--paper)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.poster{cursor:pointer;transition:transform .15s;position:relative}
.poster:hover{transform:rotate(-1.2deg) scale(1.03)}
.poster canvas,.stagecard canvas{width:100%;display:block;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.poster .tag{position:absolute;right:6px;top:6px;background:#2a5;color:#fff;font:700 11px Verdana;padding:2px 6px;transform:rotate(6deg)}
.poster .tag.locked{background:#333}
.poster .tag.done{background:#777}
.dossier{display:grid;grid-template-columns:260px 1fr;gap:18px}
.dossier canvas{width:100%}
.upg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.upg .card{background:#f6ead0;border:2px solid #8a6a44;padding:8px 10px}
.upg .card b{font:700 15px "Rockwell",Georgia,serif}
.pips{display:flex;gap:3px;margin:5px 0}
.pips i{width:20px;height:8px;background:#c9b48a;border:1px solid #7a5a34}
.pips i.on{background:#d9692b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches div{width:32px;height:32px;border:3px solid #5b3a20;cursor:pointer}
.swatches div.on{outline:3px solid #000}
table.lb{border-collapse:collapse;width:100%;font-size:14px}
table.lb td,table.lb th{border-bottom:1px solid #b89a6a;padding:4px 6px;text-align:left}
table.lb tr.me{background:#f6d38f}
.news li{margin:5px 0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;font-size:13px}
.ach div{padding:5px 7px;border:1px solid #a88a5a;background:#eadbb8;opacity:.55}
.ach div.on{opacity:1;background:#f8e3a8;border-color:#5b3a20}
.trophies{display:flex;flex-wrap:wrap;gap:10px}
.trophies canvas{width:110px;height:110px;background:#3a2414;border:3px solid #5b3a20}
.help{font-size:14px;columns:2;column-gap:28px}
.help div{break-inside:avoid;margin-bottom:4px}
.money{font:700 20px "Consolas",monospace;color:#2d6a1f}
#mapPanel canvas{width:min(80vh,86vw);height:min(80vh,86vw);display:block;margin:0 auto;background:#000;cursor:crosshair}
/* ---------- DEBUG ---------- */
#debug{position:fixed;left:8px;top:8px;z-index:40;font:12px/1.35 "Consolas",monospace;background:rgba(0,0,0,.72);color:#9f9;padding:8px 10px;display:none;max-width:420px;pointer-events:auto;white-space:pre}
#debug select,#debug button,#debug input{font:11px monospace;margin:2px 2px 0 0}
#bench{position:fixed;right:8px;top:8px;z-index:41;font:13px "Consolas",monospace;background:rgba(0,0,0,.8);color:#ff9;padding:8px 12px;display:none;white-space:pre}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#140d09;z-index:50;font:700 22px "Rockwell",Georgia,serif;color:var(--sun);letter-spacing:.1em}
#loading .bar{width:300px;transform:none}
#err{position:fixed;left:0;right:0;bottom:0;background:#600;color:#fff;font:12px monospace;padding:6px;z-index:60;display:none;white-space:pre-wrap}
@media (max-width:700px){.hud .minimap{width:96px;height:96px}.hud .speedo .v{font-size:44px}.hud .bars{width:150px}.hud .kboard{display:none!important}.hud .kpos{font-size:64px}.hud .kitem{transform:scale(.8);transform-origin:top left}.dossier{grid-template-columns:1fr}.help{columns:1}}
.results td.r{text-align:right}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cards canvas{width:100%;box-shadow:0 3px 8px rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudRoot"></div>
<div id="split"></div>
<div id="letterbox"></div>
<div id="cine"><div class="t"></div><div class="s"></div></div>
<div id="ui"></div>
<div id="fade"></div>
<div id="debug"></div>
<div id="bench"></div>
<div id="loading"><div>SANDLINE</div><div class="bar" style="margin-top:14px"><i id="loadbar" style="width:5%;background:var(--rust)"></i></div><div id="loadmsg" style="font:13px Verdana;margin-top:10px;opacity:.7">painting the grid lines…</div></div>
<div id="err"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
  }
}
</script>
<script type="module">
/* =====================================================================================
   SANDLINE — single-file hoverbike circuit racer with items (converted from BOUNTY RUN)
   -------------------------------------------------------------------------------------

const MapView = {
  img: null, ext: 20000,
  build() { const N = 220; const { c, g } = makeCanvas(N, N); const img = g.createImageData(N, N); const T = {}; const cc = [0, 0, 0];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const x = (i / N - 0.5) * this.ext, z = (j / N - 0.5) * this.ext; terrainSample(x, z, T); terrainColor(x, z, T.h, T.s, T.region, 1, cc); const sh = clamp(0.7 + T.h * 0.006, 0.45, 1.3); const k = (j * N + i) * 4; img.data[k] = cc[0] * 255 * sh; img.data[k + 1] = cc[1] * 255 * sh; img.data[k + 2] = cc[2] * 255 * sh; img.data[k + 3] = 255; }
    g.putImageData(img, 0, 0); this.img = c; },
  draw(c) { const g = c.getContext('2d'); const W = c.width; g.imageSmoothingEnabled = true; g.drawImage(this.img, 0, 0, W, W); const tx = (x) => (x / this.ext + 0.5) * W;
    g.strokeStyle = 'rgba(40,30,25,.6)'; g.lineWidth = 2; g.beginPath(); MONO.pts.forEach((p, i) => (i ? g.lineTo(tx(p[0]), tx(p[1])) : g.moveTo(tx(p[0]), tx(p[1])))); g.stroke();
    g.font = '700 13px Georgia'; g.textAlign = 'center';
    for (const r of REG) { g.fillStyle = 'rgba(42,26,16,.55)'; g.fillText(r.name.toUpperCase(), tx(r.cx), tx(r.cz) - 40); }
    for (const t of TOWNS) { g.fillStyle = G.save.visited[t.id] ? '#38c7c0' : '#777'; g.beginPath(); g.arc(tx(t.x), tx(t.z), 7, 0, TAU); g.fill(); g.fillStyle = '#1a1008'; g.fillText(t.name, tx(t.x), tx(t.z) + 20); }
    for (const h of CAMPS) { g.fillStyle = '#' + TEAMS[h.team].color.toString(16).padStart(6, '0'); g.fillRect(tx(h.x) - 5, tx(h.z) - 5, 10, 10); g.fillStyle = '#1a1008'; g.font = '11px Georgia'; g.fillText(h.name, tx(h.x), tx(h.z) + 16); }
    for (const t of TRACKS) { const pl = Track.placeCache[t.id]; if (!pl) continue; g.fillStyle = '#e8803a'; g.beginPath(); g.arc(tx(pl.cx), tx(pl.cz), 5, 0, TAU); g.fill(); g.fillStyle = '#5a2a10'; g.font = 'italic 11px Georgia'; g.fillText(t.name, tx(pl.cx), tx(pl.cz) - 8); }
    for (const p of G.players) { g.fillStyle = p.idx ? '#9aa7ff' : '#fff'; g.beginPath(); g.arc(tx(p.bike.pos.x), tx(p.bike.pos.z), 5, 0, TAU); g.fill(); g.strokeStyle = '#000'; g.stroke(); } },
};

// §SAVE ------------------------------------------------------------------------------------
// v3 is SANDLINE's save (circuit career: cup trophies per class, track records, a cup in progress). A BOUNTY RUN save
// (bountyrun.save.v2) can be carried over once: credits → prize money, upgrades + paint/decal/frames carry over
// (sidearm → nitro injectors, net launcher → targeting), hunter rank →
// starting reputation, legend trophies → frontier-legend cosmetics. Everything else stays behind; the old save
// is never modified.
const SAVE_KEY = 'sandline.save.v3', SETTINGS_KEY = 'sandline.settings', LEGACY_KEY = 'bountyrun.save.v2';
const BR_RANK = { titles: ['Greenhorn', 'Dust Tracker', 'Sand Hound', 'Hunter', 'Veteran Hunter', 'Marshal-for-Hire', 'Frontier Legend', 'Living Myth'], thresholds: [0, 120, 320, 650, 1100, 1800, 2800, 4200] };
const BR_LEGEND_MAP = { mora: ['mora'], twins: ['ash', 'cinder'], ironjaw: ['ironjaw'], vesper: ['vesper'], preacher: ['preacher'], dust: ['dust'], hangfire: ['hangfire'], tide: ['tide'], gale: ['gale'], copperhead: ['copperhead'] };
function defaultSave() {
  const upgrades = {}; for (const k in CONFIG.upgrades) upgrades[k] = 0;
  return { v: 3, name: 'You', prize: CONFIG.economy.startPrize, rep: 0, upgrades, frame: 'drifter', frames: ['drifter'], paint: 'rust', decal: 'none', tuning: { stiffness: 1, gearing: 1, boostMap: 1 }, team: null,
    cups: {}, trackBest: {}, cupRun: null, legends: {}, cosmetics: [], wear: [], rivals: {}, visited: { dustwater: true }, ach: {}, stats: {},
    news: ['The circuit season opens in Dustwater. Race Control has the cups.'], time: CONFIG.day.start, pos: null, migrated: null };
}
const Save = {
  exists() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } },
  legacyExists() { try { return !!localStorage.getItem(LEGACY_KEY); } catch (e) { return false; } },
  reset() { G.save = defaultSave(); },
  load() { try { const t = localStorage.getItem(SAVE_KEY); if (t) G.save = this.migrate(JSON.parse(t)); else this.reset(); } catch (e) { console.warn('save load failed', e); this.reset(); } },
  // fill fields added since the save was written (forward-compatible within v3)
  migrate(s) { if (!s || s.v !== 3) return s && s.credits !== undefined ? this.fromBountyRun(s) : defaultSave(); const d = defaultSave(); for (const k in d) if (s[k] === undefined) s[k] = d[k]; for (const k in d.upgrades) if (s.upgrades[k] === undefined) s.upgrades[k] = 0; for (const k in d.tuning) if (s.tuning[k] === undefined) s.tuning[k] = 1; return s; },
  fromBountyRun(o) {
    const s = defaultSave(); const up = o.upgrades || {}; const lv = (v) => clamp(Math.floor(+v || 0), 0, 5);
    s.prize = Math.max(0, Math.round(+o.credits || 0));
    for (const k of ['engine', 'thrusters', 'boost', 'stabilisers', 'armour']) s.upgrades[k] = lv(up[k]); s.upgrades.cooling = lv(up.sidearm); s.upgrades.filter = lv(up.net);
    s.frames = (Array.isArray(o.frames) ? o.frames : []).filter((f) => CONFIG.frames[f]); if (!s.frames.includes('drifter')) s.frames.unshift('drifter'); s.frame = s.frames.includes(o.frame) ? o.frame : 'drifter';
    s.paint = PAINTS.some((p) => p.id === o.paint) ? o.paint : 'rust'; s.decal = DECALS.some((d) => d.id === o.decal) ? o.decal : 'none';
    let ri = 0; BR_RANK.thresholds.forEach((t, i) => { if ((+o.xp || 0) >= t) ri = i; }); s.rep = CONFIG.rep.thresholds[ri];
    const got = []; for (const id in (o.legends || {})) if (o.legends[id] && BR_LEGEND_MAP[id]) got.push(...BR_LEGEND_MAP[id]); if (o.mostWantedCaught) got.push('cartographer');
    s.cosmetics = [...new Set(got)];
    s.migrated = { credits: s.prize, rankTitle: BR_RANK.titles[ri], rep: s.rep, legends: s.cosmetics.map((id) => LEGENDS.find((l) => l.id === id)?.cosmetic.name).filter(Boolean) };
    s.news.push('A former bounty hunter has signed up for the circuit. The grid is nervous.'); return s;
  },
  migrateLegacy() { try { const o = JSON.parse(localStorage.getItem(LEGACY_KEY)); G.save = this.fromBountyRun(o || {}); this.save(); } catch (e) { console.warn('migration failed', e); this.reset(); } },
  snapshot() { const s = G.save; const P = G.players[0]; if (P && !G.benchMode && !Circuit.on) { s.time = Sky.dayT; s.pos = { x: P.bike.pos.x, z: P.bike.pos.z, yaw: P.bike.yaw() }; } return s; },
  save() { if (G.benchMode || !G.save) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.snapshot())); } catch (e) { /* storage blocked or full — the game keeps running */ } },
  exportText() { return JSON.stringify(this.snapshot()); },
  importText(t) { try { const s = JSON.parse(t); if (!s || typeof s !== 'object' || (s.prize === undefined && s.credits === undefined)) return false; G.save = this.migrate(s); try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} return true; } catch (e) { return false; } },
  loadSettings() { try { const t = localStorage.getItem(SETTINGS_KEY); if (t) Object.assign(G.settings, JSON.parse(t)); } catch (e) {} },
  saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(G.settings)); } catch (e) {} },
};

    const b = P.bike; Audio.engineUpdate(P.idx, b.speed, b.ctrl.throttle, b.boosting, !b.grounded, G.coop ? (P.idx % 2 ? 0.5 : -0.5) : 0, P.onFoot);

  }
  const P0 = G.players[0]; const reg = regionAt(P0.bike.pos.x, P0.bike.pos.z); Sky.update(cdt * G.dayScale, P0.cam.cam.position, reg, Weather.stormAmt * (G.save.frame === 'tempest' ? 0.55 : 1)); Sky.fogBase = scene.fog.density;
  // nearest rival's engine
  let no = null, nd = 1e9; for (const ob of Circuit.aiBikes()) { const d = G.camDist(ob.pos); if (d < nd) { nd = d; no = ob; } } if (no && nd < 250) Audio.engineUpdate('other', no.speed, 1, no.boosting, !no.grounded, 0); else Audio.engineUpdate('other', 0, 0, false, false, 0, true);
  Audio.envUpdate(P0.bike.speed, SURF_PROPS[P0.bike.surface].hiss * (P0.bike.grounded ? 1 : 0), Weather.stormAmt);
  const fp = P0.bike.pos; sun.target.position.copy(fp); sun.position.copy(fp).addScaledVector(Sky.sunDir.y > -0.05 ? Sky.sunDir : _v1.copy(Sky.sunDir).negate(), 400);
  const tRender0 = performance.now(); G.perf.logic = (tRender0 - tLogic0) / TURBO;

function render() {

    if (usePost) { const rt = Post.rt; rt.viewport.set(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); rt.scissor.copy(rt.viewport); rt.scissorTest = G.players.length > 1; renderer.setRenderTarget(rt); }
    else { renderer.setViewport(vp.x, innerHeight - vp.y - vp.h, vp.w, vp.h); renderer.setScissor(vp.x, innerHeight - vp.y - vp.h, vp.w, vp.h); }

const titleCam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 2600); WORLD.add(titleCam); let titleT = 0;

    const $ = (s) => this.root.querySelector(s); const me = () => Circuit.racerOf(G.players[0]);
    $('#dbgStart').onclick = () => this.startRace(); $('#dbgLap').onclick = () => this.skipLap(); $('#dbgFin').onclick = () => { const r = me(); if (r) Circuit.finish(r); };
    $('#dbgAuto').onclick = () => { const r = me(); if (r) r.auto = !r.auto; };

    $('#dbgCash').onclick = () => { G.save.prize += 5000; }; $('#dbgRep').onclick = () => { const r = G.repIdx(); G.save.rep = CONFIG.rep.thresholds[Math.min(r + 1, CONFIG.rep.thresholds.length - 1)]; };
    $('#dbgUpg').onclick = () => { for (const k in CONFIG.upgrades) G.save.upgrades[k] = CONFIG.upgrades[k].max; G.applyBikeStats(); };
    $('#dbgGold').onclick = () => { for (const c of CUPS) for (const k in CLASSES) G.save.cups[c.id + ':' + k] = 'gold'; };
    $('#dbgStorm').onclick = () => { const p = G.players[0].bike.pos; Weather.spawnStorm(p.x + 300, p.z + 300, 500, 120); };
    $('#dbgWalk').onclick = () => { const P = G.players[0]; if (OnFoot.active) OnFoot.exit(); else OnFoot.enter(P); }; $('#dbgHide').onclick = () => { this.root.querySelector('div[style]').style.display = 'none'; };

// §BENCH -----------------------------------------------------------------------------------
// ?bench=race | versus | night — the player's bike on autopilot (KartAI) in a full 8-rider race with items.
// Reports average / p95 / worst frame time, hitches (frames over 50 ms or 2.5× the average), logic ms, draw calls.
const Bench = {
  mode: null, t: 0, times: [], logic: [], rend: [], calls: 0, tris: 0, warm: 3, dur: +(QS.get('dur') || CONFIG.bench.duration), done: false, el: document.getElementById('bench'),
  setup(mode) {

    Game.start(mode === 'versus', mode === 'versus'); this.el.style.display = 'block';
    Circuit.start(trackById(QS.get('track') || (mode === 'night' ? 'lastlight' : 'grandprix')), { mode: mode === 'versus' ? 'versus' : 'single', cls: 'pro' });
    const st = Circuit.st; st.phase = 'race'; st.clock = 0; Track.setLights(0, true); for (const r of st.racers) if (r.P) r.auto = true;
  },
  frame(dt) {
    if (!this.mode || G.mode !== 'play' || this.done) return; this.t += dt;
    if (this.t > this.warm) { this.times.push(dt * 1000); this.logic.push(G.perf.logic); this.rend.push(G.perf.render); this.calls = Math.max(this.calls, G.perf.calls); this.tris = Math.max(this.tris, G.perf.tris); }
    const n = this.times.length; const avg = n ? this.times.reduce((a, b) => a + b, 0) / n : 0; const worst = n ? Math.max(...this.times) : 0; const p95 = n ? [...this.times].sort((a, b) => a - b)[Math.floor(n * 0.95)] : 0; const hitches = this.times.filter((t) => t > 50 || t > avg * 2.5).length;
    const P = G.players[0]; const r = Circuit.racerOf(P);
    this.el.textContent = `BENCH ${this.mode}  t=${this.t.toFixed(1)}s\nlogic ${G.perf.logic.toFixed(2)} ms  render ${G.perf.render.toFixed(2)} ms  calls ${G.perf.calls}\navg ${avg.toFixed(2)} ms (${(1000 / (avg || 1)).toFixed(0)} fps)\np95 ${(p95 || 0).toFixed(2)} ms  worst ${worst.toFixed(2)} ms  hitches ${hitches}\nspeed ${(P.bike.speed * KMH).toFixed(0)} km/h  lap ${r ? r.lap : '-'}  place ${r ? r.place : '-'}  particles ${FX.dust.alive + FX.glow.alive}`;
    if (this.t > this.warm + this.dur) { this.done = true; const mean = (a) => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
      const res = { mode: this.mode, track: Circuit.st ? Circuit.st.def.id : '', frames: n, avgMs: +avg.toFixed(2), p95Ms: +(p95 || 0).toFixed(2), worstMs: +worst.toFixed(2), hitches, avgFps: +(1000 / avg).toFixed(1), logicMs: +mean(this.logic).toFixed(2), logicWorstMs: +Math.max(...this.logic).toFixed(2), renderSubmitMs: +mean(this.rend).toFixed(2), maxDrawCalls: this.calls, maxTriangles: this.tris, lap: r ? r.lap : 0, place: r ? r.place : 0, physics: Phys.ok ? 'rapier' : 'fallback' };

  },
};

function reportError(e) { console.error(e); const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + (e && e.message) + '\n' + ((e && e.stack) || '').split('\n').slice(0, 3).join('\n'); clearTimeout(reportError.t); reportError.t = setTimeout(() => (d.style.display = 'none'), 6000); }
// ---- boot
window.addEventListener('error', (e) => { const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno; });
addEventListener('beforeunload', () => { if (G.mode === 'play') Save.save(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); Post.resize(); titleCam.aspect = innerWidth / innerHeight; titleCam.updateProjectionMatrix(); if (G.mode === 'play') Game.layout(); });
Input.onKey((code) => { if (G.mode !== 'play') return; if (code === 'Escape') { if (UI.isOpen) { if (!UI.sticky) UI.close(); } else UI.pause(); } if (code === 'KeyM' && !UI.isOpen && !G.party) UI.map(); if (code === 'F1') UI.help(); });
