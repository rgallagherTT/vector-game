<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SANDLINE</title>
<style>
:root{
  --ink:#2a1a12; --paper:#efe0c0; --paper2:#e2cc9c; --rust:#d9692b; --rust2:#a8431a; --sun:#ffc35a;
  --teal:#38c7c0; --teal2:#1d8c88; --red:#e0412f; --green:#8fd16a; --hud:#fff4dc; --hudDim:rgba(255,244,220,.55);
  --shadow:0 2px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140d09;color:var(--hud);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hudRoot,#ui,#fade,#letterbox{position:fixed;inset:0;pointer-events:none}
#ui{pointer-events:none;z-index:20}
#ui .panel,#ui .menu,#ui button,#ui input,#ui textarea,#ui select,#ui .clickable{pointer-events:auto}
.mono{font-family:"Consolas","Courier New",monospace}
.slab{font-family:"Rockwell","Roboto Slab","Georgia",serif;letter-spacing:.04em}
/* ---------- HUD ---------- */
.hud{position:absolute;overflow:hidden;text-shadow:var(--shadow)}
.hud .speedo{position:absolute;right:22px;bottom:18px;text-align:right}
.hud .speedo .v{font:700 64px/1 "Consolas","Courier New",monospace;letter-spacing:-2px}
.hud .speedo .u{font-size:14px;opacity:.75;margin-left:4px}
.hud .bars{position:absolute;right:22px;bottom:92px;width:230px}
.bar{height:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,244,220,.35);margin-top:5px;position:relative;transform:skewX(-18deg)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width .08s}
.bar.boost>i{background:linear-gradient(90deg,#3a8cff,#9fe0ff)}
.bar.hp>i{background:linear-gradient(90deg,#d23a2a,#ffb347)}
.bar.fuel>i{background:linear-gradient(90deg,#c9a227,#f4e27a)}
.bar.drift>i{background:linear-gradient(90deg,#ff7b2a,#ffe25a)}
.barlbl{font-size:11px;opacity:.8;display:flex;justify-content:space-between;margin-top:6px;letter-spacing:.12em}
.hud .compass{position:absolute;top:10px;left:50%;width:min(520px,70%);height:30px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.45) 15%,rgba(0,0,0,.45) 85%,transparent);overflow:hidden;border-bottom:1px solid rgba(255,244,220,.25)}
.hud .compass .tick{position:absolute;top:4px;font:700 13px "Consolas",monospace;transform:translateX(-50%)}
.hud .compass .mk{position:absolute;top:0;width:0;height:0;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--rust)}
.hud .compass .mk.town{border-top-color:var(--teal)}
.hud .compass .mk.area{border-top-color:#f4d35e}
.hud .compass .mk.wp{border-top-color:#ffb040}
.hud .compass .mk.cap{border-top-color:#fff;border-top-width:14px}
.hud .compass .capv{position:absolute;left:50%;top:30px;transform:translateX(-50%);font:700 14px "Consolas",monospace;background:rgba(0,0,0,.5);padding:0 6px}
.hud .compass .mk.rival{border-top-color:#9aa7ff}
.hud .compass .center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--hud);opacity:.8}
.hud .radio{position:absolute;left:18px;top:52px;max-width:360px;display:none;background:rgba(20,12,8,.72);border:1px solid rgba(255,195,90,.5);padding:8px 10px 8px 64px;min-height:58px;font-size:14px}
.hud .radio canvas{position:absolute;left:6px;top:6px;width:50px;height:50px;border:1px solid rgba(255,255,255,.3);image-rendering:pixelated}
.hud .radio .who{font:700 12px "Rockwell","Georgia",serif;color:var(--sun);letter-spacing:.08em}
.hud .radio .txt{font-style:italic}
.hud .radio.static{animation:crackle .12s steps(2) 3}
@keyframes crackle{50%{filter:contrast(2) brightness(1.5);transform:translateX(1px)}}
.hud .prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,12,8,.7);padding:6px 14px;border:1px solid var(--sun);font-size:15px;display:none;white-space:nowrap}
.hud .prompt kbd,.kbd{display:inline-block;padding:0 6px;border:1px solid var(--hud);border-radius:3px;margin-right:6px;font:700 13px "Consolas",monospace}
.hud .notes{position:absolute;left:50%;top:64px;transform:translateX(-50%);text-align:center;width:80%}
.hud .note{font:700 20px "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);animation:notein 3.2s forwards}
.hud .note.big{font-size:38px;color:#fff}
.hud .note.bad{color:#ff7a5c}
.hud .note.good{color:var(--green)}
@keyframes notein{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.hud .minimap{position:absolute;right:18px;top:52px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,244,220,.5);overflow:hidden;background:#000}
.hud .minimap canvas{width:100%;height:100%}
.hud .dmg{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(220,40,20,.5));opacity:0;transition:opacity .3s}
.hud .speedlines{position:absolute;inset:0;opacity:0}
.hud .stateTag{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;opacity:.8}
.hud .scoreline{position:absolute;left:50%;top:40px;transform:translateX(-50%);font:700 14px "Consolas",monospace;color:var(--sun)}
.hud .clock{position:absolute;left:50%;top:58px;transform:translateX(-50%);font:700 26px "Consolas",monospace;display:none;white-space:nowrap}
.hud .clock .pen{color:#ff7a5c;font-size:18px;margin-left:8px}
.hud .clock .pos{color:var(--sun);font-size:16px;margin-left:10px}
.hud .notes{top:100px}
.hud .zone{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font:700 15px "Consolas",monospace;color:var(--sun);background:rgba(20,12,8,.65);padding:3px 12px;border:1px solid rgba(255,195,90,.6);display:none;white-space:nowrap}
.hud .rb{position:absolute;right:18px;top:212px;width:300px;background:#f3ead6;color:#1a1208;border:3px solid #3a2a1a;box-shadow:0 4px 14px rgba(0,0,0,.5);text-shadow:none;display:none}
.hud .rb .trip{display:flex;justify-content:space-between;align-items:baseline;background:#1a1208;color:#ffd27a;padding:4px 8px;font:700 13px "Consolas",monospace}
.hud .rb .trip b{font-size:26px;color:#fff4dc}
.hud .rb .row{display:grid;grid-template-columns:62px 96px 1fr;border-top:2px solid #3a2a1a;height:76px;align-items:center}
.hud .rb .row.cur{background:#ffe9a8}
.hud .rb .row .km{font:700 17px "Consolas",monospace;text-align:center;line-height:1.1}
.hud .rb .row .km i{display:block;font:11px "Consolas",monospace;opacity:.7}
.hud .rb .row canvas{width:96px;height:72px;border-left:1px solid #3a2a1a;border-right:1px solid #3a2a1a}
.hud .rb .row .tx{font:700 12px Verdana;padding:0 6px;line-height:1.25}
.hud .rb .row .tx .cap{font:700 15px "Consolas",monospace;display:block}
.hud .rb.dim{filter:blur(1px) brightness(.85)}
.hud .timing{position:absolute;left:18px;top:128px;width:250px;font:12px "Consolas",monospace;background:rgba(20,12,8,.6);border-left:3px solid var(--rust);padding:5px 8px;display:none}
.hud .timing div{display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden}
.hud .timing div.me{color:var(--sun);font-weight:700}
.hud .timing div.leg{color:#c9a8ff}
.hud .timing .hdr{opacity:.7;letter-spacing:.15em;font-size:10px}
.hud .wear{position:absolute;left:18px;bottom:18px;width:230px;font-size:11px;letter-spacing:.08em}
.hud .wear .heat{height:12px;background:linear-gradient(90deg,#2a8ad8,#ffd27a 55%,#ff5a20 85%,#ff1a10);position:relative;border:1px solid rgba(255,244,220,.4);margin:3px 0 6px}
.hud .wear .heat i{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 6px #000}
.hud .wear .heat.hot{animation:hot .3s steps(2) infinite}
@keyframes hot{50%{filter:brightness(1.6)}}
.hud .wear .wb{display:grid;grid-template-columns:86px 1fr 36px;align-items:center;gap:6px;margin:2px 0}
.hud .wear .wb s{display:block;height:6px;background:rgba(0,0,0,.45);text-decoration:none;position:relative}
.hud .wear .wb s i{position:absolute;left:0;top:0;bottom:0}
.hud .wear .kits{margin-top:4px;color:var(--sun)}
.hud .drone{position:absolute;left:18px;bottom:190px;max-width:300px;font-size:13px;color:#bff7f2;display:none;background:rgba(10,30,30,.7);border:1px solid var(--teal2);padding:5px 9px;border-radius:10px 10px 10px 0}
.hud .focusfx{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(10,5,0,.75));opacity:0;pointer-events:none}
.hud .dustfx{position:absolute;inset:0;background:rgba(190,150,100,.0);pointer-events:none}
.hud .foot{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:14px;display:none;background:rgba(0,0,0,.5);padding:4px 10px}
#letterbox::before,#letterbox::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#letterbox::before{top:0}#letterbox::after{bottom:0}
#letterbox.on::before,#letterbox.on::after{height:11vh}
#cine{position:fixed;left:0;right:0;bottom:13vh;text-align:center;pointer-events:none;z-index:15;display:none}
#cine .t{font:700 54px "Rockwell","Georgia",serif;color:#fff;letter-spacing:.08em;text-shadow:0 3px 0 #000,0 0 30px rgba(217,105,43,.8)}
#cine .s{font:italic 20px Georgia,serif;color:var(--sun);text-shadow:0 2px 0 #000}
#fade{background:#000;opacity:0;transition:opacity .45s;z-index:30}
#fade.on{opacity:1}
#split{position:fixed;background:#000;z-index:5;display:none}
/* ---------- MENUS ---------- */
.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,20,10,.55),rgba(10,5,3,.92))}
.title{font:900 min(13vw,120px)/0.9 "Rockwell","Georgia",serif;letter-spacing:.06em;color:var(--sun);text-shadow:0 6px 0 var(--rust2),0 12px 30px rgba(0,0,0,.8);text-align:center}
.subtitle{font:italic 20px Georgia,serif;color:var(--paper);text-align:center;margin:10px 0 28px;opacity:.85}
.btncol{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(340px,86vw);margin:0 auto}
button.b{font:700 17px "Rockwell","Georgia",serif;letter-spacing:.1em;padding:11px 18px;background:linear-gradient(#e6782f,#b14a1b);color:#fff6e4;border:2px solid #3a1d0e;box-shadow:0 4px 0 #3a1d0e;cursor:pointer;text-transform:uppercase}
button.b:hover,button.b.focus{filter:brightness(1.15);transform:translateY(-1px)}
button.b.alt{background:linear-gradient(#3a9d98,#1d6663)}
button.b.dim{background:linear-gradient(#6b5a4a,#463a2f)}
button.b:disabled{opacity:.45;cursor:default}
.paperpanel{background:var(--paper);color:var(--ink);border:3px solid #5b3a20;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:18px 22px;max-width:min(1100px,94vw);max-height:90vh;overflow:auto;position:relative}
.paperpanel h2{font:900 30px "Rockwell","Georgia",serif;letter-spacing:.06em;margin:0 0 6px;color:#5b2a12}
.paperpanel h3{font:700 18px "Rockwell","Georgia",serif;margin:14px 0 6px;color:#5b2a12}
.paperpanel .close{position:absolute;right:10px;top:8px}
.paperpanel p{margin:6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{font:700 13px "Rockwell",Georgia,serif;padding:6px 12px;background:#d8bf8c;border:2px solid #5b3a20;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#5b3a20;color:var(--paper)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.poster{cursor:pointer;transition:transform .15s;position:relative}
.poster:hover{transform:rotate(-1.2deg) scale(1.03)}
.poster canvas,.stagecard canvas{width:100%;display:block;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.poster .tag{position:absolute;right:6px;top:6px;background:#2a5;color:#fff;font:700 11px Verdana;padding:2px 6px;transform:rotate(6deg)}
.poster .tag.locked{background:#333}
.poster .tag.done{background:#777}
.dossier{display:grid;grid-template-columns:260px 1fr;gap:18px}
.dossier canvas{width:100%}
.upg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.upg .card{background:#f6ead0;border:2px solid #8a6a44;padding:8px 10px}
.upg .card b{font:700 15px "Rockwell",Georgia,serif}
.pips{display:flex;gap:3px;margin:5px 0}
.pips i{width:20px;height:8px;background:#c9b48a;border:1px solid #7a5a34}
.pips i.on{background:#d9692b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches div{width:32px;height:32px;border:3px solid #5b3a20;cursor:pointer}
.swatches div.on{outline:3px solid #000}
table.lb{border-collapse:collapse;width:100%;font-size:14px}
table.lb td,table.lb th{border-bottom:1px solid #b89a6a;padding:4px 6px;text-align:left}
table.lb tr.me{background:#f6d38f}
.news li{margin:5px 0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;font-size:13px}
.ach div{padding:5px 7px;border:1px solid #a88a5a;background:#eadbb8;opacity:.55}
.ach div.on{opacity:1;background:#f8e3a8;border-color:#5b3a20}
.trophies{display:flex;flex-wrap:wrap;gap:10px}
.trophies canvas{width:110px;height:110px;background:#3a2414;border:3px solid #5b3a20}
.help{font-size:14px;columns:2;column-gap:28px}
.help div{break-inside:avoid;margin-bottom:4px}
.money{font:700 20px "Consolas",monospace;color:#2d6a1f}
#mapPanel canvas{width:min(80vh,86vw);height:min(80vh,86vw);display:block;margin:0 auto;background:#000;cursor:crosshair}
/* ---------- DEBUG ---------- */
#debug{position:fixed;left:8px;top:8px;z-index:40;font:12px/1.35 "Consolas",monospace;background:rgba(0,0,0,.72);color:#9f9;padding:8px 10px;display:none;max-width:420px;pointer-events:auto;white-space:pre}
#debug select,#debug button,#debug input{font:11px monospace;margin:2px 2px 0 0}
#bench{position:fixed;right:8px;top:8px;z-index:41;font:13px "Consolas",monospace;background:rgba(0,0,0,.8);color:#ff9;padding:8px 12px;display:none;white-space:pre}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#140d09;z-index:50;font:700 22px "Rockwell",Georgia,serif;color:var(--sun);letter-spacing:.1em}
#loading .bar{width:300px;transform:none}
#err{position:fixed;left:0;right:0;bottom:0;background:#600;color:#fff;font:12px monospace;padding:6px;z-index:60;display:none;white-space:pre-wrap}
@media (max-width:700px){.hud .minimap{width:96px;height:96px}.hud .speedo .v{font-size:44px}.hud .bars{width:150px}.hud .rb{width:230px;top:160px;transform:scale(.8);transform-origin:top right}.hud .timing{display:none!important}.dossier{grid-template-columns:1fr}.help{columns:1}}
.results td.r{text-align:right}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cards canvas{width:100%;box-shadow:0 3px 8px rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudRoot"></div>
<div id="split"></div>
<div id="letterbox"></div>
<div id="cine"><div class="t"></div><div class="s"></div></div>
<div id="ui"></div>
<div id="fade"></div>
<div id="debug"></div>
<div id="bench"></div>
<div id="loading"><div>SANDLINE</div><div class="bar" style="margin-top:14px"><i id="loadbar" style="width:5%;background:var(--rust)"></i></div><div id="loadmsg" style="font:13px Verdana;margin-top:10px;opacity:.7">marking the roadbook…</div></div>
<div id="err"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
  }
}
</script>
<script type="module">
/* =====================================================================================
   SANDLINE — single-file hoverbike rally raid (converted from BOUNTY RUN)
   -------------------------------------------------------------------------------------
   MANIFEST (search for the anchor to jump to a system)
   §CONFIG      every tunable in one object
   §UTIL        math helpers, seeded RNG, simplex noise, canvas helpers
   §ASSETS      optional Claude Design assets from design/ (manifest.json) + procedural fallback
   §MODELS      optional GLB bikes / Pip from design/ (wear-state variants: intact / worn / failed)
   §AUDIO       Web Audio: engines, sfx synth, radio crackle, co-driver callouts, adaptive score
   §INPUT       keyboard / mouse / gamepad, per-player action maps (P1, P2)
   §PHYS        Rapier wrapper (+ pure-JS fallback integrator if Rapier fails to load)
   §TERRAIN     heightfield sampling, surfaces (incl. bulldust), slot canyons, flatten zones
   §REGIONS     the five regions (Ashfall Basin, Glass Flats, Redrock Maze, Scrapsea, Storm Belt)
   §LANDMARKS   arches, highway, starship, wind farm, oasis, refuel stops
   §RENDER      renderer, sky, lights, post (heat haze / mirage), FLOATING ORIGIN, chunk streaming + LOD
   §TOWN        race hubs: Dustwater, Prism, Hangman's Gap, Rustharbor, Last Light; race control, garage
   §MONORAIL    the monorail loop (scenery)
   §FX          particles (dust, spray, smoke, sparks, flame), decals, rings, lightning
   §HOVER       hoverbike physics: four spring hover points, drive, drift, boost, jumps, wipeouts, bogging
   §BIKE        bike meshes, frames, liveries
   §WEAR        endurance: pad heat, thruster wear, sand-filter clogging, impact damage, roadside repair
   §RIDER       low-poly rider + poses
   §CAMERA      chase camera (speed FOV, drift swing, shake), start / finish cams
   §CLOTH       verlet cloth (flags + banners on the start gate and finish arch)
   §EVENTS      data-driven stage events: sandstorm, mirage, canyon collapse, stuck rival, flash flood, dust devil, heat wave
   §AI          rival racer AI: waypoint goals, terrain-read line choice, shortcuts, getting lost, breakdowns
   §FIELD       the 30-rider field, racing teams, rivalries, legendary racers, racer cards
   §CALENDAR    race calendar, events, stage generator (20–40 km routes), daily stage
   §ROUTE       route + waypoints (visible / hidden), refuel and assistance zones, reference line
   §ROADBOOK    tulip notes, distances, CAP headings, danger marks; trip meter
   §RACE        start gate, start intervals, live timing, penalties, aggregate field sim, finish, results
   §GHOST       ghost runs (best time per stage)
   §RADIO       radio chatter + race control
   §NAVDRONE    Pip, the navigation drone (scouts ahead, marks waypoints by assist level)
   §FRONTIER    weather, dust devils, town crowds, news
   §ONFOOT      walking controller (parked for the Stage 2 bivouac)
   §COOP        split-screen + head-to-head versus
   §HUD         per-player rally HUD (roadbook strip, trip meter, CAP, wear, focus, timing tower)
   §UI          menus: calendar, entry board, stage briefing, results, garage (tuning, liveries), map
   §SAVE        localStorage (try/catch) + export/import + BOUNTY RUN migration
   §ACHIEVE     achievements
   §DEBUG       ?debug=1 overlay (spawn rivals, trigger any stage event, jump to waypoint, time of day)
   §BENCH       ?bench=stage | versus | storm
   §MAIN        boot + game loop
   ===================================================================================== */
import * as THREE from 'three';

const GAME_TITLE = "SANDLINE";

// §CONFIG ------------------------------------------------------------------------------
const CONFIG = {
  seed: 1873,
  world: {
    half: 24000, chunk: 128,  // playable area ±half m (long marathon routes reach far beyond the five region centres)
    lod: [ { ring: 2, res: 32 }, { ring: 5, res: 16 }, { ring: 13, res: 8 } ],
    streamPerFrame: 4, streamBudgetMs: 2.5, propRing: 3, physRing: 1, skirt: 14, viewFar: 3200,
    originRebase: 1500,      // floating origin: re-centre the render world when the player gets this far from it
  },
    regions: {
    blend: 380,
    list: [
      { id: 'ashfall',  name: 'Ashfall Basin',  cx: 0,     cz: 0,     sky: 0xa9d0ec, fog: 0xe8c9a0, haze: 0.9 },
      { id: 'glass',    name: 'The Glass Flats', cx: 6400,  cz: 0,     sky: 0xb8e2f6, fog: 0xf2efe6, haze: 1.6 },
      { id: 'redrock',  name: 'Redrock Maze',    cx: 0,     cz: -6400, sky: 0x9ec4e4, fog: 0xd9a27c, haze: 0.8 },
      { id: 'scrapsea', name: 'The Scrapsea',    cx: -6400, cz: 0,     sky: 0xa6bccb, fog: 0xc9b8a0, haze: 0.7 },
      { id: 'storm',    name: 'The Storm Belt',  cx: 0,     cz: 6400,  sky: 0x5e5a63, fog: 0x6b5a4c, haze: 0.3 },
    ],
  },
    physics: { hz: 60, gravity: 15.5, maxSubsteps: 4, bikeDensity: 210, wallBounce: 0.25 },
    hover: {
    points: [[-0.55, -0.32, 1.05], [0.55, -0.32, 1.05], [-0.55, -0.32, -1.0], [0.55, -0.32, -1.0]],
    rideHeight: 1.0, range: 2.3, stiffness: 1.0, damping: 0.42, maxTilt: 0.45,
    uprightGround: 9.0, airLeanFwd: 0.25, airLeanBack: 0.55, airPitchRate: 4.0, airResponse: 5.0, airYawRate: 1.3,
    wipeoutDot: 0.55, wipeoutTime: 2.4, hopImpulse: 7.5, hopCooldown: 1.1, contactHard: 0.25,
  },
    bike: {

  },

function reportError(e) { console.error(e); const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + (e && e.message) + '\n' + ((e && e.stack) || '').split('\n').slice(0, 3).join('\n'); clearTimeout(reportError.t); reportError.t = setTimeout(() => (d.style.display = 'none'), 6000); }
// ---- boot
window.addEventListener('error', (e) => { const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno; });
addEventListener('beforeunload', () => { if (G.mode === 'play') Save.save(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); Post.resize(); titleCam.aspect = innerWidth / innerHeight; titleCam.updateProjectionMatrix(); if (G.mode === 'play') Game.layout(); });
Input.onKey((code) => { if (G.mode !== 'play') return; if (code === 'Escape') { if (UI.isOpen) UI.close(); else UI.pause(); } if (code === 'KeyM' && !UI.isOpen) UI.map(); if (code === 'F1') UI.help(); });
async function boot() {
  const lb = document.getElementById('loadbar'), lm = document.getElementById('loadmsg'); const step = async (pct, msg) => { lb.style.width = pct + '%'; lm.textContent = msg; await new Promise((r) => setTimeout(r, 0)); };
  Input.init(); Save.loadSettings();
  await step(10, 'loading physics…'); await Phys.init();
  await step(20, 'checking for design assets…'); await Assets.load();
  await step(30, 'painting the desert…'); buildTextures(); buildMaterials(); Post.init(); Sky.init(); Terrain.init(); FX.init(); Props.init();
  await step(45, 'raising landmarks…'); Landmarks.build();
  await step(60, 'building race hubs…'); Towns.build(); Camps.build();
  await step(70, 'laying monorail track…'); Monorail.build(); NavDrone.build(); Crowd.build();
  await step(80, 'drawing the map…'); MapView.build();
  await step(90, 'streaming terrain…'); Terrain.update([V3(TOWNS[0].x, 0, TOWNS[0].z)]); G.loading = false;
  await step(100, 'ready'); document.getElementById('loading').style.display = 'none';
  if (QS.get('debug') === '1') setTimeout(() => DebugUI.init(), 50);
  const bench = QS.get('bench');
  if (bench) Bench.setup(bench);
  else { if (Save.exists()) Save.load(); else Save.reset(); UI.title(); }
  window.SL = { setTime: (h) => { Sky.dayT = h; }, heightAt, terrainSample, regionAt, AIDrive, G, Game, Race, Route, Roadbook, Field, Calendar, StageEvents, STAGE_EVENTS, LEGENDS, RIVALS, TEAMS, Phys, UI, Bench, DebugUI, Weather, Monorail, OnFoot, Save, NavDrone, Ghost, Radio, V3, FX, Terrain, renderer, ORIGIN, WORLD, rebaseOrigin, defaultSave };
  frame();
}
boot().catch((e) => { console.error('BOOT FAIL', e); const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Boot failed: ' + (e && e.stack || e); });

</script>
