<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIJU CLASH</title>
<style>
:root{--ink:#f6eedd;--gold:#ffc23a;--red:#ff3b2f;--blue:#38b6ff;--bg:#0b0a0d;--panel:rgba(14,12,18,.82);--edge:rgba(255,194,58,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;user-select:none}
#gl{position:fixed;inset:0;display:block}
.disp{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Heavy",sans-serif;letter-spacing:.04em;text-transform:uppercase}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud.hidden,#menu.hidden,.hidden{display:none!important}
#bars{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;gap:16px}
.side{flex:1;max-width:46%;display:flex;flex-direction:column;gap:3px}
.side.r{align-items:flex-end}
.name{font-size:22px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}
.bar{position:relative;height:20px;width:100%;background:rgba(0,0,0,.6);border:2px solid var(--edge);transform:skewX(-18deg);overflow:hidden}
.side.r .bar{transform:skewX(18deg)}
.bar>i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#ffe066,#ff8a1f);transition:width .08s}
.bar>b{position:absolute;top:0;bottom:0;left:0;background:#c21d12;transition:width .6s .25s}
.side.r .bar>i,.side.r .bar>b{left:auto;right:0}
.bar.small{height:8px;border-width:1px}
.bar.small.st>i{background:#7df29b}.bar.small.en>i{background:#38b6ff}.bar.small.rg>i{background:linear-gradient(90deg,#ff3b2f,#ff00a8)}
.bar.small.rg.full{animation:pulse .4s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 4px #ff3b2f}to{box-shadow:0 0 18px #ff00a8}}
.minis{display:flex;gap:6px;font-size:12px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);display:inline-block;margin:0 2px}
.pip.on{background:var(--gold)}
#center{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center}
#timer{font-size:40px;text-shadow:0 3px 0 #000}
#banner{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:96px;color:var(--gold);text-shadow:0 6px 0 #6b1300,0 0 40px rgba(255,120,0,.8);opacity:0}
#banner.show{animation:bannerIn 2.4s ease-out forwards}
#subbanner{position:absolute;top:calc(28% + 110px);left:0;right:0;text-align:center;font-size:30px;opacity:0;text-shadow:0 3px 0 #000}
#subbanner.show{animation:bannerIn 2.4s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(2.4)}12%{opacity:1;transform:scale(.94)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.ult{font-size:13px;letter-spacing:.06em;margin-top:2px;opacity:.85}
.side .ult{transform-origin:left center}.side.r .ult{transform-origin:right center}
.ult.ready{font-size:22px;color:#ffe066;opacity:1;text-shadow:0 0 12px #ff3b2f,0 3px 0 #000;animation:ultp .45s infinite alternate}
@keyframes ultp{from{transform:scale(1)}to{transform:scale(1.05)}}
.keys{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;opacity:.9;margin-top:3px}
.side.r .keys{justify-content:flex-end}
kbd{display:inline-block;min-width:18px;padding:1px 6px;border:1px solid rgba(255,255,255,.5);border-bottom-width:3px;border-radius:4px;background:rgba(0,0,0,.55);font:600 12px system-ui,sans-serif;color:#fff;text-align:center}
#howto{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;gap:18px;flex-wrap:wrap;justify-content:center;pointer-events:none;max-width:96vw}
.howcard{background:rgba(14,12,18,.88);border:2px solid var(--edge);padding:12px 18px;min-width:250px}
.howcard h3{margin:0 0 8px;color:var(--gold);font-size:22px}
.howcard table{border-collapse:collapse;font-size:15px}.howcard td{padding:3px 10px 3px 0}.howcard tr.u td{color:#ffe066;font-weight:700}
.combo{position:absolute;top:120px;font-size:44px;color:#fff;text-shadow:0 4px 0 #b3001b;opacity:0;transition:opacity .2s}
#combo0{left:30px}#combo1{right:30px}
.combo.show{opacity:1}
#callout{position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:26px;text-shadow:0 2px 0 #000}
#toasts{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--panel);border-left:4px solid var(--gold);padding:8px 14px;font-size:14px;animation:toast 4s forwards}
@keyframes toast{0%{opacity:0;transform:translateX(40px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#helpline{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.65}
#scoreboard{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--edge);padding:20px 34px;min-width:360px;text-align:center}
#frameData{position:absolute;left:16px;bottom:60px;font:12px monospace;background:rgba(0,0,0,.6);padding:6px 10px;white-space:pre}
#trainPanel{position:absolute;right:16px;top:120px;width:300px;background:var(--panel);border:1px solid var(--edge);padding:10px;font-size:13px;max-height:70vh;overflow:auto}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none}
.screen{pointer-events:auto;background:var(--panel);border:2px solid var(--edge);padding:22px 28px;max-width:94vw;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.screen.clear{background:none;border:none;box-shadow:none}
.screen h1{margin:0 0 6px;font-size:64px;color:var(--gold);text-shadow:0 5px 0 #6b1300}
.screen h2{margin:0 0 12px;font-size:34px;color:var(--gold)}
.screen h3{margin:12px 0 6px;font-size:20px}
.btn{pointer-events:auto;display:block;width:100%;margin:6px 0;padding:10px 18px;font-size:20px;background:linear-gradient(#2a2433,#1a1520);color:var(--ink);border:2px solid #4a3d55;cursor:pointer;text-align:left}
.btn.inline{display:inline-block;width:auto;margin:4px}
.btn:hover,.btn.focus{border-color:var(--gold);background:linear-gradient(#4a3216,#2b1a0c);color:#fff}
.btn.locked{opacity:.55}
.btn.small{font-size:14px;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{border:1px solid #4a3d55;padding:8px;font-size:13px;background:rgba(0,0,0,.3)}
.card.got{border-color:var(--gold)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{opacity:.7;font-size:13px}
table.k{border-collapse:collapse;font-size:13px}table.k td,table.k th{border:1px solid #3a3045;padding:3px 8px}
.selpanel{position:fixed;bottom:18px;width:44vw;max-width:560px;pointer-events:auto;background:var(--panel);border:2px solid var(--edge);padding:12px 16px}
.selpanel.p0{left:18px}.selpanel.p1{right:18px}
.selpanel .big{font-size:40px;color:var(--gold)}
.statbar{height:6px;background:#333;margin:2px 0 6px}.statbar i{display:block;height:100%;background:var(--gold)}
select,input[type=text]{background:#1a1520;color:var(--ink);border:1px solid #4a3d55;padding:6px;font-size:15px}
#debug{position:fixed;left:8px;top:120px;z-index:20;font:12px/1.35 monospace;background:rgba(0,0,0,.72);color:#9f9;padding:8px 10px;white-space:pre;pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#0b0a0d;font-size:40px;color:var(--gold)}
@media (max-width:700px){.screen h1{font-size:40px}#banner{font-size:56px}.name{font-size:15px}}
</style>

const DEBUG = {
  fps: 60, hit: [],
  key(code) {
    if (!G.debug) return false; const f0 = G.fighters[0], f1 = G.fighters[1];
    if (code === 'Backquote') { G.showHitboxes = !G.showHitboxes; this.hit.forEach(m => m.visible = G.showHitboxes); return true; }
    if (code === 'Digit1' && f0) { f0.rage = CONFIG.rageMax; f0.energy = CONFIG.energyMax; return true; }
    if (code === 'Digit2' && f1) { f1.rage = CONFIG.rageMax; f1.energy = CONFIG.energyMax; return true; }
    if (code === 'Digit9' && G.arena && G.inMatch) { const st = G.fighters.map(f => ({ p: f.pos.clone(), y: f.yaw })); loadArena(G.arena.id, G.arena.opts); G.fighters.forEach((f, i) => f.place(st[i].p, st[i].y)); HUD.callout('Buildings reset'); return true; }
    if (code === 'Digit0' && f0 && G.arena) { ['tanker', 'bus', 'container', 'ship', 'watertower', 'mast'].forEach((k, i) => { const p = makeProp(k, f0.pos.clone().addScaledVector(fwd(f0.yaw + (i - 2.5) * 0.4), 70 + (k === 'ship' ? 60 : 0)).setY(k === 'ship' ? 0 : 0)); G.arena.props.push(p); if (p.mesh) G.arena.group.add(p.mesh); }); HUD.callout('Throwables spawned'); return true; }
    if (code === 'Digit8') { PROFILE.points += 5000; saveProfile(); HUD.toast('+5000 points (debug)'); return true; }
    return false;
  },
  update(rdt) {
    if (!G.debug) return; this.fps = lerp(this.fps, 1 / Math.max(rdt, 1e-3), 0.05); const info = R.renderer.info;
    if (G.showHitboxes) this.drawHitboxes();
    $('#debug').classList.remove('hidden');
    $('#debug').textContent = `FPS ${this.fps.toFixed(0)}  draw calls ${info.render.calls}  tris ${(info.render.triangles / 1000).toFixed(0)}k\nphysics bodies ${PHYS.bodyCount()}  loose chunks ${PHYS.loose.length}  particles ${FX.alpha?.n + FX.add?.n}\nprojectiles ${G.projectiles.length}  army ${ARMY.units.length}  timeScale ${(G.slowmo ? G.slowmo.scale : 1).toFixed(2)}\n` +
      G.fighters.map(f => `P${f.slot + 1} ${f.name.padEnd(12)} ${f.state.padEnd(11)} hp ${f.hp.toFixed(0).padStart(4)} st ${f.stamina.toFixed(0).padStart(3)} en ${f.energy.toFixed(0).padStart(3)} rg ${f.rage.toFixed(0).padStart(3)}${f.out ? ' (bench)' : ''}`).join('\n') +
      `\n[\`] hitboxes  [1/2] rage P1/P2  [9] reset buildings  [0] spawn throwables  [8] +points`;
  },
  drawHitboxes() {
    while (this.hit.length < G.fighters.length * 2) { const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 16, 1, true), new THREE.MeshBasicMaterial({ color: this.hit.length % 2 ? 0xff3030 : 0x30ff60, wireframe: true })); G.scene.add(m); this.hit.push(m); }
    G.fighters.forEach((f, i) => {
      const hb = this.hit[i * 2], ab = this.hit[i * 2 + 1]; hb.visible = !f.out; hb.position.copy(f.pos).setY(f.pos.y + f.height / 2); hb.scale.set(f.radius, f.height, f.radius);
      const mv = f.move; ab.visible = !!(mv && mv.range && f.st >= (mv.startup || 0) && f.st < (mv.startup || 0) + (mv.active || 0.1));
      if (ab.visible) { const r = mv.range * f.scale; ab.position.copy(f.pos).addScaledVector(fwd(f.yaw), r * 0.5).setY(f.pos.y + f.height * (mv.h ?? 0.6)); ab.scale.set(r * 0.5, 10, r * 0.5); }
    });
  },
};
addEventListener('keydown', e => { if (DEBUG.key(e.code)) e.preventDefault(); });

const BENCH = {
  on: null, times: [], t: 0, started: false,
  start(kind) {
    this.on = kind; Audio.init();
    const cpu = (id, team, d = 'hard') => ({ id, skin: 0, ctrl: 'cpu', diff: d, team });
    let m;
    if (kind === 'rumble') m = new RumbleMatch({ kind: 'rumble', arena: 'neonkowl', players: [cpu('granitor', 0), cpu('skitterax', 1), cpu('voltwyrm', 2), cpu('pyroclast', 3)] });
    else if (kind === 'tag') m = new TagMatch({ kind: 'tag', arena: 'halcyon', players: [{ picks: ['granitor', 'bulwark9'], ctrl: 'cpu', diff: 'hard' }, { picks: ['skitterax', 'gloomwing'], ctrl: 'cpu', diff: 'hard' }] });
    else m = new VersusMatch({ kind: 'versus', arena: 'halcyon', players: [cpu('granitor', 0), cpu('skitterax', 1)] });
    m.roundsToWin = 99; m.noTimer = true; m.start(); if (kind === 'rumble' && G.arena) G.arena.weather.target = { rain: 1, snow: 0, sand: 0, storm: 0.4 };
    // keep the brawl going for the whole minute
    m.onKO = (f) => { later(() => { f.reset(); f.place(G.arena.spawnFor(f.slot), 0); f.setVisible(true); if (f.benchAlive === false) f.benchAlive = true; }, 1500); };
    if (m instanceof TagMatch) m.onKO = (f) => { later(() => { f.reset(); f.benchAlive = true; }, 1500); };
  },
  frame(rdt) {
    if (!this.on || !G.mode || G.mode.phase !== 'fight') return; this.t += rdt; this.times.push(rdt * 1000);
    if (this.t >= 60 && !this.done) {
      this.done = true; const ts = this.times.slice().sort((a, b) => a - b), avg = ts.reduce((a, b) => a + b, 0) / ts.length, worst = ts[ts.length - 1], p99 = ts[Math.floor(ts.length * 0.99)];
      const msg = `BENCH ${this.on}: ${ts.length} frames over 60s — avg ${avg.toFixed(2)} ms (${(1000 / avg).toFixed(1)} fps), p99 ${p99.toFixed(2)} ms, worst ${worst.toFixed(2)} ms`;
      console.log(msg); window.__bench = { kind: this.on, frames: ts.length, avg, p99, worst }; HUD.toast(msg); $('#debug').classList.remove('hidden'); $('#debug').textContent = msg;
    }
  },
};

// §SIM -------------------------------------------------------------------------
// Headless AI-vs-AI: no rendering, no physics bodies, fixed dt, runs as fast as the CPU allows.
const SIM = {
  arenaDef: { id: 'sim', name: 'Sim flats', radius: 640, edge: () => 'hill', look: {}, layout() { } },
  fight(a, b, swap) {
    G.fighters = []; G.projectiles = []; G.effects = []; G.time = 0;
    const fa = new Fighter(a, 0, { slot: 0, team: 0, ctrl: new AIController('normal'), noRig: true }), fb = new Fighter(b, 0, { slot: 1, team: 1, ctrl: new AIController('normal'), noRig: true });
    G.fighters = [fa, fb]; const p0 = V3(swap ? 120 : -120, 0, 0), p1 = V3(swap ? -120 : 120, 0, 0); fa.place(p0, yawTo(p0, p1)); fb.place(p1, yawTo(p1, p0));
    const dt = CONFIG.sim.dt; let t = 0;
    while (t < CONFIG.sim.maxTime) {
      t += dt; G.time = t; fa.update(dt); fb.update(dt); simPushApart(); updateProjectiles(dt); updateZones(dt);
      if (!fa.active || !fb.active) break;
    }
    if (fa.active && !fb.active) return 0; if (fb.active && !fa.active) return 1; return fa.hp / fa.maxHp >= fb.hp / fb.maxHp ? 0 : 1;
  },
  async run(n, log) {
    const ids = ROSTER_ORDER, N = ids.length, W = ids.map(() => ids.map(() => 0)), P = ids.map(() => ids.map(() => 0));
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      for (let k = 0; k < n; k++) { const w = this.fight(ids[i], ids[j], k % 2 === 1); if (w === 0) W[i][j]++; else W[j][i]++; P[i][j]++; P[j][i]++; }
      await new Promise(r => setTimeout(r, 0));
    }
    const rates = ids.map((_, i) => { let w = 0, p = 0; for (let j = 0; j < N; j++) if (j !== i) { w += W[i][j]; p += P[i][j]; } return w / p; });
    return { ids, W, P, rates };
  },
  fmt(res, title) {
    const { ids, W, P, rates } = res, nm = id => ROSTER[id].name.slice(0, 10).padEnd(10);
    let s = `${title}\n${''.padEnd(11)}${ids.map(id => ROSTER[id].name.slice(0, 6).padStart(7)).join('')}   OVERALL\n`;
    ids.forEach((a, i) => { s += nm(a) + ' ' + ids.map((b, j) => i === j ? '     — ' : ((W[i][j] / P[i][j] * 100).toFixed(0) + '%').padStart(7)).join('') + `   ${(rates[i] * 100).toFixed(1)}%\n`; });
    return s;
  },
  async main() {
    const n = +(QS.get('n') || CONFIG.sim.fights), tune = QS.get('tune') === '1', verify = +(QS.get('verify') || n * 2), out = $('#debug');
    if (QS.get('baseline') === '1') for (const k in BALANCE) BALANCE[k] = { dmg: 1, hp: 1 }; out.classList.remove('hidden'); out.style.cssText += ';top:10px;max-height:96vh;overflow:auto;pointer-events:auto';
    const log = s => { out.textContent += s + '\n'; console.log(s); };
    G.headless = true; G.arena = new Arena(this.arenaDef); G.mode = { noSetpieces: true, noArmy: true, allowRingOut: false };
    log(`KAIJU CLASH balance simulator — ${n} fights per pairing (sides swapped every other fight), AI 'normal' vs 'normal'`);
    rng = mulberry32(2024); const t0 = performance.now(); let res = await this.run(n); const before = res; log(this.fmt(res, 'BEFORE (current BALANCE)'));
    if (tune) {
      // damped multiplicative updates; stop once every monster is comfortably inside the band
      for (let it = 1; it <= 14; it++) {
        if (res.rates.every(r => r >= 0.47 && r <= 0.53)) break;
        const k = 0.9 / Math.sqrt(it);
        res.ids.forEach((id, i) => { const e = clamp(0.5 - res.rates[i], -0.25, 0.25); BALANCE[id].dmg = +(BALANCE[id].dmg * (1 + e * 0.6 * k)).toFixed(3); BALANCE[id].hp = +(BALANCE[id].hp * (1 + e * 0.35 * k)).toFixed(3); });
        rng = mulberry32(2024 + it); res = await this.run(n); log(`iteration ${it}: ` + res.rates.map((r, i) => `${ROSTER[res.ids[i]].name} ${(r * 100).toFixed(1)}%`).join(', '));
      }
      rng = mulberry32(777); res = await this.run(verify); log(this.fmt(res, `AFTER tuning — verification run, fresh seed, ${verify} fights per pairing`)); log('BALANCE = ' + JSON.stringify(BALANCE));
    }
    const ok = res.rates.every(r => r >= 0.45 && r <= 0.55); log(`${ok ? 'PASS' : 'FAIL'}: every monster within 45–55%  (${((performance.now() - t0) / 1000).toFixed(1)}s)`);
    window.__sim = { before: before.rates, after: res.rates, ok, balance: BALANCE, text: out.textContent };
  },
};
function simPushApart() { pushApart(); }
function pushApart() {
  const fs = G.fighters;
  for (let i = 0; i < fs.length; i++) for (let j = i + 1; j < fs.length; j++) {
    const a = fs[i], b = fs[j]; if (a.out || b.out || !a.active || !b.active) continue; if (a.grabbed === b || b.grabbed === a || a.state === 'rage' || b.state === 'rage') continue;
    if (Math.abs(a.pos.y - b.pos.y) > Math.max(a.height, b.height) * 0.8) continue;
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = (a.radius + b.radius) * 0.9; if (d >= min || d < 1e-3) continue;
    const push = (min - d) / 2 * CONFIG.pushApart, nx = dx / d, nz = dz / d, wa = b.weight / (a.weight + b.weight), wb = 1 - wa;
    a.pos.x -= nx * push * wa * 2; a.pos.z -= nz * push * wa * 2; b.pos.x += nx * push * wb * 2; b.pos.z += nz * push * wb * 2;
  }
}

// §MAIN ------------------------------------------------------------------------
let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now; G.realTime += rdt; G.frame++;
  MenuInput.poll(); BENCH.frame(rdt);
  if (REPLAY.playing) { REPLAY.update(rdt); FX.update(rdt * 0.55, rdt); G.arena?.update(rdt * 0.55); render(); DEBUG.update(rdt); return; }
  let ts = 1; if (G.slowmo) { G.slowmo.t += rdt; ts = G.slowmo.scale; if (G.slowmo.t >= G.slowmo.dur) G.slowmo = null; }
  R.bokeh.enabled = !!(G.slowmo && G.slowmo.dof) || CAM.mode === 'photo';
  let dt = rdt * ts; if (G.hitstop > 0) { G.hitstop -= rdt; dt = 0; } if (G.paused || G.photo) dt = 0;
  if (G.inMatch && G.mode) {
    simStep(dt, rdt);
    HUD.update(G.mode);
    if (Audio.music.on) { const lows = G.fighters.filter(f => f.active).map(f => f.hp / f.maxHp); Audio.music.intensity = clamp(1.1 - Math.min(...lows, 1) + Math.max(0, ...G.fighters.map(f => f.rage / 200)), 0.25, 1); }
  }
  FX.update(dt, rdt);
  if (G.arena) G.arena.update(G.inMatch ? dt : rdt);
  for (const f of G.fighters) f.render(dt);
  if (G.inMatch || CAM.mode !== 'static') CAM.update(rdt);
  MENU.updatePodium(rdt);
  if (R.sun && G.camera) { const L = CAM.look, sd = R.skyUniforms.sunDir.value; R.sun.position.set(L.x + sd.x * 1300, L.y + Math.max(0.15, sd.y) * 1300, L.z + sd.z * 1300); R.sun.target.position.copy(L); }
  render(); DEBUG.update(rdt);
}
function simStep(dt, rdt) {
  if (!G.paused && !G.photo) G.mode.update(dt, rdt);
  if (dt > 0 && G.inMatch) {
    G.time += dt; runTimers();
    if (G.mode.phase !== 'intro') for (const f of G.fighters) f.update(dt);
    pushApart(); updateProjectiles(dt); updateZones(dt); updateProps(dt); ARMY.update(dt); G.arena.city.update(dt); PHYS.step(dt); REPLAY.record(dt);
  }
}
function render() { R.renderer.info.reset(); R.composer.render(); }
window.__K = { G, CONFIG, BALANCE, ROSTER, ARENA_DEFS, VersusMatch, TagMatch, DerbyMatch, KothMatch, RumbleMatch, TrainingMatch, ARCADE, REPLAY, PHYS, MENU, SETPIECES, ARMY, Fighter, AIController, loadArena, SIM, PROFILE: () => PROFILE, award, resolveMonster };
// debug helper: advance n simulation steps without rendering (used by automated tests)
window.__step = (n = 30, dt = 1 / 30) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { if (!G.inMatch || !G.mode) break; if (G.slowmo) { G.slowmo.t += dt; if (G.slowmo.t >= G.slowmo.dur) G.slowmo = null; } G.hitstop = 0; simStep(dt, dt); FX.update(dt, dt); G.arena?.update(dt); for (const f of G.fighters) f.render(dt); CAM.update(dt); } return (performance.now() - t0) / n; };
async function boot() {
  loadProfile();
  if (QS.get('sim') === 'balance') { $('#loading').textContent = 'Running balance simulator…'; FX = NOOP; G.headless = true; setTimeout(() => { $('#loading').remove(); SIM.main(); }, 30); return; }
  try { await RAPIER.init(); PHYS.available = true; } catch (e) { console.warn('Rapier unavailable, debris physics off', e); }
  initRender(); FX = FXImpl; FX.init(); $('#loading').remove(); window.__G = G;
  addEventListener('pointerdown', () => { Audio.init(); Audio.resume(); }, { once: false });
  const b = QS.get('bench'); if (b) { G.debug = true; Audio.init(); BENCH.start(b); } else { loadArena('halcyon'); MENU.title(); }
  requestAnimationFrame(frame);
}
boot().catch(e => { console.error(e); const l = $('#loading'); if (l) l.textContent = 'Failed to start: ' + e.message; });
</script>
