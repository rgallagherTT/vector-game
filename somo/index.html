<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Somo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one letterboxed 9:16 play field (360×640 game units, --u = one unit in px) centred on a dark ground.
   Deliberately single-theme: an arcade cabinet looks the same on every host. */
:root{
  --bg:#1A110C; --panel:#2A1C14; --paper:#FFF7EA; --ink:#2B1B12; --ink-soft:#6E5644;
  --soil:#C4572F; --mango:#F6A623; --sun:#FFD447; --sky:#56B4E9; --leaf:#3FA34D; --grape:#7A4FD0; --rose:#E8577A;
  --font:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:calc(var(--u)*3) solid var(--sun);outline-offset:calc(var(--u)*2)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;width:360px;height:640px;overflow:hidden;background:#0E0907;border-radius:calc(var(--u)*6);--u:1px;font-size:calc(var(--u)*16)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*44);display:flex;align-items:center;gap:calc(var(--u)*6);padding:calc(var(--u)*6) calc(var(--u)*8);pointer-events:none}
#hud>*{pointer-events:auto}
.hb{width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:calc(var(--u)*12);background:rgba(20,12,8,.55);display:flex;align-items:center;justify-content:center;flex:none}
.hb>svg{width:58%;height:58%}
#hScore{flex:1;min-width:0;display:flex;align-items:center;gap:calc(var(--u)*6);justify-content:center}
#score{font-size:calc(var(--u)*24);font-weight:800;text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.45);font-variant-numeric:tabular-nums;line-height:1}
#mult{font-size:calc(var(--u)*15);font-weight:800;background:var(--mango);color:var(--ink);border-radius:calc(var(--u)*8);padding:0 calc(var(--u)*6);line-height:1.5}
#mult.hot{background:var(--rose);color:#fff}
#mult.pop{animation:pop .25s ease-out}
#timebar{position:absolute;left:calc(var(--u)*52);right:calc(var(--u)*52);top:calc(var(--u)*40);height:calc(var(--u)*4);background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
#timebar i{display:block;height:100%;width:0;background:var(--sun)}

/* prompt card: always spoken, big text */
#card{position:absolute;left:calc(var(--u)*10);right:calc(var(--u)*10);top:calc(var(--u)*50);min-height:calc(var(--u)*58);background:var(--paper);color:var(--ink);border-radius:calc(var(--u)*18);display:flex;align-items:center;gap:calc(var(--u)*8);padding:calc(var(--u)*6) calc(var(--u)*10) calc(var(--u)*6) calc(var(--u)*6);box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35)}
#card.flash{animation:cardin .3s ease-out}
.spk{width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:calc(var(--u)*14);background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 calc(var(--u)*3) 0 #2D7FB3}
.spk svg{width:62%;height:62%}
#cardBody{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);font-weight:800;font-size:calc(var(--u)*34);line-height:1.05;text-align:center;flex-wrap:wrap}
#cardBody .sm{font-size:calc(var(--u)*22)}
#cardBody .xs{font-size:calc(var(--u)*17);font-weight:700;color:var(--ink-soft)}
#cardBody>svg{max-height:calc(var(--u)*56);width:auto;max-width:100%}
#cardBody .slot{display:inline-flex;gap:calc(var(--u)*4)}
#cardBody .slot span{min-width:calc(var(--u)*30);border-bottom:calc(var(--u)*4) solid var(--ink-soft);text-align:center}
#cardBody .slot span.on{border-color:var(--leaf);color:var(--leaf)}

/* lane / target chips */
#chips{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*10);display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.chip{height:calc(var(--u)*62);border-radius:calc(var(--u)*16);background:rgba(255,247,234,.92);color:var(--ink);font-weight:800;font-size:calc(var(--u)*30);display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35);border:calc(var(--u)*3) solid transparent;line-height:1}
.chip>svg{height:82%;width:auto}
.chip.word{font-size:calc(var(--u)*24)}
.chip.on{border-color:var(--sun);transform:translateY(calc(var(--u)*-4))}
.chip.good{background:#C9F2C2;border-color:var(--leaf)}

#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-weight:800;font-size:calc(var(--u)*46);color:var(--sun);text-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.5),0 0 calc(var(--u)*18) rgba(0,0,0,.35);opacity:0}
#banner.show{animation:ban 1.1s ease-out forwards}
#banner.small{font-size:calc(var(--u)*30)}
@keyframes ban{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--u)*-20))}}
@keyframes pop{50%{transform:scale(1.35)}}
@keyframes cardin{0%{transform:translateY(calc(var(--u)*-14));opacity:.3}}

/* screens */
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#screen:empty{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;gap:calc(var(--u)*12);padding:calc(var(--u)*16) calc(var(--u)*14) calc(var(--u)*84);background:linear-gradient(180deg,rgba(26,17,12,.25),rgba(26,17,12,.82) 38%,rgba(26,17,12,.95))}
.scr.dim{background:rgba(26,17,12,.86);justify-content:center}
.logo{font-weight:800;font-size:calc(var(--u)*44);line-height:.95;color:var(--sun);text-shadow:0 calc(var(--u)*4) 0 #9A3B17;letter-spacing:.01em}
.logo small{display:block;font-size:calc(var(--u)*17);color:var(--paper);text-shadow:none;font-weight:700;letter-spacing:.02em;margin-top:calc(var(--u)*4)}
.toprow{display:flex;align-items:center;gap:calc(var(--u)*8)}
.coins{display:inline-flex;align-items:center;gap:calc(var(--u)*4);background:rgba(255,255,255,.1);border-radius:calc(var(--u)*12);padding:calc(var(--u)*3) calc(var(--u)*10) calc(var(--u)*3) calc(var(--u)*5);font-weight:800;font-size:calc(var(--u)*18);font-variant-numeric:tabular-nums}
.coins>svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.gcard{border-radius:calc(var(--u)*18);overflow:hidden;background:var(--panel);text-align:left;display:flex;flex-direction:column;box-shadow:0 calc(var(--u)*5) 0 rgba(0,0,0,.4);transition:transform .12s}
.gcard:active{transform:translateY(calc(var(--u)*3))}
.gcard canvas{width:100%;height:auto;display:block;aspect-ratio:16/10}
.gcard b{font-size:calc(var(--u)*18);padding:calc(var(--u)*6) calc(var(--u)*10) 0;line-height:1.1}
.gcard span{font-size:calc(var(--u)*13);padding:0 calc(var(--u)*10) calc(var(--u)*8);color:#D8C4AE;font-weight:600}
.btn{min-height:calc(var(--u)*56);border-radius:calc(var(--u)*18);background:var(--mango);color:var(--ink);font-weight:800;font-size:calc(var(--u)*24);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);box-shadow:0 calc(var(--u)*5) 0 #B66E0C;padding:0 calc(var(--u)*16)}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*2) 0 #B66E0C}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 calc(var(--u)*5) 0 #24702F;font-size:calc(var(--u)*30);min-height:calc(var(--u)*68)}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--paper);box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35);font-size:calc(var(--u)*19)}
.btn>svg{width:calc(var(--u)*26);height:calc(var(--u)*26)}
.row{display:flex;gap:calc(var(--u)*10)}
.row>*{flex:1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*96),1fr));gap:calc(var(--u)*8)}
.mode{min-height:calc(var(--u)*64);border-radius:calc(var(--u)*16);background:rgba(255,255,255,.1);font-weight:800;font-size:calc(var(--u)*18);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:calc(var(--u)*3) solid transparent}
.mode small{font-size:calc(var(--u)*13);font-weight:600;color:#D8C4AE}
.mode[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,212,71,.16)}
.h2{font-weight:800;font-size:calc(var(--u)*30);line-height:1.05;color:var(--sun)}
.sub{font-size:calc(var(--u)*16);color:#E9DBC8;font-weight:600;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.stat{background:rgba(255,255,255,.08);border-radius:calc(var(--u)*14);padding:calc(var(--u)*8) calc(var(--u)*4);text-align:center;font-size:calc(var(--u)*13);font-weight:700;color:#D8C4AE}
.stat b{display:block;color:var(--paper);font-size:calc(var(--u)*26);line-height:1.1;font-variant-numeric:tabular-nums}
.big{font-size:calc(var(--u)*64);font-weight:800;line-height:1;text-align:center;color:var(--paper);font-variant-numeric:tabular-nums}
.pb{background:var(--rose);color:#fff;border-radius:calc(var(--u)*10);padding:calc(var(--u)*2) calc(var(--u)*10);font-weight:800;align-self:center;animation:pop .5s ease-out 2}
.locker{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.item{border-radius:calc(var(--u)*14);background:rgba(255,255,255,.08);padding:calc(var(--u)*6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*13);font-weight:700;border:calc(var(--u)*3) solid transparent;min-height:calc(var(--u)*112)}
.item canvas{width:100%;height:auto;aspect-ratio:1}
.item.sel{border-color:var(--leaf)}
.item.locked{opacity:.6}
.item .cost{display:inline-flex;align-items:center;gap:calc(var(--u)*2);color:var(--sun)}
.item .cost svg{width:calc(var(--u)*14);height:calc(var(--u)*14)}
.sect{font-weight:800;font-size:calc(var(--u)*18);color:var(--paper);margin-top:calc(var(--u)*4)}
.unl{background:rgba(63,163,77,.25);border-radius:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*10);font-weight:700;font-size:calc(var(--u)*15)}
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*6)}
.bracket div{border-radius:calc(var(--u)*12);background:rgba(255,255,255,.08);padding:calc(var(--u)*6) calc(var(--u)*2);text-align:center;font-size:calc(var(--u)*12);font-weight:800;line-height:1.1}
.bracket div.done{background:rgba(63,163,77,.35)}
.bracket div.cur{outline:calc(var(--u)*3) solid var(--sun)}
.grown{position:absolute;left:calc(var(--u)*8);bottom:calc(var(--u)*8);width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;z-index:5}
.grown svg{width:60%;height:60%}
.grown .ring{position:absolute;inset:0;border-radius:50%;border:calc(var(--u)*3) solid var(--sun);clip-path:inset(0 100% 0 0)}
.grown.hold .ring{transition:clip-path .7s linear;clip-path:inset(0 0 0 0)}

/* coach tip between rounds */
#tip{position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:calc(var(--u)*16);gap:calc(var(--u)*10)}
#tip:empty{display:none}
#tip .h2{color:var(--soil)}
#tip .say{font-size:calc(var(--u)*22);font-weight:700;line-height:1.25;min-height:calc(var(--u)*56)}
#tip .vis{flex:1;display:flex;align-items:center;justify-content:center;background:#FBEBD2;border-radius:calc(var(--u)*18);padding:calc(var(--u)*10);min-height:0}
#tip .vis>svg{width:100%;height:100%;max-height:calc(var(--u)*300)}
#tip .bar{height:calc(var(--u)*8);background:#EAD9C2;border-radius:9px;overflow:hidden}
#tip .bar i{display:block;height:100%;background:var(--leaf);width:0}
#tip .claude{font-size:calc(var(--u)*18);font-weight:700;color:var(--ink-soft);min-height:calc(var(--u)*24)}

/* Kidi the AI tutor */
#tutor{position:absolute;left:0;right:0;bottom:0;top:calc(var(--u)*120);background:var(--paper);color:var(--ink);border-radius:calc(var(--u)*24) calc(var(--u)*24) 0 0;z-index:15;display:flex;flex-direction:column;padding:calc(var(--u)*12);gap:calc(var(--u)*8);box-shadow:0 calc(var(--u)*-8) calc(var(--u)*30) rgba(0,0,0,.4)}
#tutor .th{display:flex;align-items:center;gap:calc(var(--u)*8);font-weight:800;font-size:calc(var(--u)*20)}
#tutor .th button{margin-left:auto}
#tutor .q{background:#FBEBD2;border-radius:calc(var(--u)*14);padding:calc(var(--u)*6) calc(var(--u)*10);font-weight:800;font-size:calc(var(--u)*20);text-align:center}
#tutor .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*8);min-height:0;touch-action:pan-y}
#tutor .m{display:flex;gap:calc(var(--u)*6);align-items:flex-end}
#tutor .m .b{background:#DDF0FA;border-radius:calc(var(--u)*16) calc(var(--u)*16) calc(var(--u)*16) calc(var(--u)*4);padding:calc(var(--u)*7) calc(var(--u)*11);font-size:calc(var(--u)*18);line-height:1.3;font-weight:700;max-width:86%}
#tutor .m .b b{display:block;margin-top:calc(var(--u)*3)}
#tutor .m .b>svg{width:100%;height:auto;max-height:calc(var(--u)*120);display:block;margin-top:calc(var(--u)*4)}
#tutor .m.me{justify-content:flex-end}#tutor .m.me .b{background:#FCE3C4;border-radius:calc(var(--u)*16) calc(var(--u)*16) calc(var(--u)*4) calc(var(--u)*16)}
#tutor .asks{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8)}
#tutor .asks button{min-height:calc(var(--u)*52);border-radius:calc(var(--u)*14);background:#fff;border:calc(var(--u)*2) solid #E6D7C3;font-weight:800;font-size:calc(var(--u)*16);box-shadow:0 calc(var(--u)*3) 0 #E6D7C3}
#tutor .asks button:disabled{opacity:.5}
#tutor .dots i{display:inline-block;width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:#6E5644;margin:0 calc(var(--u)*2);animation:tdot 1.2s infinite}
#tutor .dots i:nth-child(2){animation-delay:.2s}#tutor .dots i:nth-child(3){animation-delay:.4s}
#tutor.full{top:0;border-radius:0}
#tutor .q{display:flex;align-items:center;gap:calc(var(--u)*8);justify-content:center}
#tutor .q svg{max-height:calc(var(--u)*56);width:auto;max-width:70%}
#tutor .tspk{width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:calc(var(--u)*10);background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#tutor .tspk>svg{width:60%;height:60%}
#tutor .m .b svg{max-width:100%}
#tutor .asks.opts{grid-template-columns:repeat(3,1fr)}
#tutor .asks button.opt{min-height:calc(var(--u)*64);font-size:calc(var(--u)*26)}
#tutor .asks button.opt>svg{height:calc(var(--u)*52);width:auto;max-width:100%}
#tutor .asks button.opt.word{font-size:calc(var(--u)*20)}
#tutor .trow{display:flex;gap:calc(var(--u)*6);align-items:center}
#tutor #tin{flex:1;min-width:0;height:calc(var(--u)*44);border-radius:calc(var(--u)*12);border:calc(var(--u)*2) solid #E6D7C3;padding:0 calc(var(--u)*10);font:inherit;font-size:calc(var(--u)*16);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
#tutor .tmic,#tutor .tsend{width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:calc(var(--u)*12);background:var(--leaf);display:flex;align-items:center;justify-content:center;flex:none}
#tutor .tmic{background:var(--rose)}#tutor .tmic.on{animation:pop .8s infinite}
#tutor .tmic>svg,#tutor .tsend>svg{width:60%;height:60%}
#tutor .pdots{display:flex;gap:calc(var(--u)*3)}#tutor .pdots i{width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;background:#E6D7C3}#tutor .pdots i.ok{background:var(--leaf)}#tutor .pdots i.miss{background:var(--mango)}
@keyframes tdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* the Kidi Help button, always at the bottom (hidden during play: games have their own Help) */
.kidifab{position:absolute;right:calc(var(--u)*12);bottom:calc(var(--u)*12);z-index:12;display:flex;align-items:center;gap:calc(var(--u)*6);height:calc(var(--u)*58);padding:0 calc(var(--u)*18) 0 calc(var(--u)*8);border-radius:calc(var(--u)*29);background:var(--sky);color:#fff;font-weight:800;font-size:calc(var(--u)*22);box-shadow:0 calc(var(--u)*5) 0 #2D7FB3,0 calc(var(--u)*8) calc(var(--u)*20) rgba(0,0,0,.35)}
.kidifab>svg{width:calc(var(--u)*44);height:calc(var(--u)*44);background:#fff;border-radius:50%}
.kidifab:active{transform:translateY(calc(var(--u)*3))}
/* grown-ups panel */
#parent{position:absolute;inset:0;background:#FFFDF8;color:var(--ink);overflow-y:auto;padding:calc(var(--u)*14);font-size:calc(var(--u)*14);line-height:1.35;z-index:20;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#parent h3{margin:calc(var(--u)*10) 0 calc(var(--u)*4);font-size:calc(var(--u)*17)}
#parent table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#parent td,#parent th{border-bottom:1px solid #E8DCCB;padding:calc(var(--u)*3) calc(var(--u)*2);text-align:left;vertical-align:top}
#parent th{font-size:calc(var(--u)*12);color:var(--ink-soft)}
#parent .pbar{height:calc(var(--u)*7);background:#EFE3D2;border-radius:6px;overflow:hidden;min-width:calc(var(--u)*50)}
#parent .pbar i{display:block;height:100%;background:var(--leaf)}
#parent .close{float:right;background:var(--ink);color:#fff;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*12);font-weight:800}
#parent .tag{display:inline-block;background:#FCE3C4;border-radius:6px;padding:0 calc(var(--u)*5);font-size:calc(var(--u)*12);font-weight:700}
#parent .muted{color:var(--ink-soft)}
#parent .warn{background:#F7D9CF;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*10);font-weight:800}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="wrap"><div id="stage">
  <canvas id="c" aria-label="Game"></canvas>
  <div id="hud" hidden>
    <button class="hb" id="hPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.5" fill="#fff"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5" fill="#fff"/></svg></button>
    <div id="hScore"><b id="score">0</b><span id="mult">x1</span></div>
    <button class="hb help" id="hHelp" aria-label="Help from Kidi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#56B4E9"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4 2.7c-.8.4-1.2.9-1.2 1.8v.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#fff"/></svg></button>
    <button class="hb" id="hMusic" aria-label="Music"></button>
    <div id="timebar"><i></i></div>
  </div>
  <div id="card" hidden><button class="spk" id="replay" aria-label="Hear it again"></button><div id="cardBody"></div></div>
  <div id="chips" hidden></div>
  <div id="banner" aria-live="polite"></div>

    river: { bpm: 122, root: 52, prog: [0, 5, 9, 7], scale: [0, 2, 4, 7, 9, 12, 14, 16], swing: .12 },

function wearTap(id) {
